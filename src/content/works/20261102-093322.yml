title: 赤澳风情
cp:
  - 曹陆
updated: 2026-11-02
summary: 一个恋爱脑的自我攻略
status: finished
chapters:
  - body: |-
      　　曹元元第一次见到陆志廉，是在赤澳的一个夏天。

      　　彼时他刚因争地之事被关进赤澳不到三年，那些人找不到他杀人的证据，只能寻些不痛不痒的由头把他扣在这里。但这对于那时候的曹元元不是什么大事，他的钱大把，不过是花点钱，打点打点关系，他很快就能出去。

      　　赤澳建在一片光秃秃的岛上，四面都环海。岛上植被不多，只有几栋矮矮的楼，由一圈高大的铁丝网围起来。然而就在这鸟不拉屎之地，却坐落了一座设施完整的监狱。宿舍、食堂、公园、劳作坊，他们甚至还拥有一个小篮球场。当然，也是被铁丝网围起来的，犯人们平时就在这里打篮球，或者做些别的什么活动。

      　　所谓别的活动，也被称作大party。当时的赤澳被分为两派，一边跟着从前纪律部被撤下来的黄老邪，另一边便是跟着他曹元元。每逢大party，赤澳里的犯人并一小撮教署便会在这两派中选一个下注，再从两边各挑出一个人来互殴。哪个打赢了，哪边就赢了赌局。

      　　于是就在这样一个普普通通的，对曹元元来说甚至有些无聊的大party中的午后，他见到了陆志廉。

      　　那天的早些时候曹元元就听说有新的白手要来。他本不以为意，在赤澳的这三年，总归都要有人来来往往。这个进来，那个出去，没什么稀奇。但那天的操场被太阳晒得金灿灿，午后的风也吹得暖洋洋，在这阵风里，曹元元盖在眼睛上的刘海被吹起了一撮。他难得不再打瞌睡，而是睁眼去看，正巧看见那个新来的被人从人群里抓出来，要他去评判今天的赌局哪边赢。

      　　他在看那个白手，那个白手也在看他，黢黑的脸上一派平和，一点没有作为新人被揪出来架在火上烤的慌乱，只是眼神有些无奈，平静得甚至像在看两波中学生打架。

      　　不过下一刻他就看到对方给那两个倒霉的互殴代表一人肚子上来了一拳，打曹元元那一方的时候出拳略轻，让他赢了赌局。曹元元这一派的人顿时爆出欢呼，那人却一言不发地重新回到操场边上坐下来，像块闷声石头。

      　　曹元元笑了。原来他叫陆志廉。



      　　曹元元又想起了陆志廉那宽阔的脊背和紧实的腰线，肌肉时刻紧绷着，引着视线蜿蜒埋入蜜色的股沟。

      　　在监狱里，洗澡总是一件危险的事，假使你落了单的话。曹元元从不落单，他身边总是跟着三两个他用钱收买的小弟。但这并不妨碍他观赏其他落了单了犯人，在此刻，指的便是陆志廉。

      　　曹元元并不十分喜欢男人，但也不排斥，只是这方面他一向没什么偏好。元少从来声色犬马，男男女女在他眼里，都不过是肉体罢了。然而此刻，他却坐在浴室的角落里，目不转睛地看着低头冲澡的陆志廉。看那些水珠从花洒头落下来，顺着那赤裸的胸膛，一直坠入紧致而隐秘的腰腹之下。

      　　他最喜欢陆志廉的那两条腿。粗壮又有力，若是与人打架，说不定能将对手的脖子夹断。可曹元元并不十分想看他打架，他更想看那两条腿夹点别的什么东西。比如男人的腰，又或者是鸡巴。

      　　那两条腿往上，便是一个四四方方的臀，又结实又挺翘，小麦色的臀瓣绷得紧紧的，充斥着数不尽的肉欲和力量。曹元元动了动手指，不觉心头有些痒。他忽然生出一种想法，他想陆志廉转过去，弯下腰，这样那两片臀瓣便会因为这个动作微微分开，让他窥见里面更深的地方。

      　　对曹元元这些阴暗想法一无所知的陆志廉终于冲完了澡，毛巾搭在肩上，走到储物柜旁边去穿自己的囚服。他穿裤子的时候曹元元毫不掩饰地盯着他看，陆志廉似有所感地往这边望了一眼，却没看到什么，只见到曹元元带着一个跟班懒懒散散走出浴室的背影，于是也就作罢，只坐在凳子上继续穿衣服，想不通刚刚那阵针扎一样的目光到底从哪来的。

      　　曹元元并不担心陆志廉会知道那是来自自己的目光，因为很快他就顾不上想这些了。一个黄老邪的手下突然从后面用一条毛巾勒住了陆志廉的脖子，另几个人随即扑上去，把陆志廉拖入了一场混乱的打斗中。

      　　事不关己的曹元元站在楼梯口，面无表情地看着陆志廉与旁人缠斗。他没打算过去多管闲事——他为什么要呢？陆志廉一看就不是打不过，而且他不是曹元元的人，曹元元用不着去管。

      　　但他还是没有走。只是立在那里，姿态像在看跑马。

      　　正如他跟班嘀咕的一样，陆志廉看起来的确很能打。不过曹元元没想那么多，他只觉得猜对了，陆志廉那两条腿果然有力，不知道用来腿交会是什么样。

      　　这场打斗最终以教员回到浴室而告终，黄老邪被拧了胳膊，陆志廉也没讨到多少好。几人坐在幸存的凳子上对着浴室中间地上的那堆烂木头喘粗气，随后被问不出烂木头是怎么变成烂木头的教员轰出了浴室。出浴室的时候曹元元多看了一眼陆志廉，正巧碰上陆志廉也在看他，脸上仍带着平和的笑。

      　　曹元元无动于衷地盯着他看了一阵，转身走了。

      　　只不过转过身时他有些恶意地想，陆志廉身上多少得被打出点淤伤。

      　　监狱里的生活相当无趣，每日不过三餐饭，中间穿插着一些劳务改造，像打扫卫生、手工什么的。作为“太子党”的领头，曹元元自然可以逃掉大部分的劳动，在手工坊里睡大觉，在捡垃圾时晒太阳是他的一贯操作。

      　　但他也没闲着。曹元元对陆志廉的暗中观测还在继续。

      　　和赤澳的生活一样，陆志廉过得也可谓是十分无趣。不同于大部分刚来坐牢的新人，他并没有加入曹元元或者黄老邪任意一边，而是选择中立，和老油条王蓝禄混在了一起。

      　　这其实很不同寻常，尤其是他才被黄老邪那群人找了麻烦。可陆志廉就真的一声不吭，并不来找曹元元的庇护，只是每天本本分分做完自己的劳动，按时准点地吃饭，晚上四平八稳躺在床上睡觉，偶尔和王蓝禄聊两句，让偷偷观察他的曹元元莫名有些不爽。

      　　倒不是说曹元元缺他这一个手下。但总之……

      　　曹元元拒绝去想。一个陆志廉而已，也值得他曹元元分神吗？

      　　他迟早得来求他。曹元元这样想。

      　　但话虽如此说，这天晚上，当曹元元一如往常歪在床上对着马报勾勾画画的时候，他还是留了一耳朵去听陆志廉那边的动静。

      　　陆志廉今天睡得很早，仍旧是那个有些无趣的睡姿，盖着被子平平躺着，多看一眼都觉得乏味。可曹元元偏偏把目光挪不开。他举着马报挡住自己半张脸，看见王蓝禄悄摸声走到陆志廉床边，刚要说什么，就被后者一巴掌糊在了地上。

      　　活该。曹元元有些幸灾乐祸地咬开了一袋啤酒，倒忘了他自己偷听这事也属于偷偷摸摸。

      　　他听到王蓝禄说了些诸如道歉之类的话，大概是指之前浴室里为了应付黄老邪不得已做样子踢陆志廉一脚的事。陆志廉给了他块手绢擦鼻血，他便向黄老邪床位那边努努嘴：“是仇家呀？”

      　　陆志廉笑了笑，不置可否，王蓝禄又说：“那你就不能做旁观者啦。不如跟元少那边吧，有好处。”

      　　曹元元的耳朵在听到“元少”两个字的时候就竖了起来。他很想知道陆志廉怎么作答。他倒不怕陆志廉贪图他的好处，在赤澳谁跟着他不是为了好处？他曹元元最不缺的就是这个。只是他更想知道，像陆志廉这么乏味的人，究竟会想要什么。

      　　不过陆志廉最终还是没有回答，没说跟他，也没说不跟他。曹元元有些失望，但他还是觉得，陆志廉早晚会是他的人。只看他能撑到什么时候罢了。到那一天，曹元元叫他做什么都得。

      　　他这样想着，就又想起陆志廉冲澡时那对沾着水珠肩膀来。曹元元烦躁地翻了个身，莫名地觉得自己的裤子有些紧。

      　　到时候要求陆志廉给他咬一口肩膀是不是有点丢人？曹元元乱七八糟地想着。总之都是陆志廉的错，陆志廉该负责的。

      　　曹元元又看了一眼陆志廉的床铺，后者已结束了闲聊，重新躺回被子里睡觉了。曹元元一见他那个连呼吸都规矩得四平八稳的模样就烦，他移开视线，轻轻吐出一口气，认命地把手伸进裤子里，在陆志廉又轻又稳的呼吸中达到了高潮。
  - body: |-
      　　监狱里的伙食一向不怎么样。总是来来回回的几个素菜，一周只有一次有牛肉丸吃。早餐就更不用说，每人一小碗粥并几根菜毛，粥稀得连米都吝啬多放。

      　　骄奢淫逸的富二代曹元元自然是不会赏脸吃这种饭的，他自有开小灶的机会。所以每天早餐的时候，他都格外地悠闲。不用像其他犯人一样为了不挨饿抓紧时间吃饭，这让曹元元有了更多的时间去干他想干的事。

      　　比如观察陆志廉。

      　　前些天挨了一顿打的陆志廉看起来并无什么大碍，依旧行动自如，正对着他的那份铁餐盘闷不做声地吃饭。和他的人一样，陆志廉吃相十分板正，也很迅速，显然对盘子里那几根咸菜的味道并不挑剔。曹元元看得心痒，他无端地想坐过去舔一口陆志廉的后脖颈，看看他还能不能把那碗粥顺顺当当咽下去。

      　　曹元元这么想着，也就这么做了。只是他刚准备站起来，食堂的铁门便嘎吱一声打开，惩教带着几个穿西装的人走进来。曹元元扭头扫了一眼，认出为首的是那个之前争地案中咬着他不放的刘保强。

      　　“例行视察！都老实坐好。”他听见惩教的教棍在桌子上梆梆敲了两下，接着是一连串恭敬的“Sir”。曹元元连头都懒得抬，他吹了下刘海，对面的马仔心领神会，抓起一个牛肉丸向刘保强扔过去，精准地命中对方那看起来价格不菲的领带。

      　　曹元元必须得承认，这么做还是颇有娱乐性的。尤其是当听到那几句此起彼伏的“干什么！”“谁干的！”“吃不饱阿Sir拿不稳”的时候。不过随之而来的代价就是他被面色不虞的刘保强给拎了出来，还附加了几句迟早整死你之类的废话。曹元元懒得看他那张脸，下巴一转，目光就又挪到陆志廉身上去了。

      　　陆志廉仍在喝他那碗白水似的粥，而且已经快要喝完。他似乎发现了曹元元正在看他，望了一眼小鸡仔一样被拍打脸蛋的曹元元，屁股往后一撤就站了起来。他站起来的时候还没忘记把手里喝粥的勺竖过来整齐摆在餐盘上，曹元元在心里翻白眼，他怀疑陆志廉有那个强迫症。

      　　“阿Sir，”疑似有强迫症的陆志廉语调平平，似乎只是在对着报纸发表意见，“你当众拍打犯人的脸还恐吓，不合规矩吧。”

      　　刘保强噎了一下，倒是把手收回去了。陆志廉也被教署喝令坐了回去。视察的人散去后曹元元绷着脸训了几句刚刚还不如陆志廉有眼色的手下，心里倒有些窃喜。

      　　他想，陆志廉，你还不是得来投靠我。

      　　心情很不错的曹元元费了好大一番功夫才把嘴角压下去。等到吃完了饭，返仓的时候他特地选择从陆志廉身边过。食堂人多拥挤，陆志廉被人群挤到座位上，站在那里，老实得像块石头。

      　　可体温却不像石头。陆志廉身上暖烘烘的，又干又热，像平白立在那里了一座暖炉。曹元元被他烧得口干舌燥，却又舍不得走开，费了好大功夫才把那股想要埋在陆志廉颈窝咬破他的锁骨的冲动压下去。

      　　他看了陆志廉一眼，后者仍在那里站着，对曹元元想要咬破他锁骨的事一无所知。于是曹元元的好心情变成了烦躁，嘴里的话一转弯也冷淡了下来。他凑近陆志廉，陆志廉的呼吸轻轻触到他的脸颊，他们的距离一下子离得很近，近到曹元元几乎可以闻到陆志廉衣服上肥皂水的味道。

      　　他警告道：“别以为帮了我就是我的人了。”

      　　然而陆志廉只是笑了笑，说他只是看不过眼罢了。曹元元信他才有鬼，他抬腿便走，把陆志廉留在了身后。与之一同留下的还有陆志廉身上那阵干燥温暖的体温。

      　　曹元元决定从今天开始讨厌陆志廉。

      　　食堂的那一点小风波很快就没人再提起，几个马仔也很识趣地不去触曹元元的霉头。生活仍在继续，日历又被人往后多画了几个叉，而曹元元讨厌陆志廉的计划也如期进行着。

      　　虽然进行得不怎么顺利。

      　　即使已经决定了不再向陆志廉投以任何关注，陆志廉却仍然时不时地出现在他的视线内。食堂内，操场上，手工坊里，似乎刻意的一样，陆志廉总与他擦肩而过。

      　　曹元元起初以为陆志廉也像他一样在悄悄观察他，可每次突然转头看他，陆志廉却都在专注地干自己的事，从未往曹元元的方向瞥过一眼。曹元元不由地气闷，次数多了，倒像是他有多在意陆志廉似的。

      　　都怪陆志廉，曹元元这样想。他把手里抄写好赌马下注的信息偷偷塞给钱国丰，从后者手里领了篮球往操场走。到了操场的时候他下意识看了一眼环视了一下四周，不出意外地看到了陆志廉一个人坐在操场边上发呆。曹元元没说话，指挥几个马仔各自站好准备打球。之前连着几天下雨没出来放风，他都快在仓里憋得长出蘑菇。

      　　只是打着打着，他又突然看不惯陆志廉那副安乐的样子了。曹元元抢过球跳起来投篮，却不是向篮网的方向，而是冲着陆志廉把球丢了过去。

      　　他是想砸陆志廉一下的，只不过到底没用力扔，球被陆志廉轻轻松松接住了。望着篮球场发呆被打断的陆志廉低头看了一眼手里的球，又看了一眼曹元元，笑了一下，把球抛了回去。

      　　没意思。曹元元撇了撇嘴。他扭过头不再搭理陆志廉，却又忍不住惦念陆志廉那被夏日的风吹得掀起一个角的衣领。

      　　笑什么笑，他就不能自己把那领子拉平吗。



      　　就像所有故事一样，曹元元的故事里有主人翁，有他会在意的重要角色，自然也会有搅屎棍。

      　　黄老邪就是他的那个搅屎棍。

      　　曹元元的篮球打得一向不错，在国外读书时，他还曾经在大学的篮球队呆过那么一两年。或许是因为难得晴朗的天气，又或许是因为他不想承认的陆志廉在篮球场边上坐着的缘故，他今天发挥很好。短短二十分钟的时间他已经投中好几个三分球，给他那一队拿了不少分。等到了中场休息，曹元元抓着毛巾擦了一下被汗水浸得湿淋淋的脸，不禁又回头看了一眼陆志廉。他知道陆志廉还在那里，他想看看陆志廉看完有他上场的半场球赛脸上会有什么表情。

      　　结果他一回头，靠近粉色月季丛的铁网那不只坐了陆志廉，还有一个黄老邪。

      　　黄老邪，人如其名，一直是曹元元的监狱生活中一个惹人讨厌的元素。曹元元一向看他不顺眼。经过浴室那一回，他已经知道陆志廉必定同黄文彬有些什么恩怨，不然一个新来的陆志廉而已，仅仅因为他不想站队就被黄文彬一伙人按着打？想想也觉得不可能。

      　　曹元元不知道他们有什么旧怨，不过他有些嫌弃。陆志廉这么个闷瓜，居然也敢去惹警署纪律部的人。活该，曹元元这样总结。但即使他这么想着，在看见黄文彬搂着陆志廉的脖子说着些什么的时候，他还是把手里的篮球往旁边一掷，带着一群手下朝陆志廉走了过去。

      　　陆志廉那副表情一看就是被威胁了。他上次帮过自己，曹元元才不要欠他人情。

      　　黄文彬胳膊还围在陆志廉脖子上，像条碍眼的围巾。曹元元看着不顺眼，他抬抬手，让黄、陆二人被结结实实地围住，自己则踱步过来，在黄文彬面前站定，挡住了他头顶上最后一道光：“做乜啊？收小弟啊？”

      　　黄文彬瞄了陆志廉一眼，没置可否，只哼笑道：“有人求我原谅呢。”

      　　曹元元却只盯着陆志廉看，想从他那张黑黢黢的脸上找出一点惶恐。

      　　不过他失败了。陆志廉并不慌乱，被一群人围住了也只是平静地坐在那里，好像有曹元元、黄老邪在身边和没有他们在身边都没什么分别。

      　　曹元元觉他无趣，便拧过脖子去看黄文彬。他们人多势众，黄文彬没跟他们纠缠，耸了耸肩，走了。

      　　曹元元面无表情地盯着他走掉，然后俯下身，贴近陆志廉的脸，嘴唇快要挨到陆志廉的鼻尖，冷冰冰道：“还你的。”

      　　说的是那次在食堂陆志廉帮他说话的事。

      　　他说完便又站直了身，似乎只是不想让陆志廉误以为他除了还人情以外还对他有什么多余的兴趣一样。但陆志廉只是仰头对他笑笑以示感激，却没多说什么，起身绕过他离开了篮球场。

      　　曹元元冷着脸，捻了捻手指。

      　　陆志廉那衣领还是翘的。
  - body: |-
      　　曹元元本以为他会一直讨厌陆志廉，又或者在三个月出狱后将这块又闷又硬的石头抛之脑后。毕竟，陆志廉只是陆志廉，除了黑一点，能打一点，似乎也并没有什么好处。

      　　但他没想到陆志廉会救他。

      　　曹元元对陆志廉的那点说不清道不明的讨厌最终消失在一场监狱厨房中的恶斗之中，以陆志廉倒在他怀里，腰腹上插了一柄牙刷为代价。陆志廉倒下去的时候曹元元甚至还没反应过来，他只是听到了一声沉闷的声音、一种刀尖刺破皮肉的细响，然后是重量。陆志廉的体重毫无保留地压在他身上，又沉又热地靠着他的前胸。他看到陆志廉的头垂了下去，身体没支撑似的往地上滑。曹元元想不了那么许多，他伸手一捞，陆志廉就在他怀里了。

      　　曹元元猜想自己脑子里的那根弦大概断了那么一两秒，因为等他回过神来的时候他已被两个惩教死死拉住，而一个刚刚同他们打架的黄文彬的马仔则奄奄一息地伏在地上。但这并不重要。曹元元抬起头，刘海汗津津地贴在他额前。透过那撮刘海，他望向屋子的另一边，陆志廉的方向。

      　　陆志廉仍皱着眉闭眼倒在墙边，安安静静的，一只手搭在腹前的伤口上，像个乖乖的小手办。曹元元盯着他，看着他被赶来的医护人员抬上担架，看着他原本躺的地方空出的本该有的陆志廉的形状，又想起陆志廉奋不顾身挡在他前面时因为痛楚闷闷哼的那一声。

      　　他破天荒般地、头一次地想，原来像陆志廉这样又闷又硬的石头，也能流出那么多血。



      　　陆志廉被送离赤澳的第四天，曹元元已经习惯了属于他的那张床位空出来，等到又过了两天，他便连想着陆志廉的脸帮自己打出来都学会了。

      　　而今天则是陆志廉不在赤澳的第七天。

      　　这天的早些时候，曹元元便已将日历上的数字又划去了一日。监狱里的时间过得没有痕迹，每天重复着一样的日程，今日和明日都没有太大分别。故而从陆志廉被送去医院的那一天起，曹元元便每天都雷打不动地进行这项划日历的活动。因为只有通过这种方式，他才能计算陆志廉到底离开了多久。

      　　曹元元猜想陆志廉应该快回来了。因为在陆志廉之前，也有一些囚犯因为受伤生病被送出赤澳，但以往的那些人即使伤得再重也没有离开监狱超过十天的，除非是病得快死了。他希望陆志廉不是病得快死的其中的一个。倒不是说他有多担心陆志廉，只是那里凭白空出一张床来，看起来总是让人不爽。

      　　曹元元烦躁地抓了抓刘海，他觉得陆志廉把强迫症给他传染上了。

      　　陆志廉不在，曹元元也没有了心思看马报。他早早上床睡下，却没有半点睡意，瞪着架子床板看了一会儿，最终决定还是像前面几天一样进行他每天晚上的固定节目：想着陆志廉的脸打飞机。

      　　曹元元最近总想起陆志廉挡在他前面的那一刻，想起他的后背贴上自己的身体时是如何紧绷的，而那个窄窄的后腰又挺起了怎样一个弧度。曹元元记得他身上很暖，被他捞进怀里时搂着的腰腹也意外地柔软。他又想起陆志廉冲出来救他前窗下的那对尖耳朵，便更加觉得口渴。他迟早要咬一口那只耳朵，曹元元想，他好奇当他咬上它们的时候陆志廉会不会打抖。

      　　他觉得他会的。曹元元哼笑一声，他把手蜷成一个O形，握住茎身，想象那是陆志廉的嘴在包裹着它。也不知是不是他锻炼过度的缘故，陆志廉身上一直热热的。曹元元猜想他口腔的也一定如他的身子一样又热又软和。他想看陆志廉那张总板板正正的脸被阴茎撑得变形，一呼一吸间全是阴茎的味道，却仍闷着一声不吭。曹元元只要想一想便觉得又硬了几分。

      　　他也想起了陆志廉的那双眼睛。陆志廉有一对大眼睛，牛犊似的，当他跪在地上口交的时候，眼睛就会睁得更大。而当那对眼注视的是他曹元元时，曹元元就会把阴茎塞进陆志廉那张湿软温热的嘴，用力肏他的喉咙。陆志廉被他肏得干呕，那双眼睛被顶得泛水。但曹元元不是什么体贴的床伴，不会顺着他的意停下。他只会更加恶意地顶弄陆志廉的喉眼，扯着他的头发，强迫他吃下他射出来的所有精液。

      　　也或许不是所有。曹元元用手帮自己射出来时想。比起那个，他更想把精液射到陆志廉那张不讨他喜欢的脸上。脸都被他的精液弄脏，看陆志廉以后还怎么在他面前扮石头。

      　　曹元元长长吐出一口气，打散了这些乱七八糟的幻想。他扭过头，看向陆志廉那张空空荡荡的床铺。虽然不愿承认，但此时曹元元是真的有些希望陆志廉可以在那里躺着。睡得沉闷无趣也好，不怎么搭理曹元元也罢，只要他在那里，曹元元能看到他。

      　　曹元元想，或许他也没那么讨厌陆志廉。



      　　终于，陆志廉在一个雨天回到了赤澳。他回来的那天曹元元刚派人挑事，害得黄老邪那群人的禁闭又再多加了几天。他想得也很简单，陆志廉不在是他们害的。而少了那个闷石头，元少的监狱生活没滋没味了许多。

      　　狱警开门的时候曹元元正跪在地上找拖鞋。他有一只拖鞋掉到对面的那张空床铺下了。也正因如此，他才没让陆志廉看见他甫一进门曹元元就忍不住抬头看他的丑事。但即便这样，陆志廉走过来的时候他还是没忍住多看了几眼。在医院住了几天的陆志廉比之前又干巴了不少，曹元元猜大概是他肚子上那个伤口让他被迫忌了几天口。从他一瘸一拐地走路方式来看，大概是刚刚又挨了一顿打。元少还是头一回知道有人能招人讨厌到这种地步，但他转念一想，陆志廉遭报复也是为了救他，他也就幸灾乐祸不下去了。

      　　陆志廉抱着被子慢吞吞走回自己的床铺，没看曹元元一眼。曹元元也不在意。他捡回了鞋，便又坐回自己床上读他的马报。那边传来陆志廉窸窸窣窣铺床的声音，像是准备睡了。曹元元收了马报，也一头倒在床上。这仓里的人都唯他马首是瞻，他要睡觉别人便不敢不睡，于是没过几分钟，便纷纷熄灯睡觉，比外面国中的住宿生还迅速。

      　　而等到所有人都睡下，曹元元却又睁开了眼。他望向陆志廉的方向。陆志廉的呼吸平缓，像是睡着了一样。可曹元元知道他没睡，因为在曹元元走到他床边的时候，他明显身子紧绷了起来。曹元元毫不怀疑，若他再向前多走一步，陆志廉的拳头就会挥到他脸上。

      　　曹元元在陆志廉床边站了很久，久到陆志廉几乎要忍不住翻身过来时才一掀被子，挤进了陆志廉的床。

      　　陆志廉的背肌更僵了，但他还是没说话，也没动手。曹元元从后面环住他，手掌覆上他伤口的位置。曹元元摸了那个伤口两下，突然问：“你犯了什么事进来的？”

      　　陆志廉沉默了一下：“危险驾驶。”

      　　“以前做什么的？”

      　　“保安经理。”

      　　“以前在哪家公司做事？”

      　　陆志廉不说话了。曹元元吐出一口气，又去抠他那个快要长好的伤口。陆志廉捉住他那只作乱的手：“元少。”

      　　曹元元把手撤了。他站起来。“明天吃完饭去洗澡。”他道，“有话同你讲。”
  - body: |-
      　　第二天吃过午饭，曹元元便扔下一众跟班，大摇大摆地率先走出食堂，往平日冲澡的浴室去。

      　　时间是特意选择过的。赤澳的犯人并不是每日都可以冲凉，只有每逢周一、三、五、七这四天先可以集中洗澡。但元少的钱大把，能买来的好处自然也大把。今天是周二，他一早和钱国丰打过招呼，这天只有他可以用浴室。如果陆志廉要来，也别拦着他。

      　　曹元元并不担心陆志廉不来。毕竟在这里的犯人，除了黄文彬那一派的，还没有他曹元元指挥不动的人。但他不想屈尊去叫陆志廉。他昨天晚上已经把话说到，陆志廉识趣的话……陆志廉爱来不来！

      　　但话虽如此，当曹元元坐在浴室里的时候他还是忍不住恶狠狠瞪了几眼门口空荡荡的楼梯。如果陆志廉不来，那他非得……

      　　曹元元没想完他非得怎么样。

      　　因为陆志廉来了。

      　　陆志廉是带着毛巾和洗澡筐来的，里面还塞了瓶沐浴液。曹元元气得想笑。合着他迟到这么久，就为了去拿这些！但元少此刻却没心情计较这些，他有更重要的事要做。他指指一旁的长凳，示意陆志廉把东西放到那，又勾勾手，叫陆志廉到他跟前来。在这个过程中，他的视线一直死死黏在陆志廉身上。若是目光能当刀子使，恐怕陆志廉身上又得新多出几个窟窿。

      　　但陆志廉却没说什么。他笑了笑，照做了。只是弯腰放篮子时动作略有凝滞。曹元元猜那是因为他肚子上的伤。这让他没来由地烦躁起来。曹元元不喜欢陆志廉这样，于是道：“除衫。”

      　　陆志廉看了他一眼，没动。曹元元心情更坏：“除衫。别让我再讲多次。”

      　　陆志廉不动，曹元元也不动。但视线却没移开，依旧瞪着他。二人僵持了会儿，陆志廉开始慢吞吞解他的扣子。曹元元却没那个耐心。他上手去扒。监狱的衣服不怎么结实，被这么一扯，扣子掉了一地。

      　　陆志廉叹了口气：“元少……”

      　　曹元元头也不抬：“回头叫他们帮你补。”

      　　曹元元在看陆志廉那个为他挡下来的伤口。监狱里不准有刀具，打架的利器最多只是牙刷。也幸亏如此，陆志廉才能只是短短修养十来日便重新回来坐监。可曹元元依旧记得牙刷柄插进陆志廉皮肉时的闷响，和陆志廉流的那些血。他揭开那块贴在伤口上的纱布，露出里面堪堪结痂的伤口：“为什么还没好？”

      　　他这话说得颇有些无理取闹，甚至带了点指责。但陆志廉只是笑了笑，道缝了三针，还有得长好。又说医生话不能沾水，最近都没法洗澡了。

      　　曹元元还在盯着那个伤口瞧。他听见这里是缝了针的，便更加手痒想把它抠开，让它当着自己的面再重新长一次。但他不想陆志廉再被拉去医院十几天了，就没动：“那你带洗浴筐干什么？”

      　　陆志廉仍然只是平静地笑：“我看元少来的时候没带毛巾和沐浴露，就回去拿了我的。”

      　　曹元元不说话了，嘴角却翘了起来。原来陆志廉还是为了他。他又想起陆志廉此前住院也是为了他，心里便更加高兴，连看着陆志廉那个长出些许嫩茬的可怖伤口都觉得顺眼了许多。他把手掌按在那个伤口上，没用力，陆志廉呼吸带来的起伏在他掌心下翕动。他想，其实他也不是不可以对陆志廉好一点。他不久就能从这里出去，到加拿大，陆志廉虽然闷了点，也不知识不识讲英文，但他够能打。他中意的话，曹元元可以让他给自己做保镖。就像现在一样。

      　　只是陆志廉为什么不愿意说他以前是做什么的？想到这个，曹元元又不满了。难道他以为曹元元想知道的事，只要他不讲，曹元元就不会知道吗？

      　　事实上曹元元当然会知道。他早上一起床，第一件事就是冲到了沈国强的办公室要他给自己查陆志廉的底。只不过沈国强不太配合。所以他后来又找了钱国丰，让他去找老姚办这件事。

      　　他同钱国丰交代的时候陆志廉正在不远处和几个犯人玩篮球，曹元元看得心痒，便更加没心情和钱国丰多作废话。陆志廉怎么连抛球都像个老老实实的闷嘴葫芦？曹元元无端端又想起那次他帮陆志廉解围时陆志廉那片翘起的衣领来。他想，要是这次他伸手去把那片衣领压平，陆志廉应当不会再躲了吧。

      　　他三两句交代完，扔下钱国丰就想去找陆志廉。可陆志廉却不知怎么回事脱手把篮球抛到了铁丝网上。笨手笨脚，他想。可元少并不担心。总归陆志廉现在是他的人，钱国丰为难他，曹元元也总有办法搞定。他这会儿倒是没想着陆志廉怎么就算他的人了。左不过中午他就要找陆志廉说这件事，陆志廉舍命救他，他要陆志廉跟他，难道陆志廉还能拒绝不成？

      　　陆志廉还在原地像块石头一样立着。暮夏的风顺着窗户溜进来，吹得石头也微微瑟缩。曹元元盯着陆志廉那干巴的上半身瞧了半晌，怎么看怎么觉得不合心意。都八月了，只是除衫吹阵风，就觉得冷么。

      　　他这样想着，手上便不自觉用了些力气，三两步把陆志廉推到了一旁的淋浴隔间。陆志廉光裸的脊背砰得一声撞上隔间冰凉凉的挡板，又是一下冷颤。曹元元本能地就想去开淋浴头，却又想起陆志廉不能沾水，索性自己贴了上去，不快道：“以后午餐多吃一个牛肉丸。”

      　　“？”

      　　陆志廉没明白曹元元这没头没尾的话是从哪儿来的，但他很明智地没有选择反驳。曹元元安静了几秒，又突然恶狠狠出声：“晚餐也是。”

      　　陆志廉想说赤澳的牛肉丸一日只有一个，可他又想起来上次曹元元吃下午茶的事。所以或许多一个牛肉丸对他来说也不是难事。他在心里记下，打算从这里出去了再去打探打探给曹元元加餐的是哪几个惩教。

      　　但他面上却不显，只笑了一下：“那就多谢元少了。”

      　　曹元元却不觉得这有什么可多谢的。平心而论，元少其实是个很公平的人。在这里，或是在外面，只要跟着他曹元元做事，不出卖他，曹元元从来不会吝啬给对方好处。只是陆志廉……他又贪恋起陆志廉那对尖耳朵来。他盯着那对耳朵，想起那日被陆志廉救时它们也是这样出现在墙下的，便更觉口干舌燥，心念一动，咬了上去。

      　　陆志廉僵了一下，然后试图挪动身子。曹元元不想他动，他侧过脸，对着陆志廉耳侧提醒道：“报酬。”

      　　陆志廉身子更紧绷了。但紧接着，几乎是强迫性地，他的身体放松下来，曹元元听到他故作轻松的声：“元少，别玩我了。”

      　　这让曹元元的脸色冷下来。他放开陆志廉，退后几步，让出隔间的出口来。

      　　他想，陆志廉也没什么好的。
  - body: |-
      　　曹元元很不满陆志廉拒绝自己的事。虽然陆志廉没有明说，但他的抗拒却是货真价实的。

      　　在此之前，曹元元一直以为陆志廉总归是对他有一些什么的——不然他为什么几次三番帮曹元元解围，甚至还为了曹元元在自己肚子上开了个洞？也是因为如此，曹元元才会决定对他稍作亲近，以嘉奖他的忠诚。

      　　可陆志廉居然拒绝他！陆志廉为什么要这么做？曹元元不禁恼火起来。他想到陆志廉被他咬了耳朵时的紧绷，想起陆志廉试图打岔把这件事晃荡过去的态度，便更觉陆志廉对他并不如他预想中的那样死心塌地。可他又想起陆志廉腰腹上那个还没愈合的、他亲手抚摸过的伤口，气恼便又跌落回去。这一口气卡在食管里，上不去又下不来，烧得曹元元寝食难安，一晚上没合拢眼。

      　　等到第二天早上起来，顶着一个大黑眼圈的曹元元自然对谁都没什么好气。小弟们不敢触他霉头，都躲得远远的。曹元元分神去看陆志廉，发现他居然也站在一个离曹元元恨不得隔了一个大西洋的位置，更是怒火中烧，只等着哪个不长眼的撞上来，即刻被元少绞杀在他的铁骑之下。



      　　曹元元没有等太久。

      　　他一到食堂便被人找了晦气。

      　　当时他们刚吃过早饭，曹元元又盘问了一遍陆志廉的来历，无果，还被人从背后用橙子砸了一下。陆志廉几乎把无可奉告写在了脸上，以慢条斯理地嚼东西的方式。

      　　曹元元看着他那个吃饭的模样就想把他餐盘掀了。但他到底忍了住。陆志廉昨日打冷颤的模样仿佛还在他眼前，要是不给他吃饭，他那副身子岂不是要更加干巴。难得善心的元少坐在座位上瞪着他，正要再问，一个香橙便正中他后背，砸得曹元元一股邪火噎在嗓子眼，这饭是没法吃了。

      　　砸他的自然是黄老邪。曹元元就不明白了，怎么哪儿都有他？他本想直接和对方干一架，但惩教的喝止打断了他的施法。

      　　但尽管如此这一架也没能拖延多久。出食堂的路上黄文彬就凑了过来，阴阳怪气地对陆志廉说了几句诸如“运气挺好”“还没死啊”的废话，搞得曹元元烦不胜烦，立刻用一个拳头消音了他。

      　　大战一触即发。

      　　打起来的时候曹元元看到陆志廉像是被惊得退了一步，表情甚至有点迷茫和无辜。他在心里反眼，陆志廉别以为自己是为了他才打这一架的吧——这怎么可能？曹元元向来出手只为自己，他揍黄文彬，只是因为他看不惯黄文彬那副对陆志廉动手动脚的样子。他以为他是谁？陆志廉哪有什么话和他好讲。

      　　只是曹元元自动忽视了一个事实，那就是陆志廉与黄文彬有没有话讲，似乎并不关他的事。但这不重要，曹元元顺手放倒黄文彬的一个小弟时想。

      　　都是陆志廉太招人恨了。要是没有他，陆志廉在这里一天也活不下去。

      　　酣畅淋漓的群殴固然有利于身心健康，但随之而来的后果却相当麻烦。黄文彬，陆志廉，当然还有曹元元，三个人一并被请去了沈国强办公室喝茶。沈国强喝茶，他们三个挨训。

      　　挨训的时候曹元元一直跑神，忍不住瞟着陆志廉看。陆志廉老老实实地站在那里，低着头，一眼也没看曹元元。

      　　曹元元于是不想看陆志廉了。他觉得陆志廉这副模样果然碍眼得很。不想看陆志廉的曹元元把视线挪回了沈国强脸上，恰巧听到后者宣布要他和黄文彬单挑，一人一拳，谁趴下了，谁就收声。

      　　此言正中曹元元下怀。他立刻就要把今天一早上的晦气全还在黄文彬的胃袋上。但黄老邪比他更快。曹元元被肘得后退三步，一抬头，就看到原本安安静静杵在那的陆志廉已然扑上前去，替他挡下了后续的拳头。

      　　又是一阵鸡飞狗跳。曹元元被惩教锁住了脖，不得不原地表演一场兔子蹬鹰。但他好像并没踢到黄老邪，因为黄老邪在另一个沙发上被按着猛捶。曹元元没想明白那他到底踢到的是谁，只觉得脚感甚好，有弹性。

      　　等到黄文彬被陆志廉打得无力还手，陆志廉自己又挨了惩教好几鞭时，曹元元才后知后觉地想，他可能踢的是陆志廉。

      　　挨鞭子的时候陆志廉蹲在地上，一声没哼。曹元元想起上次他倒在自己怀里时也是这样，小腹都被戳穿了也不吭声，除了皮肉裂开的闷声和怀里骤然多出的重量外曹元元竟觉察不到一点多余的动静。

      　　曹元元心里不是滋味起来。

      　　他不明白，陆志廉，难道不知道痛吗。



      　　不知道痛的陆志廉被鞭子赶到了角落里。

      　　或许是怕他们三个在自己办公室里折腾出人命，沈国强光速推翻了自己之前的说辞，把自己才是那个发起“单挑”的人这事忘了个一干二净。不仅如此，他还气急败坏地质问陆志廉，“没我发话你出什么手啊？！”

      　　这真是一句屁话，曹元元冷眼瞥了他一眼。而陆志廉的解释则更干巴，他只说在食堂的时候他看到是黄老邪先出手打人的。

      　　而这是句谎话，曹元元想。人人都会说谎，可说谎的是陆志廉。他抬头去盯陆志廉，但后者却只是蹲在那里，老实得像士多里五毛一包的咪咪虾条。

      　　曹元元的心也因此痒起来。

      　　他突然有一种冲动，他想从这里走出去，走到街上雨布棚子搭起来的小铺边上。在这样的小铺里，窗口的货架上总坠着几包这样的小袋零食。而曹元元想把它拽下来，揣进自己口袋，据为己有，带回家里。

      　　这样的零食，吃几口就吃完了。可却能回味许久。陆志廉就是这样的吃食。只是曹元元可以吃得慢一点，再慢一点。直到他记住陆志廉的味道，直到陆志廉与他融为一体。

      　　可他现在什么都不能做。他只能耐心地等着，等着晚上去同陆志廉摊牌，要他跟自己；等着陆志廉服服帖帖地，成为他曹元元的人。

      　　好在，元少的耐心总是充足。
  - body: |-
      　　曹元元本没有打算这么快去找陆志廉。

      　　老姚那边还没有给他答复，陆志廉的底也要等一等才能摸清。只是他惦记着陆志廉今天下午被抽的那几鞭，又想起陆志廉离开时捂着伤口一瘸一拐的样子，更觉得要是自己不管他，以陆志廉招人恨的程度，还不知道又得吃多少苦头。曹元元不想陆志廉再吃苦头，至少不是在曹元元的眼皮底下。于是他决定不再等待，速战速决，提早了把陆志廉据为己有的计划。

      　　可陆志廉竟然和别人有说有笑！曹元元怒气冲冲地窝在床上，目光死死盯着陆志廉床铺的位置。在那里，陆志廉正在和刚刚回监狱的王蓝禄说着什么，还蹲着翻出箱子找东西给他。曹元元眼尖，认出里面有几样东西是陆志廉之前没有、王蓝禄出狱前分给他的。曹元元心里不爽，陆志廉缺什么东西不能找他要么，非要拿王蓝禄的。

      　　好像他曹元元给不起一样。

      　　完全给得起的曹元元立即从自己的储物箱里翻出一包好烟，想了想，又往里面塞了两只安全套。

      　　陆志廉最好明白他是想说什么！曹元元恶狠狠地瞪了一眼陆志廉身前的那个床柱子。自觉一点，不然曹元元就把他按在这个柱子上咬耳朵。

      　　那厢陆志廉分完东西，一起身就见到一个脸色阴晴不定的曹元元站在他身后。曹元元不想与他多说，他把那包烟从兜里抽出来，塞进陆志廉的上衣口袋，拍了他胸口两下。“以后你跟我。”他说。陆志廉没说话。曹元元盯着他看了两眼，拖着步子扭头走了。

      　　他心想，陆志廉还没对他那么笑过呢。



      　　第二天手工坊劳动的时候曹元元收到了老姚的回复。

      　　他交代的三件事都办妥了。一件是沈国强的儿子，这个不重要；一件是之前给黄文彬透露他行踪的人查到了；另一件就是陆志廉。

      　　据老姚讲，陆志廉此前的确是在一家公司做保安经理。只是他贪钱，挪用了大把公款，还没被拿住证据，这才被炒了鱿鱼，还被那家公司加入了加密黑名单。

      　　老实说，曹元元此前并没有想到陆志廉会是做这种事的人。大概是陆志廉太闷，太老实，才给了他一种陆志廉并没有那么多偏门心思的错觉。

      　　可陆志廉喜欢钱是好事。曹元元想。陆志廉喜欢钱，他有的就是钱。他不怕陆志廉骗他，陆志廉也不需要骗他。只要陆志廉愿意一直跟着他，曹元元可以保他一生富贵。

      　　只是……曹元元捏着手里的扑克，脸色又难看起来。他没想到他这边居然有人会去投靠黄老邪。他把手里的扑克扔到一边，指挥手下把陆志廉叫进来。也不知道陆志廉这个闷石头到底是什么爱好，都说了可以躲懒——当然是在他曹元元身边躲懒——偏要一个人老老实实在外面做手工。

      　　陆志廉走进来的时候看上去有一点无辜。曹元元没理他。他等着陆志廉慢吞吞地在他对面蹲好，才掏出一柄榔头扔在扑克上，说你们中间有人出卖我。

      　　他说这话的时候眼睛一直盯着陆志廉。陆志廉蹲在那里的样子真是好不安乐。他看着陆志廉那对尖尖的耳朵，老实的、抿成一条线的嘴，只觉得手指很痒，忍不住想要捻上一捻。说真的……陆志廉就不能挨他近一点吗！

      　　有那么一秒钟曹元元感到了一种恐慌。要是陆志廉这时候突然站出来认他就是那个背叛曹元元的人呢？要是……但他没让自己想下去。陆志廉没有理由出卖他。而且出卖他的也不是陆志廉。

      　　最终背叛他的那个小弟还是顶不住压力承认了他向黄文彬出卖曹元元行踪的事，他说是黄老邪逼他的。曹元元不想听他废话，他在意的也不是他。曹元元捡起那个榔头，把它递给陆志廉：“他害你躺了那么多天，自己搞定了。”

      　　曹元元想得很简单。陆志廉之前被捅得那么重，始作俑者就是这个被按在地上求饶的倒霉鬼。他要陆志廉跟他，自然要给陆志廉一点好处，比如一个报复的机会。如果是曹元元自己，他一定会想要这个机会。

      　　可陆志廉那是什么表情！曹元元不满地看着陆志廉有一点不情愿地接过那个榔头，不声不响地砸下去，总觉得像是自己欺负了他似的。

      　　疑似欺负了陆志廉的曹元元把陆志廉抓了出去。走出储物室的时候他把胳膊搭在陆志廉肩膀上，终于如愿以偿地捏平了他在意许久的衣领。陆志廉的衣角也如同他的人一样，干燥，却有些绒绒的。曹元元意犹未尽地摩挲了两下那块布料，才道：“你亏空公款啊？”

      　　陆志廉只笑了笑：“等钱使嘛。”

      　　曹元元的手指又在他后颈打了两个转。他发现陆志廉这里格外好摸。他没有去计较陆志廉此前隐瞒他的事，只是想，陆志廉要是能一直贪钱就好了。

      　　要是陆志廉能一直贪钱，他必然会来到曹元元的身边。



      　　九月中旬的时候监狱来了一批新惩教。曹元元没有在这件事上多费心思。随着这批新惩教一并到来的，是一项新的劳动改造。

      　　惩教署本着人性化管理的原则，赤澳的犯人们的活动范围扩大到了后山上的公园。说是活动，其实也是另一种改造。每周三天，每天由一队惩教带着一个仓的犯人去公园捡垃圾。

      　　曹元元这种有背景的富二代自然是不必亲自捡的，不过他不介意去公园睡午觉。而陆志廉，作为他近一段时间的专用人形阿贝贝，自然也要跟着一起去。

      　　曹元元最近发展出来一项新的爱好。他喜欢在下午的、不下雨的时候，让陆志廉充当他的午觉抱枕，自己找一棵树，或是让陆志廉同时充当那棵树，躺在陆志廉腿上睡午觉。

      　　陆志廉摸起来手感总是很好，衣服绒绒的，又没有香港夏天一贯的潮湿。曹元元不知道他是怎么做到的，但他很享受这种环抱着陆志廉腰的感觉。风贴着他的后颈轻飘飘地吹过，阳光落在他的皮肤上，陆志廉此前为他受的那个伤口留下的疤对着他的脸。曹元元喜欢那个疤，总要摸上一摸，似乎只有这样他才能获得一种从未有过的安乐。陆志廉起初还会表现出僵硬，后来见曹元元没有别的举动，逐渐也就习惯了。

      　　他听见树叶沙沙地响，于是更加犯困，不自觉地要在陆志廉肚子上蹭一蹭脸。就在这时他听到有人叫他名字，一睁眼才发现是姚君豪来见他。

      　　老姚带来的消息不是好好。

      　　廖雨萍——最近一个月过得太安逸，曹元元都快要把这个名字忘记了——那个把他送进这里的女人，上次被他找人威胁之后居然又跑到ICAC去举报他。ICAC受理了。曹元元不知道这个女人到底是什么毛病。说到底，他本来也没想把她怎么样。曹元元只是想出口气罢了，而且他都快要忘了她。

      　　可她居然到ICAC举报他！曹元元盯着那份举报信，恨不得把它撕碎。但最终，他控制住了自己，只说：“给我把她找出来，我要玩死她！手机直播！”

      　　老姚比了个“OK”，领命走了。曹元元愤怒地拔掉一片树叶，转过身，才发现原本陆志廉坐着的地方现下空无一人，只剩下一个空荡荡的垃圾袋，那是曹元元自己的。

      　　陆志廉呢？

      　　他的手下告诉他陆志廉刚才一个人往北边的草坪去了，没让他们跟着。曹元元觉得不对。他们一行人浩浩荡荡往那个方向走去，正撞见陆志廉蹲在一个灌木丛后面，抓着一个电话不知道在讲什么。

      　　他一过来陆志廉就停下了讲话。曹元元冲他伸出手，把那部电话抢了过来。他环住陆志廉的脖子把他拉到自己怀里，一个轻柔的女声从话筒里传出。

      　　“你不用担心啦，我会照顾伯母的了。你放心，我会等你出来的。”

      　　电话挂断了。曹元元眯起眼睛，阳光有些晃眼，屏幕反光之下他看不太清上面的字，不过依稀可以分辨出那是个陌生的号码，没有备注名称。

      　　“谁拿给你的？”他贴近陆志廉问。陆志廉向后撤了一步，他又补上去，呼吸都落在陆志廉脸上。

      　　陆志廉看上去有些无奈。“捡的。”他说。

      　　曹元元不太信他。陆志廉的表情一看就是在心虚。如果不是，他为什么要把头偏过去？曹元元不高兴起来。他盯着陆志廉的耳尖，正打算对它进行一些啃咬泄愤，一个面生的惩教插了话进来。

      　　“干什么呢！怎么会有部电话呢？！”

      　　曹元元看了一眼陆志廉，又若无其事挪开视线。“捡的。”他依样学样道。那惩教拿他没法，只道：“全部人！返回去做事！”

      　　曹元元漫不经心地越过他，揽着陆志廉走了。

      　　他并不想轻信一个人，曹元元想。陆志廉的说法太粗陋，他不会全信。只是那毕竟是陆志廉，那个号码也没有备注。大概手机的确是捡的，陆志廉只是运气好。他这样想着，便不自觉轻哼一声，手指又有一搭没一搭地揉起陆志廉的后颈来。

      　　“白手不识规矩，乱捡东西好大件事的……打电话找我嘛。”

      　　陆志廉也笑：“早讲嘛。”

      　　曹元元瞥了他一眼，嘴角稍稍抬起了一个度。

      　　正如之前所说，曹元元不在乎陆志廉识不识规矩，在这里，无论陆志廉犯多大事，他都有信心保陆志廉下来。他同样也不在乎陆志廉和电话里那个女人的关系。

      　　曹元元已打定主意，等他从这里一出去，他就会带陆志廉一起去加拿大。他不会给陆志廉拒绝的机会，陆志廉也没有拒绝他的理由。

      　　只是，半个钟头后，他派出去抓廖雨萍的手下传来消息，任务失败。曹元元心里闪过一个念头。可他没有想下去。他躺在陆志廉腿上，自嘲地笑了一下，顺手把一边夹垃圾的杆子叉着垃圾袋掷了出去。

      　　一群废物。

      　　可是没关系，曹元元的耐心一向很好。他有大把时间，不介意同她慢慢玩。

      　　而在此之前，他要先躺在这棵大榕树下睡一觉。反正陆志廉就在这里，曹元元总是可以安枕无忧。
  - body: |-
      　　这一天，曹元元迎来了两个意料之外的访客。

      　　当时他正趴在手工桌上睡大觉，陆志廉在他旁边专心致志做着手工。他听到缝纫机的声音嘎吱嘎吱响，针捻着一排线顺着棉布边压过去。曹元元总是喜欢这样的声音的。虽然他并不理解陆志廉为何要老老实实亲力亲为做这些——若他不想，凭他是元少的人也没人敢置喙他——但陆志廉在他身边弄出的这些细小却日常的声音格外令他安心。他把脸对着陆志廉，半睁半闭着眼睛从眼皮的缝隙里去瞧陆志廉的模样，只是还没等他瞧出个什么名堂，曹元元就睡着了。

      　　半睡半醒的时候有人叫他名字。“曹元元，有人来探你。”曹元元皱了皱鼻子，没动。但旁边陆志廉压布的动作停了，声响的欠缺吵闹地攻击他的耳膜。他不情不愿地掀开一只眼皮，瞪了陆志廉一眼。陆志廉却好脾气地笑笑，说阿sir喊你。

      　　曹元元的起床气瞬间偃旗息鼓。他一推桌子，站起来，跟着要去，却在走之前低头看了一眼陆志廉露在领子外面的半截颈子。

      　　“做完手工坊的活在这里等我。”他说。曹元元捻了捻手指。

      　　等见完这些无谓的人，回来之后他必定要让陆志廉给他充当个两小时的抱枕才够。



      　　不过曹元元的计划没有进行得那么顺利。来见他的不是什么无谓的人，而是他妈咪和老豆。

      　　他爸最近不知道是不是给人抓住了痛脚，一直慌慌张张急着要跑路。对这些事，曹元元只清楚个大概，也不关心。从他小时候起他爸对他就鼻子不是鼻子眼不是眼。他又是私生子，在他爸眼里更和一个便携式出气筒没什么分别。

      　　曹元元先是花了几分钟安抚担忧的母亲。他妈咪总是担心他的，他被困在这里，她前前后后没少为他打点。然后就轮到他爸。曹元元对上他爸总是没什么好话的。原本也一句不想说，他爸一张嘴，曹元元的火“噌”得一下就上来了。

      　　结果自然是不欢而散。

      　　曹元元摔了电话，怒气冲冲地推门走了。从探视处到手工坊不过十来分钟的路，曹元元却只用五分钟就闷头走完了一大半。路过操场的时候曹元元恶毒地想他爸会不会被他气出脑溢血，但又觉得那个老东西遗臭万年，应该没那么容易死掉。不过无论如何，曹元元只希望他跑路跑得动作快点。他倒无所谓，名义上他爸和他没有父子关系。老东西别连累了他妈咪就好。

      　　只是等他赶回手工坊，手工坊早落了锁，犯人们也早早返仓。这其中自然也包括陆志廉。曹元元憋着火，他没有怪陆志廉没在原地等他，却也不想那么早回去。他无处可去，原地站了一会儿，跟狱警打了声招呼，往操场去了。

      　　操场此时并没有人，只有两只不知从哪飞来的海鸥，叼着树叶在篮球网下一蹦一跳。曹元元挑选了一个他常呆的位置躺下来，直直地盯着天看。

      　　天是阴的，一朵云也没有。他躺着，于是周身的世界倒置过来，仿佛塑胶跑道才是天，他反而躺在了天上。风挨着他从额头上吹过，掀起他两缕头发。曹元元突然想起来当初他第一次见陆志廉的时候也是坐在这里，也有这样一阵风。

      　　他突然很想见到陆志廉。想听到陆志廉弄出的那些响动，想触碰陆志廉温暖干燥的衣领，想把牙齿按在陆志廉的耳尖上。这种想逐渐变成了一种渴望，一种必需。从他的脚底灼烧起来，把一切道理都燃尽，只留下一句：

      　　他要去找陆志廉。

      　　只要找到陆志廉，一切都会解决的。

      　　曹元元最终还是没有去找陆志廉。一来他有些耻于承认他对陆志廉的需要已经达到了一种程度，二来他晚饭没吃饱。

      　　晚饭没吃饱的曹元元寻摸了一袋啤酒，坐在床上借酒消愁。他本来还想再要一袋面包，但被狱警以残渣会引来老鼠拒绝了。他又懒得再去厨房吃，便只喝点啤酒填填肚子，等天亮了再去吃早饭。

      　　酒过三袋，曹元元渐渐醉了。半梦半醒间他听到一阵窸窸窣窣的响动，再一抬头，一个陆志廉就坐在他床边了。

      　　这可不是他主动去找的陆志廉。曹元元在心里打别。但他没有吝啬于给送上门来的陆志廉一点好处。他从箱子里又翻出一袋啤酒，一副祝酒的样子，把它递给陆志廉。

      　　陆志廉接了，却没有喝。没劲。曹元元嘀咕他。但他却不自觉地向着陆志廉的方向靠去。陆志廉体温比常人高一些，像个火炉似的，曹元元一向喜欢用他取暖。他吞下一口啤酒，盯着陆志廉的耳尖和剪得平整的鬓角，突然道：“讲个故事给你听。”

      　　故事还是那个老套的故事，讲出来曹元元自己都嫌无聊。但陆志廉却听了进去。曹元元看着陆志廉又露出那副努力思考应该怎么安慰别人的表情，几乎能听到陆志廉脑袋里面齿轮飞速旋转的声音。陆志廉说，父母都是这样的，无论你做什么都好，他们都不满意。曹元元从鼻子里嗯了一声，权作附和。陆志廉却神情落寞下去，瘪瘪的，像一只漏了气的小包零食。

      　　“你说的那个小子都好，还有老爸照顾。我出生时老爸已经不在了，从来都没人关心过我。”

      　　原来陆志廉也会因为这种事难过，曹元元想。但他不喜欢陆志廉这个表情。陆志廉应该是波澜不惊的，应该是一块踢不动挪不走的闷石头。他不高兴起来，蜷起腿，半个身子都伸到陆志廉那边：“只要你跟着我，不会少了你的好的。”

      　　陆志廉礼貌地对他笑笑，他却不满意。这个笑一点都不像他之前见过的、陆志廉同王蓝禄说话时的那种轻松纯粹的笑。曹元元把手从他衣服底部伸进去，手掌挨着陆志廉腰上的皮肤。陆志廉平稳的呼吸顺着他的手掌爬上来，曹元元顿觉更不满足，他又摸得更深，更用力，陆志廉为他生的那块疤陷在他的指缝里，引得他只想咬上去，把陆志廉彻底变成曹元元一个人的所有物。

      　　陆志廉的身体在他摸上来的时候僵了一下，但就如以往的每一次一样，很快便放松下去。曹元元哼笑一声，把下巴抵在陆志廉肩上，将陆志廉抓到自己怀里。这个姿势很好，只要他偏一偏头，曹元元可以随时咬到陆志廉的耳朵。但他没有咬。曹元元坚信好吃的东西要留到最后一口，提前吃了总是可惜。他贴着陆志廉肚子上的那块疤，感受到陆志廉腹部的脏器在自己手掌下发出细微的响动，和他的心跳串联着。曹元元于是扒得更紧，腿也圈着陆志廉的腿，像一个汤匙一样，把陆志廉和自己扣在了一起。

      　　“再跟我说说你小时候的事。”

      　　于是陆志廉开始讲述自己从小在几个寄宿家庭中辗转的往事。他人像块闷石头，语调也平平。曹元元听的时候并不说话，耳朵却竖着。当听到陆志廉说自己读中学时再一次被送回福利院、周末无处可去，只能去同学家里蹭饭的时候他第一次插了嘴。曹元元咬住陆志廉的耳廓，不清不楚却耿耿于怀地问：“你那个同学呢？”

      　　“到英国读书去了。”

      　　“后来呢？”

      　　陆志廉沉默了一下，把他缠在自己腰上的手拿开：“后来出车祸，死了。”

      　　曹元元于是不说话了，只闷着头在陆志廉身上乱摸。陆志廉被他摸得没了脾气，叹了口气：“你想做就做吧。”

      　　曹元元看了他一眼，陆志廉仍平平稳稳坐在那里。他猛地收回腿，把陆志廉压到身下。陆志廉的后背“哐当”撞到床柱，曹元元却不理，他按着陆志廉的肩膀，像动物一样咬住那对瘦削凸起的锁骨：“你说的。”

      　　陆志廉沉闷，做起爱也沉闷。无论曹元元动作再怎样粗暴，他也能始终一声不吭。他精壮紧致的背肌随着曹元元的顶撞绷紧再松懈，细密的汗珠顺着耳侧滚下来。曹元元将它们依次舔尽，又去掐他的腰，以进到更深、更里。

      　　陆志廉的大腿也紧绷着，撑着床，被一下一下撞进床垫里。曹元元喜欢他这两条腿，就像他同样也喜欢它们强撑着不愿放松的模样。曹元元偏不如他意。他挤进陆志廉腿间，将性器送得更深，并满足地听到了陆志廉的一声闷哼。那双腿被他撞得打了个弯，却又在之后立即撑了回来。

      　　喘息间曹元元咬住了陆志廉脊背上那对一直勾引他的肩胛骨。他对着那处又舔又咬，直把它咬得发红，留了好几道牙印。陆志廉又一声不吭，只有呼吸重了点。曹元元舔过那些牙印，嘴唇抵着他的皮肤：“出声。”

      　　陆志廉只是喘息。曹元元又咬，手也伸到前面去摸他左腰上的那个伤口：“出声。”

      　　陆志廉仍不说话。于是曹元元的摸改为了抠，顶得也更深、更快。他听到陆志廉仿佛缺氧一般大口呼吸起来。曹元元不放过他，监仓狭窄的床如漏风的窗柩一般响。他贴在陆志廉背上，心跳猛烈地击打着陆志廉的心。最终他听到陆志廉屈服的声音。

      　　他说：“元少。”

      　　曹元元的动作慢下来。他抵在陆志廉的后肩上发笑。元少长到三十四岁，声色犬马，纸醉金迷，却好像头一次拥有了自己的东西。他得到了陆志廉，陆志廉是他的，于是世上的一切都变得无足轻重起来。他不再去想十岁那年被人打、没饭吃的那些事，也不再去想他老豆骂他没了钱屁都不是的那些话。不重要了。

      　　他得到了陆志廉。这些都不重要了。
  - body: |-
      　　那个刚入狱不到三个月的白手成了元少的马子，这件事没用一夜的工夫就传遍了整个监仓。又过了一日，就连隔壁的监仓、隔壁的隔壁的监仓的犯人都知道了。

      　　这样的结果对曹元元来说并不意外。毕竟从那天晚上开始，他便没有想着掩藏。而就算陆志廉自己想藏，仅凭陆志廉被他弄出的那些声音，也由不得他去藏。

      　　只是他仍然好奇陆志廉的反应。

      　　被收作大佬的马子固然有好处，但说到底也不是什么光彩的事，难听的风言风语是少不了的。陆志廉只是陆志廉而已，曹元元本不必去理会。可他偏偏好奇陆志廉这块石头遇上这些话究竟会不会动。他暗中观察过、言语试探过，可无论他怎样试，陆志廉都依旧是那副一派平和的模样，泛不起半丝涟漪。

      　　装货！

      　　以为元少不记得么。

      　　曹元元又想起那天晚上陆志廉被他肏的模样，那两条大腿是如何紧绷，那个四方的臀是如何收紧、颤抖，又被享用的人强硬地分开。还有陆志廉的声音。曹元元最钟意的还是陆志廉的那把声。很低，很沉，却生生被他撞碎，撞回喉咙里，变为几不可闻的闷响。

      　　可曹元元知道那几声闷响来得有多不易，也知道这个闷石头用了多大力气才忍得住只发出这几声零碎的喘息。夏夜的监仓又闷又热，陆志廉光裸的肩上满是汗珠。而曹元元就这样沿着那些汗珠，一寸一寸地，将他迟来的奖品吞吃入腹。

      　　可陆志廉却没什么反应。这让曹元元反而莫名其妙地不爽起来。他本以为陆志廉会对他当着整个监仓的犯人肏他不满，甚至于是耻辱，但陆志廉一样都没有。他仍然像之前一样和“太子党”这边的犯人们一同吃饭、打球，就好像他不是什么元少的马子，而只是一个普通的犯人一样。

      　　难道陆志廉其实相当自愿？曹元元这样想着，又觉得这并非不可能。他有钱，陆志廉喜欢钱，况且之前陆志廉还为了他被黄老邪捅进了医院。如果陆志廉不喜欢他，他帮他挡什么？！

      　　他这样想着，也就稍稍安心下来。反正陆志廉都是他的了，还管那么多做什么。



      　　不过还有一件事，曹元元没有告诉任何人。

      　　那天晚上他们做完以后，曹元元做了一个梦。

      　　他梦到他们去了加拿大。穿过深青色的原野，爬上一座光秃秃的山。身前的迷雾拖出长长的影子，勾连着天空灰蒙蒙压在另个山头的横排的矮房子上。山顶的风轻轻擦过他的脸颊，而陆志廉在他身旁。

      　　他的身体突然变得很轻，似乎只要一阵风便能将他吹落山崖。而陆志廉仍站在那里，沉默着，像一块冰冷的巨石。

      　　“陆志廉！”他愤怒地大叫，伸手想要抓住陆志廉的手。

      　　可陆志廉没有说话。

      　　陆志廉从来都不说话。

      　　曹元元脱水一般地醒来，怀里是空的。他一扭头，陆志廉就睡在离他隔着几个铺位的、他自己的床上。

      　　曹元元的怒火瞬间窜起来。他踢开拖鞋，衣裤也不穿，三步并作两步冲到陆志廉床边。陆志廉被他弄出的响动惊醒，他却不理，只一掀被子，整个人钻了进去。

      　　陆志廉体温很高，被窝也很暖。他侧躺在床上，两条腿并在一起，直挺挺地绷着。曹元元屈起膝盖，硬是插进去一条腿，像盅茶碗一样紧紧把他给扣了起来，然后去咬那只耳尖：“为什么回自己的床？”

      　　陆志廉没说话，不知是不想说还是正在想答案。曹元元没那么好的耐性，于是又去抠他肚子上那个疤。陆志廉早已习惯了他这个一不高兴就去抠伤口的习性，他的手才一摸上去，陆志廉便覆住了他的手背。他听到陆志廉叹气，说只是床太小了，怕影响元少休息。

      　　原来他还是为他着想。曹元元的不爽就这样被这个答案盖了过去。他哼笑一声，略微放开陆志廉，给予了他一些喘气的空间：“床小有什么，回头我让他们把我们的床并在一起不就好了。”

      　　陆志廉笑了笑，说那好，就这样。

      　　他们这样躺了一阵，曹元元的手又开始不安分。他如今很喜欢在陆志廉身上探索，每次摸陆志廉不同的地方，都总能收获一些新的反应。这让曹元元仿佛找到了新的游乐场，忍不住便要开拓一番。他摸着陆志廉腰侧的那一小块皮肤，感受它在自己掌心之下的轻颤。他忽然间不满足起来，不满足于这种仅限身体上的了解。陆志廉是他的，曹元元想要更多。

      　　于是他问：“你爱吃什么？”

      　　陆志廉又不说话了。曹元元见不得他沉默，手臂更加收紧。他锢得陆志廉伤口疼，陆志廉在他怀里紧绷起来，似乎想挣开，却又没有挣。半晌，他才听到陆志廉说：“我什么都吃，元少不必挂怀。”

      　　又是不必挂怀！曹元元不高兴起来。陆志廉怎么和王蓝禄就有说有笑，到了他这里就是这幅样子。明明他才是……曹元元又屈了屈腿，膝盖顶上陆志廉那个又大又结实的臀：“你不信我？”

      　　“……”

      　　陆志廉不出声了。但这次的不出声不一样，曹元元几乎可以感觉到他正在绞尽脑汁搜刮一个答案。

      　　“西蓝花炒鱿鱼。”

      　　终于，他听见陆志廉叹气，按他心意给出了一个答案，“以前读中学时同学妈妈总做，吃惯了。”

      　　曹元元摸他的手一顿：“你以前常去蹭饭的那个同学？”

      　　“是。”

      　　“……”

      　　曹元元没声了，开始闷头在陆志廉身上乱摸。他发现自己无端地有些介意陆志廉的这个同学。可那只是一个已经死了的人！他曹元元何必去和一个死掉的倒霉鬼计较。不过他觉得陆志廉真是没吃过好东西。但转念又想，陆志廉只是陆志廉。如果他之前说的是真的，那从小辗转在寄宿家庭里的陆志廉没吃过什么山珍海味，倒也没什么出奇。

      　　觉得自己对陆志廉又多了几分了解的曹元元高兴起来，并慷慨地决定给陆志廉一些特权。

      　　他想，如今陆志廉是他的人，拥有一些特权也是应该的事。

      　　于是第二天，当陆志廉被叫到厨房的时候，桌上就摆了一盘西蓝花炒鱿鱼。

      　　曹元元站在旁边一脸得意，尾巴都要翘到天上。他也不管陆志廉说什么，只自顾自地把胳膊圈在陆志廉肩上，去嗅陆志廉衣领后面肥皂水的味道。

      　　“怎么样？”曹元元抓着陆志廉衣领绒绒的布料，忍不住放在指腹捻了几下，“跟着我还不错吧？只要你继续跟着我，我是不会亏待你的。”

      　　他没去注意陆志廉脸上的表情。他想陆志廉必然是对他感恩戴德的。在赤澳这种地方开小灶，可不是人人都能有的待遇。陆志廉身上很暖，曹元元忍不住贴得他更近了一些。他听见陆志廉说“那就多谢元少了”，他想，这才到哪里。

      　　只要陆志廉愿意一直当曹元元的专属抱枕，曹元元自然会保他一生荣华富贵。



      　　除此之外，却没有更多别的事。曹元元得到了陆志廉，日子过得极为舒心。一晃又过去一个多月，这晚，正当曹元元打算搂着他的专属抱枕陆志廉睡觉的时候，沈国强带着一群人气势汹汹地冲到了监仓。

      　　曹元元不知道他要搞什么鬼，手下也在那里看热闹。他听到他的一个小弟嘀嘀咕咕，说大龙凤喔。曹元元没理他。他踢着鞋站起来，和其他犯人一起走到监仓边上。

      　　陆志廉依旧和王蓝禄一起，而不是和太子党的其他犯人。曹元元盯着他们两个咬耳仔的模样，觉得真是得哪天找个时间和陆志廉聊一聊这个问题。

      　　难道他不知道，作为一个大佬的马子，最应该做的是时时刻刻跟着大佬，顾着大佬有什么需要。

      　　总和不相干的人交头接耳是什么意思？！

      　　陆志廉到底懂不懂规矩！

      　　不过接下来曹元元的不爽就从陆志廉转移到了沈国强身上。沈国强也不知吃错了什么药，进来就说要查东西。查什么却不说，只点了两个人出来，说要查他们的床，还要搜身。

      　　这两个人自然就是陆志廉和王蓝禄。曹元元真是不明白了，一个又黑又闷的陆志廉，看起来就觉得没意思，怎么走到哪都这么招人恨。

      　　况且搜陆志廉的床不就是搜他的床？早一阵子曹元元就把他俩的床合到一起去了，现在被子都换成同一床了。

      　　他不满地扫了一眼钱国锋——沈国强现在正忙着发威，看不见元少的眼神。钱国丰却摇摇头，示意他沈国强不是没事找事。

      　　曹元元便只好忍着。

      　　他看着陆志廉慢吞吞地走出来，慢吞吞地被搜身，慢吞吞地脱掉一只鞋。曹元元看着看着，倒突然理解了为什么陆志廉那么招人恨。

      　　那个闷石头样子，像是踹一脚都不会出几下声。谁能忍得住不磋磨他两下？

      　　但陆志廉被搜身的时候曹元元的不爽还是达到了顶峰。他想，陆志廉是他的所有物，别人在陆志廉身上摸来摸去，算什么道理？

      　　可他到底没机会发作出来。

      　　陆志廉抬起了另一只脚。上面粘着一张纸。

      　　曹元元的眼神瞬间变了。那一瞬间他想了很多，例如陆志廉可能背叛他，例如陆志廉可能根本没把自己当作“曹元元的人”。

      　　可陆志廉拿沈国强的东西干什么？他一个亏空公款被抓进来的保安经理，能和沈国强扯上什么关系？

      　　不过还没等曹元元想明白这一点，王蓝禄的声音就适时插了进来。

      　　“报告阿Sir，那个，可能是我的。”

      　　他把那张纸摘下来，打开，是一坨铅笔画的不知是什么的东西。他佝偻着赔笑：“是我画的我的bb来的。六个月。原来是掉到他脚底去了。”

      　　“……”

      　　在场的人一时都有些无言。沈国强也半天没找出茬，只好没好气地问他：“你的嘴怎么了？”

      　　王蓝禄依旧赔笑：“我咬到舌头了嘛，阿Sir你知道的……”

      　　沈国强无功而返。

      　　一群人来得气势汹汹，走得也吵吵嚷嚷。走的时候钱国锋把曹元元叫到一边，叫他明天一早再来一趟。

      　　要是那份文件还是找不到，恐怕会有麻烦。

      　　曹元元被他说得脑仁疼。一回头，陆志廉倒已经整理好了床铺，老老实实坐回了床上。

      　　曹元元于是决定明天的事还是明天再操心。至于现在，他觉得还是把刚刚陆志廉被摸的那些个部位自己重新摸回来比较重要。
  - body: |-
      　　沈国强派人来寻他的时候，曹元元还躺在床上。

      　　来的是个新调来的小狱警，生面孔，曹元元不认得，站在那里并不走近，只敲两下监仓的铁栏杆。

      　　“曹元元，沈sir找你。”

      　　曹元元懒得看他。他伸手向床边一摸，空的。陆志廉不在这里。陆志廉鲜少这样。曹元元意识到。自从陆志廉成为他的人，便没有一天早上曹元元不是搂着他醒来的。

      　　可今天他却不在。曹元元又将手在床单上翻了个面，手背贴在上面。床单是冷的。如果曹元元估得不错，陆志廉应该走掉有一会儿了。

      　　“陆志廉呢？”他问。问出口却又觉得自己何必自降身价过问一个马子的事，便又把这话岔过去，“现在几点了？”

      　　“九点，狱长说让你立刻去见他。”

      　　“他还没找见东西？”

      　　“是。”

      　　曹元元烦躁地抓了抓刘海。昨天晚上钱国锋的话又响起来。他坐起来，余光却瞥见陆志廉留在床头的那件外套。他想，或许陆志廉今天没有老老实实做抱枕，只是因为自己睡过了时间。陆志廉这个闷石头，如果曹元元不说，他就真的按照监狱的日程走。日程要他做什么，他就做什么，一点懒也不会偷。

      　　他这样想着，心头那点烦躁倒逐渐压了下去。

      　　只不过是告诉陆志廉他以后不用那么老实罢了。他又捻了捻那件外套，踢着拖鞋，跟着狱警走了。



      　　到了监狱长办公室，等来的果然是一个气急败坏的沈国强。曹元元觉得他也是奇才一个，自己办公室里的文件，竟然也能长腿飞掉，大张旗鼓地去搜也没搜出所以然，最后还要他来收烂摊子。

      　　找不见文件的沈国强像没头的苍蝇，见着曹元元进来，就仿佛见到了头。还没等曹元元说话，他自己就倒豆子一般把事吐了个干净：“我不见了一份文件！找来找去一晚上也还是找不到，一定是被人偷走了！”

      　　曹元元掏掏耳朵，没说话。沈国强踱了两圈，又一巴掌拍在桌面上：“这件事你也有份，给我快点搞定它！”

      　　曹元元不知道他丢的文件具体是什么，却大概知道是关乎他贿赂惩教的东西。那些东西从没经过他手，都是从他老豆名下派出，他是私生子，倒不担心会牵扯到自己。

      　　但他真正在意的另有其事。

      　　陆志廉不知怎么的又被扯了进来。还有那个王蓝禄。

      　　陆志廉。

      　　曹元元又想起了那天他们做完后，他做的那个梦。梦里的陆志廉沉默得像一块石头，曹元元抓不住他，又拿他无可奈何。那天他醒来时怀里就没有陆志廉，今天也是。陆志廉仿佛总能留下一层曹元元看不透又无法接近的东西。曹元元不喜欢这样。他不喜欢陆志廉这副随时会走、他抓不住的样子。他更不喜欢陆志廉是那个可能会别有用心接近他的人。

      　　曹元元再等不下去。他没再管沈国强说什么，甩门冲了出去。



      　　曹元元没费多少工夫就在操场找到了陆志廉。

      　　陆志廉正在操场和曹元元的几个小弟打台球。这也是这一个月里的新变化。陆志廉刚跟曹元元的那段时间总是独来独往，别的小弟见他闷着不说话，也就不爱搭理他。与其说他是“太子党”，不如说他更像是一个编外人员。

      　　但自从曹元元睡了他，这种情况就发生了改变。监狱里这种沾点桃色的消息总是传得格外快，那些人多多少少知道他和曹元元的关系，便不再对他不假辞色，纷纷想从他这里借曹元元的东风。曹元元曾在某次撞见陆志廉在他不在的时候被几个太子党的人围着奉承，事后他有意无意地提起，陆志廉却也只是笑笑，说他们想讨好的始终是元少罢了。

      　　曹元元闻言哼笑了一声。他倒不在意那些人讨好陆志廉，说到底，这些无非也是他许给陆志廉“跟自己”的好处罢了。但他很是满意陆志廉的坦然。他揽过陆志廉的肩膀，伸手去捻陆志廉翘起的衣领：“你倒是对自己的身份适应得很快。”

      　　陆志廉仍然坦然地笑，仿佛当大佬的马子只不过是一件平常事：“我是元少的人嘛。”

      　　可如今，他从陆志廉身上得到的这些甜蜜的快乐却被掺上了别的东西。他听见周围人叫他“老大”，此起彼伏。他却没理，只拿起球杆，冷冰冰、恶狠狠地瞄准：“交出来。”

      　　陆志廉笑了笑，也顶了一杆球：“交什么出来？”

      　　曹元元不理他，只是打球：“我最恨人出卖我。最后机会。”

      　　陆志廉不说话了。曹元元抬头盯着他看，试图从他脸上找出一丝一毫的破绽。可陆志廉却只是立在那里，仿佛曹元元对他的怀疑，只是在闹少爷脾气一般。

      　　良久，他听到陆志廉叹了一声，像是无奈地放弃了辩解。

      　　他说如果你不信我呢，我说什么都没用。

      　　旁边的太子党早在气氛紧张起来之时就悄悄举起了牙刷柄，似乎只要曹元元一声令下，即刻便可以将陆志廉戳成筛子。

      　　可陆志廉却什么都没说。他就像接受曹元元往日在他身上留下的那些痕迹一般，接受了曹元元对他的怀疑。

      　　曹元元忽然有些想笑。他知道他不该这么放过陆志廉。他应该把他绑起来，按在地上，折磨他，像之前审讯那个给黄文彬报信的小弟一样逼他讲实话。

      　　但他瞧着那对引颈待戮的尖耳朵，忽然又不想那么做了。

      　　曹元元的心又一次痒起来。或许也不是陆志廉。万一不是陆志廉，那他对陆志廉做了那些事，岂不是会弄坏这个称心如意的石头。

      　　曹元元笑了。没关系，他想。还有王蓝禄。如果是王蓝禄做的，陆志廉什么都不知道自然能够讲得通。
  - body: |-
      　　傍晚时分，他们在一栋公屋捉到了王蓝禄。

      　　元少的爱好是看直播。他的手下深谙这一点。于是等到王蓝禄一被捉到，画面立即就被人用偷带进来的手机转播进了赤澳。

      　　拿手机的人把“太子党”都招呼过来，又偷偷摸摸把手机塞给曹元元。曹元元拎着手机掂了两下，又瞥一眼陆志廉。见他不动声色地跟在人群后面，嗤笑一声，把他抓到了自己身边。

      　　手机屏幕里王蓝禄被绑在天台上，一把榔头悬在他脚趾上方。见姚君豪一行人来者不善，不住地告饶，只说大佬们是不是认错人了，他什么也不知道。

      　　姚君豪拿着一个摇摇乐，像逗小孩一样放在嘴边吹。他拿着玩具在镜头前晃了两下：“那份东西在哪，谁指使你的？”

      　　“哪份东西？”王蓝禄连声求饶，“我真不知道，真不知道啊！”

      　　“不说？”姚君豪退到一边，示意一边的小弟动手。榔头对准左脚拇指“哐”得砸下去，姚俊豪又问：“在哪？”

      　　王蓝禄还是说不知道。姚君豪摆摆手，他们又敲断了他右脚的拇指。

      　　王蓝禄惨叫的时候“太子党”的人纷纷低呼叫好，更有甚者还嫌不过瘾，忍不住学他们出拳的动作。

      　　陆志廉也在笑。曹元元向他看过去，只见陆志廉把手抵在嘴边，额头青筋暴起，仿佛在看什么激烈的围猎。

      　　曹元元冷着脸，没说话。

      　　陆志廉不知道他演技很差吗？



      　　王蓝禄最终还是什么都没说。屏幕熄下去，人群散开，陆志廉则走到洗手池那边洗脸。他洗脸的时候曹元元一直在盯着他背影看。他看到陆志廉将脸埋入洗手池，深深地呼吸。曹元元知道他是不想让自己吐出来。可陆志廉吐不吐出来，曹元元都不在意。

      　　那天晚上他们做的时候曹元元将他死死扣住，陆志廉跪趴在床上，两条腿都陷在床单里。曹元元咬着他的肩膀，手臂勒在他胸前，问他：“你真的什么都不知道？”

      　　陆志廉沉默着不说话。曹元元又问：“我叫他们打断了王蓝禄两条肋骨，你也不生气？”

      　　陆志廉被他撞得腿都在抖，却只是说：“我是元少的人，元少做什么都是对的。”

      　　于是曹元元抵着他的肩膀发笑。他顺着陆志廉那对紧致的肩膀，一路咬上他的耳尖。

      　　他说好，不知道就不知道吧。



      　　曹元元想过，自己是不是不应该就这么放过陆志廉。可他看着陆志廉那并不出众，又黑又干巴的侧脸，又忍不住想，算了，只不过是一份无关紧要的文件。或许不是陆志廉呢，或许真的与他们无关呢。重要的是现在陆志廉是他的所有物，不是吗？



      　　事情就这样被曹元元自己轻轻揭了过去。

      　　沈国强因为弄丢文件担惊受怕了好几日，但见过了段时日，并没有什么新的动静，也就逐渐放下心来，决定对此事绝口不提。曹元元并不怎么在乎他的死活，但他不许沈国强再找陆志廉的麻烦。说到底，此事也是沈国强自己的问题。牵连不到曹元元还好，如果牵连到曹元元，曹元元也不会让他好过。

      　　这天下午，曹元元吃过午饭，照例坐到操场上吹风。初秋的云被暖风推着飘来飘去，吹得曹元元也昏昏欲睡。

      　　可偏偏有人不长眼。

      　　他刚合上眼，就见黄文彬走过来，坐到他旁边。曹元元不耐烦地将眼皮掀开一只，想叫他滚远点，黄文彬却说：“你这么讨厌我，要不要告诉你呢。”

      　　曹元元这下连叫他滚的耐心都没了。他站起来便要走，却被黄文彬拦住：“哎，送份礼物给你吧。”

      　　他又往曹元元身边挪了挪，冲不远处的陆志廉努努嘴。曹元元顺着他的视线看过去，正对上陆志廉向他这边望来的视线。

      　　“你兄弟，”他听见黄文彬说，“他是ICAC的。当初他亲手抓我进来的。”

      　　ICAC的。

      　　于是一切都有了解释。

      　　那天的晚些时候，曹元元拉着陆志廉在监仓喝啤酒。他一袋，陆志廉一袋。曹元元喝得半醉，他将手肘撑在腿上，侧过脸去看陆志廉。

      　　陆志廉还是那副波澜不惊的模样，对曹元元已经知道了他的身份一无所知。曹元元盯着他那对自己亲吻过、舐咬过的耳朵看了很久。他说，你知道吗，我最恨别人出卖我。凡是出卖我的人，我都要让他死。

      　　“还要死得好惨。”

      　　陆志廉没有说话，也没有多余的反应。曹元元盯着他看了一阵，突然道：“你跟我去加拿大吧。”

      　　陆志廉难得一愣：“什么？”

      　　“你有案底，在香港混不下去的。跟我去加拿大，保你一生富贵。”

      　　陆志廉没说好，但也没说不好。于是曹元元把那张写着安全屋地址的纸条塞给他：“明天你就出狱了。这个女人，出去帮我搞定她。”

      　　陆志廉展开那张纸条，廖雨萍的藏身地点赫然写在上面。

      　　曹元元还在盯着他看。陆志廉平静地将那张纸条收起，说：“那就多谢元少了。”

      　　他们又无言地坐在一起，喝了半个钟头的酒。曹元元喝醉了，就拉着陆志廉躺下。曹元元鼻子发酸。他想，这可能是他第一次给一个人第二次机会，也是最后一次。

      　　他想，陆志廉可千万不要让他失望。如果陆志廉让他失望了，他不知道自己会做出什么来。

      　　在意识沉入梦乡前，曹元元抓住陆志廉的手。他将这个他最钟意的石头抱进怀里。他将下巴枕在陆志廉肩头。他说陆志廉，你答应要跟我去加拿大了。你要记得。

      　　隐隐约约地，他听到陆志廉答了什么。

      　　又或者什么也没有。
  - title: 番外一
    body: |-
      　　曹元元本以为他不爱陆志廉。

      　　陆志廉有什么好？一个又黑又硬的石头，长得干巴，人也不有趣。可就是这样一个石头，却偏偏叫元少移不开目光，又引得他为他早出狱三天，就只为了去赌一把陆志廉愿不愿意和他去加拿大。

      　　曹元元对自己说，陆志廉只不过是陆志廉，一个马子、一个玩物而已。他对他只是玩玩，又用得顺手。陆志廉愿意抓住机会最好，如果仍然要和元少作对，大不了就把他杀了。

      　　可枪对着陆志廉时，他却又下不去手。

      　　陆志廉不愧是陆志廉，连曹元元会因为一时意气为他早出狱三天都算到。不过陆志廉也没算到全部。当他抓着陆志廉的手，被从海里捞起来的时候，曹元元才意识到，其实那也不完全是因为一时意气。

      　　他抬起头，刘海湿漉漉地贴在他额头。他听见陆志廉的那把又低又沉的声对他说，“现在将你正式拘捕”，曹元元忍不住笑。

      　　原来他爱陆志廉。



      　　曹元元又以为他恨陆志廉。

      　　他刚被再次关进赤澳的时候，陆志廉常来看他。这位ICAC首席调查主任穿着西服，头发梳得一丝不苟。他来找曹元元，无非是为了问询一些案件的细节。曹元元倒了，袁正云落网了，可他们家的信息网却仍在。钱怎么运作，利益如何往来，丝丝缕缕的，也只有曹元元才知道。

      　　但曹元元从不给他好脸色。若是陆志廉来，他就叫他滚。陆志廉当然不可能滚，他坐在玻璃窗外，平静得像一潭死水。

      　　他说：“曹元元，如果你愿意配合，我可以将你转做污点证人。”

      　　“污点证人？”曹元元嗤笑一声。他猛地站起来，凳子被他的动作一甩两米远。他凑近那块玻璃，就像以往的任何一次他贴近陆志廉的身体。

      　　他说想让我配合，做污点证人可不够。你得给我口一次才行。



      　　这后来几乎成了他们两个的惯例。每次陆志廉来，无论他怎么说，说什么都好，曹元元都总能将话题引到性的方面去。他觉得这很公平，陆志廉用爱骗他，他就用性羞辱他，有什么不对？

      　　于是渐渐的，陆志廉就不来了。

      　　陆志廉不来，案子却没结束。于是来的人换成了程德明。曹元元对程德明这张脸没有任何兴趣，连出言讥讽都懒得。程德明说，他就坐在那听。程德明问他，他一个字也不答。

      　　后来有一次，在程德明白费口舌将近三小时后，他终于忍不住问：“陆sir让你转做污点证人不好吗？我真是不明为什么你不愿意配合。”

      　　曹元元终于屈尊看了他一眼：“有什么好？可以减刑？”

      　　程德明一愣：“如果你提供的信息有用，我们会帮你争取。”

      　　曹元元想了片刻，说那也可以。不过你不够格，叫陆志廉亲自过来和我说。



      　　曹元元不答应做污点证人的原因很简单，他觉得陆志廉没资格和他谈条件。他答应做污点证人的原因也很简单，他想早一点出去报复陆志廉。

      　　出庭做污点证人最终为曹元元换来了八年减刑。但尽管如此，他也还需要坐十七年监。

      　　监狱里的日子过得没有时间。最初的那两年，陆志廉时不时会来探监。有时是为了案子，还有的时候只是为了问曹元元有没有在里面好好读书。

      　　不过曹元元没有一次给过他好脸色。陆志廉问他案子的时候，他就冷着脸平铺直叙。陆志廉问他有没有读书的时候，他就说关你屁事。

      　　但曹元元还是忍不住留意到，陆志廉每次来的时候，都显得十分疲惫。如果他们还是赤澳那三个月里的曹元元与陆志廉，曹元元肯定要叫他不要整日都像一块石头一样，一点懒都不会偷。难道他曹元元，还养不起一个陆志廉吗？

      　　但现在，曹元元恨陆志廉。他看着一次比一次疲惫的陆志廉甚至会想，那都是他自找的。

      　　陆志廉这种人，死了才算是对世界做贡献了。



      　　曹元元入狱一年半后，陆志廉就来的少了。他入狱两年后，陆志廉终于不再来了。

      　　赤澳在ICAC肃清之后换了一批惩教。如今的赤澳，尽管也还有些小偷小摸的事，但拉帮结派、打群架的事却再也没有。

      　　也不知道是不是陆志廉做了打点，亦或是ICAC真的让赤澳变得如此廉洁。曹元元即使没有钱后，在这里面的日子也过得还算平静。

      　　只是陆志廉不来之后，他总觉得缺了点什么。他想起陆志廉最后一次来，提醒他好好读书，考上MBA之后还可以再获批一次减刑的时候，还同他讲，他会一直看着他的。

      　　曹元元当时说了什么来着？

      　　哦，他说陆sir，我都被你抓进来了，就不用再做戏了吧。

      　　陆志廉果然虚伪！



      　　不过这次曹元元还是决定听陆志廉的建议。他本就是在美国读过书的人，MBA对他来说并不是什么难事。拿到了MBA，他又获批了三年减刑。

      　　拿到证书的那天，曹元元忍不住在上面敲来敲去。他得意地想，要是陆志廉来了，他多少要向他炫耀一番。

      　　可是陆志廉没来。曹元元想，陆志廉果然虚伪。



      　　曹元元44岁那年，他妈咪去世。消息传到赤澳的时候曹元元正在做手工。来告诉他这个消息的人是程德明。曹元元对着听筒愣了一会，突然问，“陆志廉怎么自己不来？”

      　　程德明沉默片刻，说陆sir正在办其他案子，现在不在香港。

      　　曹元元没再说话。他挂了听筒，回到监仓。他突然很想喝一袋啤酒，就像多年前他和陆志廉一起坐在这里做过的那样。

      　　但现在的赤澳没有啤酒，也没有陆志廉。



      　　曹元元被放出赤澳的时候，刚过完48岁的生日。他走出赤澳监狱的大门，看见程德明来接他的车。曹元元忍不住皱眉，他说怎么是你？陆志廉呢？

      　　程德明没有答他，只说，带你去个地方。



      　　程德明开车的水平就如他的人一般无趣。曹元元坐在副驾上，忍不住恶意揣测。他想难道ICAC招人的标准里有一条“不无趣者不招”吗？程德明是这样，陆志廉又是这样。在他想出什么结果之前，车子就停了。

      　　车子停在了一片墓园前。程德明下车，示意他也一起下来。曹元元突然有一种不好的预感。他跟着程德明来到一块墓碑前，看着他为这块墓碑洒扫。曹元元不可置信地看着陆志廉的照片被贴在上面，还是当年他记忆中的那个模样。

      　　曹元元突然很想笑。这一切都太荒谬：他对陆志廉好，将一切捧给他，陆志廉却骗他，背叛他。他想要报复陆志廉，侮辱他、折磨他，陆志廉却在他还未动手之前自己死了。

      　　还死在十二年前。

      　　陆志廉怎么敢死呢。

      　　整整十四年，曹元元为了报复陆志廉，等了整整十四年。这十四年里，他以为他恨陆志廉。因为他应该恨。他凭什么不恨？

      　　这份恨意支撑他、陪伴他，吞噬掉赤澳中一日又一日漫长的时间。

      　　可直到现在他才意识到，原来他不恨陆志廉。

      　　曹元元盯着那张照片看了很久，久到程德明都悄然离开，久到太阳从天边西沉。那份爱意、恨意、思念、不甘，最终都化为了性。曹元元红着眼，对着陆志廉的墓碑自渎。

      　　夏日傍晚的港岛还未褪去下午的炎热，一阵暖风徐徐吹来。这阵风，与当初他第一次见陆志廉时的那阵风重叠在一起，像是谁的手，轻轻掠过他的发梢。

      　　曹元元望着那张被他弄脏的照片，突然抬脚踹了墓碑一脚。

      　　然后他蹲下去，搂着墓碑睡着了。
  - title: 番外二：曹元元不知道的事
    body: |-
      　　1. 陆志廉不后悔抓他，但他愧疚于欺骗曹元元的感情。

      　　2. 陆志廉最后一次来找他的时候，是王蓝禄刚刚被炸死在电梯里的那天。

      　　3. 他来找曹元元，是因为曹元元是他唯一可以抓住的稻草。他失去了太多人，他一直在失去。

      　　4. 但曹元元不原谅他。其实陆志廉自己也没有原谅自己。

      　　5. 瞒住曹元元，不让他知道自己牺牲的事，是陆志廉生前的安排。他怕曹元元知道了会彻底自暴自弃。

      　　6. 陆志廉爱他。
