title: 生长痛
cp:
  - 曹陆
updated: 2026-11-02
summary: 没人说生长痛痛的不能是海绵体
status: ongoing
chapters:
  - body: |-
      　　曹元元不喜欢收养他的这个男人。

      　　一个中年男人，又黑又板正，连名字都那么无趣。“陆志廉”？现在还有谁会叫这种名字？这么一喊出来，恨不得所有人都知道他是ICAC，还要是最清廉的那一个。

      　　可偏偏就是这么一个沉闷的石头，如今却成了他的监护人，每日要和他住在一个屋檐下。曹元元不高兴，不喜欢，见到他就浑身不舒坦。他盯着陆志廉帮他铺好床，又把他的行李搬进来。曹元元把箱子踢到一边，堵在门口：“你怎么还不出去？”

      　　陆志廉却不恼——哪怕他们如今住的正是他的公寓——他平静地瞥曹元元一眼，笑了一下，只说“别睡太晚，你明日还要上学”，然后便合上门，走出去，留曹元元一个人躺在床上，对着天花板干瞪眼，想不通自己怎么就沦落到了这个份上。

      　　事情变成现在这样，还需要从半个月前说起。半个月前的时候，还是富二代大少爷的曹元元放学回到家，发现自己家来了许多穿西装、戴着ICAC工牌的人。而他那个老不死的老豆正面如死灰地被人拷走，只留下他妈咪承受不了打击，哭得昏厥过去。

      　　对于他老豆做的那些事，曹元元虽不知道细节，却也大体能猜个大概。袁正云从前几年开始就给人做白手套，洗过的黑钱不在少数。他的那些生意，本来曹元元也该有份。但因为曹元元年纪小，又是私生子，这才没这么早交到他手上。

      　　不过现在也没必要交了。袁正云的资产被没收了大半，房产也被拿去拍卖。他妈咪承受不了打击，成了精神科的长租客，于是十五岁的曹元元的去处便成了问题。

      　　他本是该去福利院的。ICAC的余Sir告诉他。但那个查了他老豆的陆志廉不知是出于愧疚还是什么，竟主动提出做他的监护人。于是经过层层审批，曹元元便到了他家。

      　　曹元元对他搞垮了自己老豆没什么意见。平心而论，他和他老豆并不对付，从小便被他鼻子不是鼻子眼不是眼。在袁正云没落网的时候曹元元便担心他将来会连累他妈咪，如今看来这担心不无道理。

      　　不过现在他妈咪至少有人照顾。曹元元盯着天花板想。ICAC做事还算有人性，他妈咪的医药费都是政府出的，一直到曹元元成年，有能力工作为止。

      　　对于这一点，曹元元并不怨恨。一方面他觉得他老豆罪有应得，而另一方面，没了他老豆，曹元元浑身上下都松了一口气。他甚至觉得，就算ICAC不把那个老不死的干垮台，他自己也迟早要搞这么一遭。

      　　可他对陆志廉这个人很有意见！曹元元从床上爬起来，光着脚，将陆志廉新做的隔断窗户拉开一咪咪缝。陆志廉正在低头整理衣物，曹元元从窗户缝中看他，他便对曹元元阴暗的窥视一无所知。

      　　陆志廉的公寓不大，为了给曹元元一个单独的房间，他便请工人在自己卧室里又砌了两面墙，于墙的正面开了门与窗，隔出一个小空间做卧室。

      　　曹元元冷着脸盯着他，看着陆志廉那两条粗壮的腿支撑着一个四方的屁股在他面前晃来晃去。曹元元不明白为什么一个男人的屁股也可以那么大。他看着陆志廉那紧致的、收窄的腰，只觉得怎么看怎么不顺眼，索性“啪”地一声合上窗户，把陆志廉与他的屁股一并关在了外面。

      　　陆志廉想是听到他关窗户的声音了。他听到陆志廉在外面叹了一声，但却仍没进来，也不说什么。曹元元憋着一口气，像是一拳打到了棉花。他恶狠狠瞪了一眼窗户的方向，盯着窗户上隐隐约约透出的陆志廉忙忙碌碌的影子，一翻身不再看他。

      　　他为什么要呢？曹元元用被子把自己缠起来。明天早上还要回去学校读书，陆志廉说会开车送他。不过是一个陆志廉，又没什么出奇，等到明天早上，曹元元还不是想看多久就看多久。

      　　

      　　第二天早晨天刚蒙蒙亮，曹元元便被厨房里盘子碗筷轻撞的声音吵醒。陆志廉正在做早餐。曹元元听到煎蛋躺在平底锅里滋滋响。又过了片刻，系着围裙的陆志廉走进来。“该起床了”他提醒道。于是曹元元抱着被子坐起身，伸腿将拖鞋从床下踢出来，蹬上，不情不愿地跟着陆志廉去吃他做的早餐。

      　　陆志廉人板正，厨艺也板正。煎蛋是少油的，又有两片吐司、些许生菜与三片牛油果。一顿饭吃下来，只听见刀叉碰撞的声音，莫说说话，便连一丝呼吸声也不闻。曹元元吃得没滋没味——陆志廉也压根没怎么放盐——他扭过头瞥陆志廉，陆志廉却专心致志吃他盘子里的早餐，也不知道他尝不尝得出味。

      　　曹元元握着叉子，叉起牛油果，放下，又叉起，又放下，忍耐再三，终于把叉子往餐垫上一扣：“我要吃炸鸡。”

      　　陆志廉抬头看了他一眼，笑了一下，却没答应：“炸鸡不健康。”

      　　曹元元心想都不知道能活多久的年代谁管健康，但他还是退而求其次：“那我要吃牛肉。”

      　　这个陆志廉答应了。他放下刀叉，拿出手机，将牛肉片加入购物清单里：“下午去买。”

      　　曹元元决定他要跟着陆志廉一起去买，以免陆志廉买成了他不喜欢吃的口味。他吃完盘子里的早餐，一蹬椅子站起来：“走吧，我吃完了。”

      　　陆志廉好脾气地也就随他去。他吃饭很快，曹元元只不过说话间，陆志廉就吃完了他那块吐司。曹元元望着他那个干净的盘子和摆得整齐的刀叉，撇撇嘴，陆志廉却又从冰箱里拿出一瓶牛奶递给他：“路上喝。”

      　　曹元元于是就这样抓着一瓶冰牛奶上了车。坐在副驾的时候他扭过头去看陆志廉长长的鬓角，曹元元捏着牛奶瓶，忍住伸手去摸那条鬓角的冲动，半天才说：“我下午五点放学，你别迟到了。”

      　　陆志廉笑了笑，说他不会迟到。于是曹元元把头扭回去，没再说话。

      　　他一直望着窗外，雨珠顺着车窗向下画出长长的水痕。雨刮器呼哧呼哧地响着。又过了一会儿，陆志廉把车停下。学校到了。
      　　
