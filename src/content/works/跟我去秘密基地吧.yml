title: 跟我去秘密基地吧
cp:
  - 花苏
updated: 2025-10-02
summary: “奈布哈尼，近卫不能说不行。”
status: finished
chapters:
  - body: |-
      　　达玛拉王子是老苏丹的第十六个王子，却不是最不起眼的王子。

      　　他的母亲是如今王宫中最有权势的妃子，他的舅舅是如今奥斯曼最有权势的领主。但这一切都不是他走到现在所倚仗的全部，至少在他的追随者，奈布哈尼眼中不是如此。从他见到王子的第一面起，他就被他本身的魅力所折服了——无论是他天赋异禀的剑术、明艳逼人的容貌，亦或是那对总是似笑非笑的唇角，都令这位年轻的红发剑客久久不能自拔。

      　　达玛拉王子今年十五岁。奈布哈尼认识他的时候，自己也才刚刚过完十六岁的生日。春日的王宫温暖明媚，粉色的、白色的樱花一簇簇地坠在枝头。影影绰绰的石榴树荫下，年少的王子独自站在那里。奈布哈尼虽不认得他，却认得他发间由金线串起的珍珠与绿松石。他跪地行礼，王子蓝绿色的衣摆迤逦在他手边。他像是嫌热似的故意脱出一只袖子来，只半披着衣裳垂眼瞥了奈布哈尼一眼。

      　　奈布哈尼直挺挺地单膝跪着，没有抬头。王子蜜色如融化的黑巧一般细腻的小腿隐隐约约从衣摆中透出来。他听到头顶传来一声淡淡的问句，愣了几秒才意识到王子是在问他叫什么名姓。

      　　“我叫奈布哈尼。”红发的剑客说。王子唔了一声，又道，那么奈布哈尼，你会使剑么？


      　　
      　　就这样，奈布哈尼成了王子的陪练。说是陪练，更像是王子的玩伴与第一个对手。也正因如此，奈布哈尼逐渐意识到，达玛拉的性格并不像他的名字那样如杜鹃一般娇弱。他强势、好胜，总会有些肆意大胆的任性举动。而奈布哈尼，奈布哈尼总是愿意追随他的。无数次，他们从王宫中飞驰而出，骑着两匹骏马到附近的山野捕猎。达玛拉总是滚得一身泥回来，少不了要挨母妃一顿骂。但若要算上那些被他征服的凶狮猛兽，这也就不算什么了。

      　　奈布哈尼敏捷，且格外珍惜自己的那头红发，在滚一身泥这件事上鲜少与王子休戚与共。达玛拉便笑他，空有一身好剑术，却总和姑娘一样矫情。奈布哈尼抱着一株野玫瑰，梗着脖子争辩，说干干净净的，才招美人喜欢。达玛拉不以为意地嗤他，却在奈布哈尼捧着他的小腿帮他擦拭干净腿上的那些泥时没有说话。他看着奈布哈尼仔仔细细地擦掉泥点，又掏出一盒香膏往他脚腕上抹，终于忍不住皱眉：“抹这些做什么？”

      　　奈布哈尼眨眨眼，他说殿下你忘了，一会儿你要去面见王妃。若让她闻见你打猎的血腥味，岂不是又要罚你？

      　　达玛拉沉默片刻，也就伸着腿继续让他抹了。剑客的红发垂下一绺蹭在他脚踝上，王子却望着那里不知在出神想什么。一直到奈布哈尼确保他身上再闻不见一丝血腥气，他才再一次出声：“奈布哈尼，明日你再随我出城一趟。”

      　　奈布哈尼想也没想便说好。于是王子收回了腿，将手中的短剑挂回腰间。他有些烦闷，关于一会儿不得不应付过去的背书。奈布哈尼捧着那盒香膏，拍着胸脯跟他承诺：“明日我一早就来宫中找你。”

      　　第二天天才亮，奈布哈尼便如约在宫城外等着了。远远地，他看到达玛拉换了一身孔雀羽色骑装，骑一匹白色的马，不疾不徐地向他走来。奈布哈尼正纳罕为何今日王子不着盔甲，后者便像猜出他所想的一般，只说今日并不捕猎。奈布哈尼噢了一声，却仍将长剑别在腰间，甩甩缰绳，驭马追着前面的王子而去。

      　　他们穿过葱绿的柏树林，将白色的鸟和青色的王宫遗留在身后，缩成一个越来越小的点，来到一条山路小径上来。潺潺的溪水从石板路下淌过，达玛拉跳下马，将它往旁边的树干上一栓，又拍了拍奈布哈尼的马，示意奈布哈尼也一同下来。

      　　“这里骑马过不去，”他说，“除非你想连人带马一并栽到水里去。”

      　　他这样说着，眼前还真浮现出了奈布哈尼连人带马一起摔了个狗啃屎的模样。这让达玛拉大笑起来，他揶揄地看着奈布哈尼的那头红发，幸灾乐祸道：“噢，那你可要花时间梳头了。不过这里可没有女奴，你要怎么编你那个精细的麻花辫才好呢？”

      　　奈布哈尼被他说得脸红，也就赶紧跳了下来。他惦记着不想让新做的镶了宝石的靴子沾上泥，便犹犹豫豫不想走那个长了青苔的石板路。达玛拉却不等他，他一把抓过奈布哈尼的手，不由分说地把他拽上小石板路。奈布哈尼被他攥着手指往外掰，不由嗷嗷喊痛。达玛拉便骂他麻烦，但还是换了个方式，改把他的整个手都包在自己手心里。

      　　“这下总行了吧。”王子不满地晃了晃他们牵在一起的手，“奈布哈尼，你好麻烦。”

      　　少年剑客脸更红了。他被王子软乎乎的手拉着，心跳都快了几分，仿佛被攥着的不是他的手，而是他的心脏似的。可奈布哈尼不懂，他将其归咎于达玛拉拽着他跑得太急啦、太快啦，快得他都要看不清自己到底是踩进了水里，还是踩在了石面上。

      　　“达玛拉，你跑慢些！”他小声叫道。可达玛拉哪里是会乖乖听话的人，于是还没等奈布哈尼的惊呼落下去，他们便已然站在一个爬满藤蔓的山洞前了。

      　　

      　　“哈！终于到了！”达玛拉一剑挑开山洞口覆着的碍事藤蔓，熟门熟路地走进去。奈布哈尼跟在他后面，站在门口缓了三秒钟，视线才终于逐渐适应了山洞里的昏暗。

      　　这俨然是一方别有洞天的小天地。整个山洞都铺着软和的羊毛地垫，四个角各放了一座灯架。山洞里并无太多灰尘，显然是有人定时打扫。达玛拉随手扯掉几个盖在家具上的防尘罩，露出下面的沙发与坐垫来。

      　　“坐啊，奈布哈尼。”他招呼道，“杵在门口做什么，还要我再拉着你的手过来吗？”

      　　奈布哈尼有些尴尬，方才被王子牵着手淌水的丢人事迹又重新回到了眼前。但很快，他的注意力就转移到了正跪坐在几个大箱子前翻箱倒柜的达玛拉身上：“殿下，你在找什么啊？”

      　　“这个！”达玛拉唰得举起一本书，晃得书页沙沙响。他像猫似的跳过来，重重坐到奈布哈尼旁边，把那里的坐垫坐出一个凹陷的坑，“我还以为我把它丢了，幸好还在这里。这种书现在可不好找。唔，尤其是在被我母妃知道了我偷偷买书的渠道以后。”

      　　奈布哈尼闻言更好奇了。他睁大眼，支着膝盖倾身过去，看着达玛拉把那本书放在膝上，翻开一页。

      　　上面是一个男人的裸体。

      　　奈布哈尼脸噌得一下又红了。他像被烫了一样迅速弹开，差点撞倒旁边的灯架：“达玛拉，你……我……我们不应该……”

      　　达玛拉哈哈大笑：“奈布哈尼，亏你还说你是什么下城区烟花之地的常客！只是一本图画书就把你吓成这个样子，你那个花花公子的名头怎么来的？”

      　　奈布哈尼才不会告诉他自己其实只去那些欢愉之所温柔之乡饮过几杯酒便罢了，根本就没有碰过任何女子——那样他的殿下该不高兴了。毕竟那也就意味着，他此前给他讲的那些风月故事根本不是亲身经历，而全是他道听途说、自己改编的。

      　　但那怎么能怪他呢？他年岁不大，对那些或温柔或多艺的姐姐们也只有敬慕之心，却没有男女之情。之所以会去那里饮酒，也不过是想多听些故事，回来讲给王子殿下听而已。

      　　然而这些都不能讲给达玛拉听。奈布哈尼胀红着脸，强迫自己的双腿重新走回了那只坐垫旁。这次他只敢老老实实坐着了，手也规规矩矩放在膝盖上：“我只是……我只是没想到你会给我看这个……”

      　　达玛拉显然一个字都不信。不过幸好他没有再说什么，他只是指着画上的那个男人腹下三寸之物，说这个，你知道这是什么吧？你身上就有一个。

      　　奈布哈尼还在脸红，一个字都没听进去。达玛拉没指望他那么快转过弯来，于是又翻过一页。这次画上画的是一个女子。王子指了指画上女子腿间的地方，语气平淡，像谈论明日的天气一般：“我有的是这个。”

      　　达玛拉本是要探他的态度，他羽翼渐丰，难免招致父兄忌惮，是而要尽早为自己选一批忠心的追随者出来。他身上最容易被拿来做文章的便是这一件事，便拿它出来问询。但奈布哈尼……奈布哈尼只是痴呆一样地看着他。达玛拉啧了一声，敲了敲红发伴读的脑袋：“奈布哈尼，你傻了吗？”

      　　他下手没留劲，敲得奈布哈尼嗷得一声捂住脑袋。红发剑客泪眼汪汪地揉了揉被王子摧残的地方，还不忘整理了一下头发和上面的珠珠串串：“没有啦，达玛拉你下次不要敲那么重，会敲傻的……”他犹豫了一下，又道，“我刚才只是在想，所以他们说你之前做过公主，是真的了吗？”

      　　“是啊。”达玛拉毫不在意地拨拨头发。但紧接着，他像突然想到什么一样眯起眼，“不对，你和人在背后传我小话？”

      　　“我没有！”奈布哈尼立即叫屈。不过他的声音很快弱了下去，支支吾吾道：“只是别人在说，我听了一耳朵……”

      　　“哦，是吗？”达玛拉瞥了他一眼，却没再追究他漏洞百出的解释。奈布哈尼小心翼翼地盯着他，见他没有要生气的意思才又道：“那你是怎么……”

      　　他没有说完。他想问达玛拉是怎么从公主变成王子的，老苏丹又是怎样准许这件事的。可他不想让自己听起来像是那种喜好探听朋友隐秘过去的人，也更担心，达玛拉会不会不想提起那段往事。

      　　但好在，达玛拉似乎并不在意。他像是早已猜出奈布哈尼所想那般歪了歪头，语调轻快：“你想问我是怎么让我父王同意我成为王子的，是不是？奈布哈尼，有没有人教过你，作为近卫，在主君面前要知无不言，不可吞吞吐吐。”

      　　奈布哈尼只得老老实实点头认错。他态度良好，王子很快便胸怀大度地原谅了他。“也没什么大不了的，”他说，“我舅父——不是维齐尔的那个，是杜卡迪塞尔*的那个——应允他若是予我王子的身份，便将沿海的三座城池送给他。那可是相当富饶的三座城池。”他古怪地笑了一声，“一个想做王子的‘公主’，换三座能带来无数黄金和美人的城池，他当然知道该怎么选。”

      　　“重点是，”他倾身过来，耳侧的珠串也一并垂下。他贴得极近，是而奈布哈尼可以清楚地看到小王子常年隐藏在黑发之下的那双眼睛正闪烁着怎样的兽性的光芒，“重点是，他老了。老到已经失去了他应有的魄力。如果是我，不过是三座富庶的城，我何须向任何人妥协？只要半年——不，三月时间，我就能让它臣服在我的铁骑之下。”

      　　“不过，这对你我而言毕竟是件好事。除非……”他又笑起来。奈布哈尼还是怔怔地看着他，达玛拉没有理会。他倏然站起身，唰拉将座椅推到三步之后，道：“因而，奈布哈尼，我要问你：你是否宣誓永远效忠于我？作为我的近卫，无论现在，或是将来。不得失约，不得背叛。”

      　　“我宣誓！”奈布哈尼大声说。他的动作比他的脑子更快，只因他的心早已吵闹地咚咚跳起来，“达玛拉，殿下，我不在乎你是王子还是公主。若你说你是王子，那你就是王子。从我认识你的那天起，你就是我的殿下了。我会永远忠于你，保护你，为你而战，我会永远——”

      　　“奈布哈尼。”

      　　“诶？”

      　　“你喊那么大声，让人听去了禀告给我父王，我们两个都得被砍头。”

      　　奈布哈尼哑巴了。为表自己绝对不会害得王子和他一起被砍头，他还特地用手捂住了自己的嘴巴，憋得满面通红。不过，他的眼睛还是睁得很大、很圆，一眨一眨的。“可是殿下，”他从自己捂住嘴的手指缝隙中说，“我说的都是认真的。我一定会是你最好的近卫。”

      　　“那好吧。”小王子说，“如果你背弃你的誓言，可是要付出生命的代价的。”

      　　他了却了一件心事，便又变回了平时的那个达玛拉。那本书仍在那里，摊开放着，他盯着它看了一会儿，突然道：“不如我们来试试吧！”

      　　“试什么？”

      　　“这个呀！”达玛拉抓起书塞进他怀里，弄得书页险些散架，“我还没试过这种事呢。书里写得它很好玩。”

      　　奈布哈尼眨眨眼，没反应过来这个是哪个。然而只不过一愣神的功夫，达玛拉已经取代那本书爬到了他身上：“不许拒绝。你说了要永远当我的近卫的。”

      　　“可是……”奈布哈尼试图出声。他现在反应过来这个是哪个了——那本书就摊在他面前呢！“可是我们……”

      　　他想说我们不应该这样，可达玛拉沉乎乎地压着他，软软的腿肚挨着他的小腿，这让他不由结巴起来。奈布哈尼的脸又红了，他觉得自己今天脸红的次数可能要比他以往十几年中的加起来都要多。但达玛拉贴得实在太近啦，奈布哈尼几乎可以看清他长长的睫毛：“达玛拉，我们要不还是别……”

      　　达玛拉不高兴了：“别什么？你可以和别人做，不可以同我做么？难道你刚立完誓就想背誓？”

      　　“我没有想背誓……”也没有和别人做。奈布哈尼小声争辩，“可是，可是近卫不是用来保护王子的安危的嘛？”

      　　“对啊。”达玛拉理直气壮。他趴直了一点，手肘撑着奈布哈尼身后的软垫，黑卷发蹭得奈布哈尼肩头直痒痒，“那王子难受，近卫要不要为王子排忧解难？”

      　　奈布哈尼点头：“要。”

      　　达玛拉往下一指：“那我这里难受。”

      　　“……”

      　　奈布哈尼往下一看，脸更热了。达玛拉不知什么时候把衣裳下摆掀到了一边，只露出两条光溜溜的腿来，而那处柔软的肉花正像浓稠的、融化了的蜂糖一样贴蹭着他的腰腹，濡湿了那里的一小块布料。奈布哈尼从前只在话本子里读到过这处器官，却从未见过真的。他小心翼翼地伸手碰了碰它，指尖立时被两片湿润饱满的肉唇含了进去。

      　　“达玛拉，你，你流了好多水……”他说。而达玛拉只是伏在他颈窝又啃又咬，闻言浑不在意地哼了两下：“它一直都那样，碰一碰就出水。”

      　　奈布哈尼哦了一声，又问：“殿下，你为什么一直在咬我啊？”

      　　达玛拉皱眉：“这本书上画的，做这种事之前都要先亲嘴。你不是做过吗，你不知道？”

      　　奈布哈尼没做过，奈布哈尼也不太懂亲嘴，但奈布哈尼觉得亲嘴应该用不上虎牙——除非之前在欢愉之馆遇到的姐姐都在骗他：其实亲嘴并非是很舒服的，甚至还有一点痛。但他很喜欢达玛拉对他的亲昵，所以他觉得达玛拉并没有错，可能只是亲错了地方。他蛄蛹蛄蛹，让自己的脑袋可以和达玛拉挨到一处，然后学着曾在欢愉之馆看来的例子，像小动物一般笨拙地舔了舔达玛拉的嘴唇。

      　　“我只会这一种亲亲，”他小声说，“别的我就都没有学过了……”

      　　但好在达玛拉还算满意。他回味了一下奈布哈尼刚才的舔舐，觉得滋味不错，于是决定奖励自己这位能干的近卫。他依样学样，也照例在奈布哈尼嘴上舔了一下：“不错，你做得很好。亲嘴的下一步是什么来着……哦，下一步是肏屄。奈布哈尼，把你的裤子脱下来。”

      　　奈布哈尼……奈布哈尼脸涨得像热气球。他完全没想到整日只在王宫与猎场活动的王子，居然也会知道这种只有黑街最不修边幅的流浪汉才会随口说出的粗野词汇。但尽管如此，他的胃里仍因刚才那两个短暂的、湿漉漉的舔舔生出了一只蝴蝶，不歇不止地忽闪着翅膀。他望着对他颐气指使的小王子，期期艾艾道：“达玛拉，我……”

      　　但达玛拉已经在扒他的裤子了。他扒的动作之快，让奈布哈尼的犹豫和别的什么连他自己也不知道的后半句话全都没来得及说出来。王子软软的胸部压在他身上，小腹热热地贴着他，灼烧得奈布哈尼的脑子几乎停转。他张张嘴想说什么，可达玛拉的惊呼比他更快。小王子皱着眉在他身下摸索了几下，又撑起身子往下看了看：“——什么？你怎么没反应？”

      　　奈布哈尼没明白他在说什么。于是王子从他身上下来，索性拉过奈布哈尼的手让他自己去摸：“奈布哈尼，你不是常眠花宿柳吗，怎么从来没告诉过我你其实不行啊？”

      　　少年剑客这才反应过来他说的不行是什么不行，脸霎时红成了和头发一个颜色——他没有不行，他只是……他只是一时没有意识到这时候自己需要“行”起来罢了。但王子已经对他行不行失去了兴趣，他思忖片刻，盯上了奈布哈尼的嘴唇：“要是你下面不行，就用嘴吧。”

      　　不等奈布哈尼过多抗议，他便不由分说骑了上来。达玛拉的穴又湿又热，像一团融化了的蜂蜜一般黏腻地糊住他的脸，让他几乎不能呼吸。奈布哈尼觉得自己仿佛一匹枣红色的马，而他的王子就是驾驭他的骑士。达玛拉两条大腿都紧紧贴着他的脑袋，像驭马一样用力向内夹蹭，饱满胀大的阴蒂挤压在奈布哈尼的鼻尖，每蹭一下屄里便往外喷一股水。他骑得爽了，便扯一缕奈布哈尼的红发在手里，从鼻腔里哼出一两声黏黏糊糊的呻吟，奈布哈尼摸摸他的背，他就滑下去舔舔奈布哈尼的嘴唇，把自己喷出来的屄水再重新吃回去。

      　　“你的嘴倒挺好用的。”达玛拉餍足地眯着眼睛，这么评价道。他伸出舌尖，又舔了一下刚刚从奈布哈尼嘴上亲来的他自己喷的那些淫水，失望道，“这也没那么好吃嘛。话本里是乱编的吧。”

      　　奈布哈尼脸红红地望着他，也不知道是被憋得还是害羞。

      　　他歇够了，便又一翻身骑了上去，把他的小枣红马兼近卫兼未来的王都第一剑客连同他的“唔唔唔唔”声一起压在了身下。“我们再来一次吧。”小王子说，“奈布哈尼，近卫不能说不行。”

      　　至于奈布哈尼？奈布哈尼自然是没有什么话语权反对的，毕竟他的嘴都被堵着呢。他能做的只有继续做好一个好近卫，一匹好小马，随他的王子驰骋在在春日里、在山鹑鸣叫中，在玫瑰花丛下。

      　　真好啊，奈布哈尼想。如果可以，他还想再亲一下达玛拉。
