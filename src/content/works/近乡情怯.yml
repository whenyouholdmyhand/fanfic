title: 近乡情怯
cp:
  - 洛风
updated: 2026-11-01
summary: 洛军只是想回到阿妈的子宫里罢了。
status: finished
chapters:
  - body: |-
      　　陈洛军翻到了一张旧照片。

      　　照片已经泛青，存放在一个木匣子里，不知在阁楼上放了多久。陈洛军也是偶然间清扫阁楼的时候才发现的。他如今住在龙哥的地方，自然不能太邋遢。陈洛军自认是个整洁的人，于是除了把自己那几件仅有的衣物洗得干干净净外，还自觉承担起了打扫阁楼的任务。

      　　这个匣子就是在这时掉出来的。当时他正在和床头木架上的灰尘作斗争，掸子扫过去的时候被这个木匣子砸了头。陈洛军吃痛地捂住头，目光却被地上摔开盖子的匣子吸引了去。那里面孤零零躺着一张照片，依稀是一个女人。——不，不是女人。陈洛军小心翼翼地捡起那张相，像是怕弄脏它似的，在衣服上蹭了蹭指腹，才拂去它表面沾染的细微的灰尘，借着阁楼小窗透进来的几缕光线走到窗边细看。

      　　那是龙卷风。

      　　照片上的龙卷风和如今并没有太大分别，只是头发仍是乌黑的。他穿了一件青布旗袍，正斜倚在圈椅上小憩。但真正吸引陈洛军目光的，还是他垂手护住的、微微隆起的小腹。

      　　陈洛军不明白龙哥为什么要穿这样的衣服，但那是龙卷风，龙卷风做什么他都不会觉得有任何不对。只是……龙卷风垂手护着小腹的模样在他脑海里挥之不去，像是有羽毛在他心上挠啊挠。小狗再睡不着，他仔细地把那张相放回匣子里，揣着匣子蹑手蹑脚跑到楼下去找信一。

      　　信一正睡得四仰八叉，突然一张相片就被戳到了他鼻子底下，随之而来的还有一个黑得跟屋子融为一体的光头仔。他吓了一跳，差点把睡衣袖子里的小刀掷出去，直到听到是陈洛军的声音才意识到这是光头仔，又头一歪睡了过去。

      　　“信一，醒醒。”陈洛军摇他。信一嗷了一声，睁开一咪咪眼睛。那张相在床头昏暗的光线下清晰可见，他瞄了一眼，说这我大佬啊，怎么了？

      　　陈洛军说可是……

      　　信一恨不得爬起来跟这个光头仔打一架。他一骨碌坐起来，把照片抢到自己手里：“可是什么可是。”

      　　不过这一抢他也愣住了。信一拿着那张相翻来覆去看了好几遍，也没找到丝毫伪造的端倪。他看了洛军好几眼，才忍不住问：“这照片你哪来的？”

      　　陈洛军老老实实地答：“是从阁楼里翻出来的。”

      　　信一大为震撼，自言自语：“我怎么不知道我大佬以前还生过孩子……”

      　　陈洛军像见鬼一样看着他。

      　　信一拍了下脑袋，说原来你还不知道。我大佬他某个部位和别人长得不一样。

      　　他见洛军还是那副表情，又哎呀一声，解释道：“你别这么看着我。这事本也没几个人知道，只有大佬亲近的叔伯兄弟才清楚。我也是小时候被大佬带去洗澡才发现的。”

      　　陈洛军梦游似的回去了。

      　　其实陈洛军没有想太多。龙哥是救他的人，他是什么样陈洛军都觉得他是最好的。只是……他想起信一那句“我大佬和别人长得不一样”，那张相片上、龙卷风年轻时的模样便一次又一次地搅弄他的心。陈洛军不明白这种感觉是什么，只觉得这是不应该、不对的。他不敢再想龙卷风，也不敢再见龙卷风。仿佛只要这样，他就不会再对龙卷风生起任何不该有的心思，也就不再会亵渎他最最敬重的龙哥。

      　　

      　　龙卷风之后几天都觉得陈洛军看起来怪怪的。

      　　陈洛军就像一只小狗。初入城寨的时候脏兮兮、傻愣愣，可眼神却是干净的。后来在城寨生活了一段时间，被善待，被照顾，逐渐放下警惕，变得活泼、不设防起来。龙卷风知道他前三十年过得颠簸辛苦，故而总是忍不住多照拂他一些。街坊们也十分喜爱这个踏实肯干的光头仔。

      　　本来一切都进行地很平稳，谁想最近陈洛军也不知怎么了，看他的眼神总是躲躲闪闪，却还是要偷偷摸摸看；总往他身边凑，又不上来说话。

      　　龙卷风本以为是这个后生仔又惹上了什么麻烦，想找他帮忙，却不好意思开口。可查来查去，又什么端倪也没有。问信一，信一也说光头仔最近没什么异常，该打工打工，该打麻将打麻将，没听他说有什么仇家。龙卷风到底放心不下，这天飞发铺收了工，他便把陈洛军叫过来盘问。后生仔像只被按住肚皮剃毛的小狗一样躺在理发椅上，说话都结巴了起来：“龙，龙哥……”

      　　龙卷风捻捻他胡茬丛生的下巴：“紧张什么？惹到仇家了，不敢同我说？”

      　　洛军摇头。但龙卷风不许他走，他只好从兜里掏出来那张照片，老老实实交代了他不小心翻出龙卷风旧照的事。

      　　龙卷风只扫了一眼就知道这个傻小子在想什么。他叹了口气，拿过剃须膏往洛军两颊上抹：“你想问什么？”

      　　陈洛军结结巴巴：“龙、龙哥，你……”

      　　他想了半天都没想出来一个体面一点的问法，于是声音越来越小，最后成功地和蚊子叫化为了一个量级。剃须膏糊住了他嘴巴旁边大部分的地方，正好给了他支吾的借口：“信一说他也不知道你还生过孩子……”

      　　龙卷风睨了他一眼，没说话。洛军的脸“腾”得一下红起来，脱口而出：“信一是不是你生的呀？”

      　　他问出口的时候就后悔了。小狗又缩了回去，仿佛想找个地洞钻进去。陈洛军不知道自己在说什么傻话，他怎么可以……怎么可以问龙哥这种问题……可话说出来就不能收回去，他惴惴不安地躺在理发椅上，希望龙哥不要一拳把他打死……不，只要龙哥别把他赶出去就行了。只要龙哥不赶他走，他做什么都愿意。

      　　龙卷风却不知道怎么告诉他。

      　　洛军的身世因为他老爸陈占的原因本来是不能说的，不然可能会给他引来杀身之祸。可龙卷风又担心这个傻仔跑出去到处问，一样会被有心之人察觉端倪。他一时犹疑不定，下意识便想去点烟，不想烟却被理发凳上这个眼疾手快的愣头青抢走了。陈洛军从他指缝里抽走那条烟，拘谨却固执地道：“龙哥，四仔说你不能食太多烟的……”

      　　龙卷风望着空空如也的手愣了一下，啧道：“臭小子，连大佬的烟都敢抢。”

      　　陈洛军脸红扑扑的，但仍藏着那根烟，不给他。

      　　龙卷风叹了一声，说你是我生的。

      　　陈洛军傻愣愣地看着他。

      　　龙卷风见他呆呆的，又嘱咐他别随便出去说。他的身份说出去会有危险。可陈洛军的脑子显然没有跟上，对杀身之祸四个字充耳不闻。他安静了一会儿，突然抬头：“所以你是我阿妈吗？”

      　　龙卷风敲他脑袋：“我刚跟你说的你听到没有？”

      　　陈洛军这才从大佬突然变成了阿妈的震惊中回过神来，捂着脑袋老老实实地应了。

      　　

      　　在三十岁寻到了自己真正的阿妈，这本是好事。可随之生出的绮念就不是什么好事了。闷热的夏夜里，陈洛军的脑子在他第一百零五次想起那张匣子里的照片，翻来覆去、想入非非之后突然拐上了一个岔路。他想起信一那句“我大佬和别人长得不一样”，脸倏地一下涨了个通红。

      　　于是下场就是半夜偷偷摸摸爬起来洗衣服。陈洛军鬼鬼祟祟地，遮遮掩掩地抱着一篓床单，底下还压了一条刚刚被他弄脏的内裤，试图避开可能还没睡的信一和街坊的注意，溜出太湖楼到龙头处去接水。

      　　但显然他的运气不太好。刚出楼梯，陈洛军便意识到一楼有人。飞发铺的灯熄了两盏，电视机却开着。他看到龙卷风手里捧着一份报纸，垂着头，歪在沙发上有一阵没一阵地打鼾。

      　　陈洛军不想吵醒他，便抱着篓子蹑手蹑脚地往门外溜。可还没等他的左脚迈出飞发铺的门，龙卷风的声音就夹在夏夜的风里把他的裤脚勾了回来。

      　　“这么晚不睡觉，去哪？”

      　　大佬原本威严的声线沾染了些刚睡醒的缱绻。陈洛军本就因为那些若有若无、暧昧不清的念头想要找个地缝钻进去，如今被龙卷风撞个正着更是恨不得自己原地消失。他僵在原地，试图用自己高大笨拙的身躯遮掩住怀里那个罪恶的脏衣篓：“龙哥……我，我去打水……”

      　　他听到龙卷风笑了一声，然后就被捻了下巴。大佬温暖干燥的手搔了搔他的脸颊，像逗小狗一样：“脸这么红，是不是上火啊?”

      　　陈洛军脸红得更厉害了，与脸一同涨红的还有他某个不能描述的部位。他嗷得一声扔掉脏衣篓，跳起来，捂住那个瞬间接管了全身上下气血的地方，叫道：“龙哥对不起我不是——”

      　　龙卷风被他吓了一跳：“做什么？”

      　　他向下一瞥，看见后生仔那个精神的……，哪还有什么不知道。龙卷风咳了一声，摆摆手，只当是年轻人火气盛：“你要不要去处理一下？”

      　　陈洛军当然想去处理一下，可是……他仍抱着那个篓子，仿佛这样就能让自己少出点丑似的：“龙哥……我……我不会……”

      　　他确实不会。陈洛军的前三十年过得像土狗一样狼狈，以往的每一次，他都是做着工，拉长衣摆，祈盼它在被别人发现之前自己下去。

      　　可如今他有龙卷风。大佬指腹留下的柔软触感仍残存在他颊上。陈洛军突然没来由地感到了一种委屈，他抬起头，怯懦地牵住龙卷风的袖口：“阿妈……”

      　　他叫得可怜巴巴。龙卷风叹了口气，把他提溜起来：“好了，来，我帮你。”

      　　陈洛军从来都没有想过自己还能有和龙卷风如此亲密的时刻。但此时龙哥略带薄茧的手掌贴着他的……他的……陈洛军只觉得心跳好像烟花一样炸了锅。龙卷风的手只是在他身上略挨一挨、摸一摸，他就只会喘粗气和拱在龙卷风颈窝里喊阿妈了。

      　　“龙哥……阿妈……我好舒服……”他笨拙地用自己炙热的欲望磨蹭龙卷风的掌心，前液溢得到处都是。龙卷风衣领处沾染了些淡淡的烟味，还有衣服上的肥皂香，陈洛军嗅着，手都不知往哪放，只敢虚虚搂在龙卷风腰上，“我好难受……”

      　　龙卷风被他喊得总觉得自己在乱伦，他警告地刮了刮小狗欲望的顶端，勒令他不许再叫。狗很乖，随即安静下来。但过了会儿，龙卷风又听见他小小声的祈求：“可是我很久都没有阿妈了……”

      　　龙卷风只好妥协。这是他生出来的孩子，他却总是亏欠他的。他握着后生仔怎么也消不落去的欲望，终是叹气。

      　　罢了，天注定的。

      　　他解开衣物，将那团欲火纳入自己的身体。湿润温暖的产道温柔地裹纳住青年硬挺的物什，就像三十年前，他还在他的子宫里那样。

      　　当年的事他没得选，亲生子流落在外也非他所愿。可如今洛仔又一次直冲冲、傻愣愣地闯进城寨，回到他的身边，那他想再将他生出来一次，又有什么不对？

      　　他摸了摸后生仔毛茸茸的寸头，像天底下任何一个母亲哄睡婴孩那样慢悠悠地轻轻哄他。

      　　他说：“好了，好了。现在你有阿妈了。”
  - title: 彩蛋
    body: |-
      
      　　以往平静祥和的城寨近日多出了一丝风雨欲来的气息。

      　　先是一向半死不活的跌打医生四仔不知怎么回事发了一顿脾气，还是对着他的好兄弟、那个入城寨已经好一阵的陈洛军。后者却毫无怨言，只是像个鹌鹑一样乖乖听训。后是城寨大业主狄秋，气势汹汹地带着零星几个人闯进太湖楼，却没闹出什么太大的动静。听说也只是将那个愣愣的陈洛军揍了一顿，但又没下死手，可能也就让光头仔脸上多了一个拳头印，别的都还活蹦乱跳的。

      　　只不过狄秋走的时候脸仍是臭的。后面跟着一个看起来完全状况外的Tiger哥。据被Tiger哥顺手像拎小鸡仔一样拎走的庙街头马十二少所说，狄秋只给他的契兄丢下四个字：“好自为之。”

      　　也不知道是在说什么。

      　　然而狄秋也恼火。他原本记恨陈占三十年，心心念念要让仇人断子绝孙。如今仇人的儿子倒是找到了，结果却是自己的兄弟生的！狄秋看到那个出生证就知道不对劲了。虽然那上面母亲一栏写的是假名，可他还能不知道兄弟的假名吗？！

      　　仇是寻不了了，气却咽不下去。气不过的秋哥带着几个新任的手下，提溜着还没睡醒的Tiger哥就冲进了城寨。此事不好声张，故而他也没打算闹太大动静，只是“啪”一下把那张出生证明拍在龙卷风面前，要他无论如何也得给自己一个解释。

      　　龙卷风不是不愿给他解释，只是还在斟酌怎么说。谁曾想，还未等他开口，一声干呕反而首先冒了出来。

      　　狄秋：？

      　　然后那个罪魁祸首陈洛军就蹿了出来，也不知是从哪个角落！搂着龙卷风就问“龙哥你怎么了？”“龙哥你是不是不舒服？”。

      　　他那个紧张的样子怎么看怎么诡异，不像是紧张大佬，更不像是紧张阿妈。狄秋瞄了一眼出生证上龙卷风名字所在的位置，又看见陈洛军那个偷偷在摸大佬手的爪子，哪还有什么不明白？他越看越觉得这个光头仔十分不顺眼，抬手便将其揍了一顿。

      　　不过没下死手。龙卷风不拦他，光头仔也乖乖地不反抗，狄秋揍了两下觉得没意思，于是收手，一言不发地扯着还是没睡醒而且一头雾水的Tiger哥走了。

      　　走前还撂了一句：“你现在什么情况自己清楚。把烟戒了，好自为之。”

      　　本来想让仇人断子绝孙，结果仇人的儿子也是兄弟生的，孙子也是兄弟生的。也不知道龙卷风到底看上那个光头仔什么了，长得跟个黑皮土豆一样，一把年纪了还要给他生孩子，都不知道他打算怎么生！

      　　真是糟心。
