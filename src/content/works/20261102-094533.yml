      　　陈洛军在看风。

      　　深圳河的沿岸有一片空地，原本是耕田的地方，只有几栋零星的村屋。近日被批给了地产商，说要起一座高楼。于是脚手架与塔吊架起来，爬上去，便可以俯瞰深圳河，将河的这岸，与河的对岸，一并收入眼中。

      　　前几日的时候陈洛军接了这建楼的活。信一说，现在房地产好做啦，你来帮下手吧。陈洛军说好，于是便暂且放下飞发铺的生意，跑来这里做监工。

      　　坐在脚手架上的时候，便可以看到云。傍晚的夕阳漂流在望不到尽头的深圳河，将整条河都染成彤红的。在这条河的河岸上，卷着芦苇的，是一阵慢悠悠的风。它从芦苇丛中吹起，穿过两岸的棕榈树，夹一两丝晚霞，就这样飘到陈洛军手中的风筝线上。

      　　风筝是一个金鱼风筝，浅黄色的，又有绿色的鱼尾，是信一的女儿火火的。因她说想看风筝，却总放不高，这才想要洛军帮她找一个好高好高的地方放起来。

      　　洛军自然不会不答应。他爬上脚手架，乘着风，把风筝放出去。风筝悠悠地飘，回忆也悠悠地飘，直把高楼并脚手架拖下去，又拔着城寨从地里长出来，与十五年前龙卷风手里的那只风筝缠到一起，带他回了家。

      　　陈洛军昨夜又梦到了龙卷风。

      　　陈洛军总是在梦见龙卷风。

      　　过去的这十几年里，龙卷风时不时就会到他梦里来。初起的那两年，是无数次的盂兰盆节。在那些梦里，陈洛军用尽了他所能想到的一切方法，都还是改不了结局。再后来是无数次的城寨的岁月。陈洛军在城寨中生活不过三个月，却好似生活了三十年。他梦到他去到那间飞发铺，躺到那张理发凳上。龙卷风拿着他的瓶瓶罐罐，往他两颊轻轻地涂剃须膏。

      　　陈洛军被涂得昏昏欲睡，却还是撑着想要多看龙卷风两眼。龙卷风的手在他下巴上捻两下，轻轻啧了一声：“怎么长这么快。”他的脸于是便彤红起来，期期艾艾地伸手捉住龙卷风的袖口，望着龙卷风看。

      　　龙卷风被他那小狗似的眼神一望，便忍不住叹气。他摸一摸陈洛军胸口铺着的那块方巾，沉着声慢慢地哄他：“好啦，好啦，帮你剃须。”

      　　这些梦的结尾大多都以陈洛军撑不住，在龙卷风剃须时轻哄的言语中睡去而告终。但等到下一次，龙卷风还是会来到他的梦。

      　　要将龙卷风记在心里很容易，但要认识到他对龙卷风怀揣着怎样的感情却很难。城寨拆掉的那年，他们四个坐在一起打麻将，打着打着，就又说起了以后要做什么。

      　　上次他们说这个的时候城寨还在，龙卷风也还在。信一说他要搞个卡啦OK。“现在搞不了啦，”信一说，“我大佬不在了，龙城帮还在，我得帮他看住它。”

      　　四仔低头看牌，只说他还是要去找女朋友的下落。十二见不得他们一个二个这么丧气，一拍牌桌：“哎！不就是卡啦OK，你等着，我开个夜总会，把你的卡啦OK也放进去。”

      　　信一猛薅他的头：“扑街啊你，谁家夜总会里开卡啦OK！”

      　　他们闹完，又转头来问陈洛军。信一问：“光头仔，你有什么打算？”

      　　陈洛军没有想过这个问题。他到了城寨，就没想过还要离开。陈洛军抓着手里的牌，不知放，也不知不放。他想了很久，最后他说：“我想开个飞发铺。”

      　　“洛军……”

      　　他听到信一欲言又止的声音。但他抬起头，又重复了一遍方才的答案。

      　　“我想开个飞发铺。就像龙哥那样。”

      　　那晚他又梦到了龙卷风。梦里的龙卷风看着他，有些许无奈。

      　　“傻仔，”他听到龙卷风说，“城寨要拆了，你还呆在这做什么呢？”

      　　陈洛军固执地望着他的眼睛，像一只冥顽不灵的犬。

      　　“你答应让我留下的。”他说，“你答应不赶我走的。”

      　　龙卷风叹了一声，又劝：“你总要往前走。”

      　　陈洛军却说：“我不往前走。”
      　　
      　　往前走，是三个陈洛军不能理解的字。陈洛军在流离与颠沛中长大，前路本就不在他的本能当中。他来到城寨，龙卷风给他一碗饭食，他就留在龙卷风身边。前路没有龙卷风，他不要去前路。

      　　但其他人会去前路。城寨完全拆除的那一年，信一结了婚。他是他们四个里第一个结婚的人。喝喜酒那天十二开玩笑说他是英年早婚，信一翻他白眼，说你懂什么，这叫人生四喜之一，小孩不懂打电动去啦。

      　　他笑完，又渐渐沉默下来。他说，其实我倒希望我大佬还在这。拜高堂的时候，上面本来应该有他的。

      　　龙卷风。这几年他们鲜少提起龙卷风。那个名字在他们心里，却不易宣之于口。宴会上高朋满座，鼎沸的祝酒声此起彼伏。他们静默着坐了一会儿，最终四仔打破了沉默。

      　　他说今天是信一的好日子，我们四个喝一杯。

      　　“喝一杯！”

      　　“喝！……喂喂你不准赖账啊怎么还有喝一半的！”

      　　“这叫福根，给你喝了要不要啊？”

      　　“死开啦你。”

      　　他们笑，陈洛军也在旁边一起笑。只是喝酒的时候他侧过脸去看那高堂的位置，座椅空着。他闭上眼，于是那里有了龙卷风。

      　　接着便是香港回归，接着便是千禧年。千禧年前夕的时候四仔告诉他们他找到女友的下落了，明日便要动身去日本。

      　　他们为四仔送行。十二跟他关系好，显得尤其依依不舍。他捏着四仔的胳膊，像个头一回离开兄长的小孩似的，跟他交代：“你可一定要带着阿嫂平安回来啊。”

      　　四仔被他捏得胳膊都快淤青，他说你放开先啦，小屁孩，你还是先担心担心你追不追得回女友吧。

      　　被戳了痛脚的十二悻悻地松开手，嘟嘟囔囔。“你催洛军啦，”他抗议，“他比我年纪大，怎么也应该是他先担心。”

      　　他这么一说，他们倒都想起洛军这些年都还是光棍一条。英年早婚还刚刚有了女儿的信一用胳膊肘戳腾他两下：“喂，光头仔，要不要给你介绍啊？”

      　　陈洛军完全没明白话题怎么就到了他身上。他愣了两秒，憨厚地笑了。他说随缘啦，我都还没想过。

      　　他确实没有。飞发铺的门开开合合，来理发的客人去去留留，时间如流水般地走。陈洛军对要找到另一个人同他共度一生这件事没什么执念，但偶尔想起的时候，他只希望那是龙卷风。

      　　是从什么时候开始的呢？陈洛军不知道。只是这十几年，他的梦里总有一阵风，牵引他，托起他，就像盂兰盆节那天他从楼上摔下去，它将他托起一样。

      　　于是风牵着他走，终于来到了今日。

      　　前一天晚上陈洛军睡得很早。他打扫完飞发铺的卫生，站在厅里看了会电视，便熄了灯去睡觉。

      　　飞发铺的门前留有一盏灯，是给夜里走路的人行方便用的。从前龙卷风也是如此，他从不熄一楼的灯。也因为这样，当年陈洛军从房顶摔下来，才能寻到他的那一扇窗。

      　　店内的陈设依旧是从前的模样，仿佛是太湖楼里完完整整搬过来的一样，连一块砖也没有少。陈洛军爬上二楼，躺在床上。卧室的灯熄下去，月亮爬上来。他睁开眼，便又见到了龙卷风。

      　　龙卷风仍是十几年前的模样。穿着一身青灰色的衣裳，坐在他床尾的圈椅上，静静地望着他。陈洛军坐起来看他，想要去拉他的手，又怕他走了。他抱着被子，鼻头酸涩，却还是忍不住笑。

      　　他说龙哥，你又回来看我了呀。

      　　他和龙卷风说了好多。他说信一有女儿啦，四仔打听到女朋友的下落啦，十二搞了个小生意，现在也做得红红火火啦。龙卷风只是听，听他一连串地、竹筒倒豆地讲他不在的、他们单独度过的这十几年时光。

      　　陈洛军讲了每一个人，事无巨细，啰啰嗦嗦，却唯独没讲他自己。他不是不想说，他只是不知道怎么说。该如何去说呢，陈洛军不懂得。

      　　可龙卷风懂得。

      　　他听到龙卷风问他：“那你呢？”陈洛军憨厚地笑。

      　　“我也挺好的，”他挠挠头，有些不好意思地说，“我现在会剃须了，可以看住这个铺面。”

      　　漫天的晚霞中，他听到火火和她的小伙伴在欢呼。“风筝！风筝！风筝飞起来啦！”于是陈洛军又说，“我还会放风筝啦。”

      　　“周围的小朋友都钟意找我帮他们放风筝。”
