title: 见风
cp:
  - 洛风
updated: 2026-11-02
summary: 盂兰盆节之后的两年，陈洛军又见到了龙卷风
series: 风
seriesOrder: 1
status: finished
chapters:
  - body: |-
      城寨又下过一场雨。陈洛军立在红色大花笼边上，抬头望了一眼街道。湿漉漉的，几片垃圾扔在水洼里，不扫掉踩进去又是一脚泥。

      今天是除夕，四仔他们约了他搓麻将，再一起包锅饺子。他没有去，只是呆在这间早没了人的飞发铺，拿着笤帚簸箕自顾自地打扫卫生。

      此时距离盂兰盆节已过去两年，城寨拆了有一小半，居民也陆续搬出。原本拥挤的街坊一下子冷清不少，连这间曾经顾客来来往往的飞发铺也一并荒废掉了。红色大花笼上生了不少铁锈，也许是接连的阴雨天的缘故。陈洛军伸手碰了碰它，心想回头要给它除除锈了。

      飞发铺里有个年久失修的电视机，这会儿被久违地按了开关，一顿一卡地播放着什么。从前龙卷风在这儿的时候总说这电视机破烂，好花屏，好卡顿，却一直没丢掉它。每次出了问题便只见他拿手拍拍，一拍就好。

      那时陈洛军就爱往他这里钻，龙卷风也不赶他。见他胡子又野草似的长出一茬，便招呼他躺下剃须。陈洛军喜欢他剃须，龙卷风的手干燥又温暖，像安抚小狗一样轻轻在他胸口的垫巾上拍拍摸摸两下，陈洛军便就着电视机的声音睡着了。

      龙卷风。他又在想龙卷风了。陈洛军抿了抿嘴，打断了回忆。地还未扫完，尚不到伤感的时候。这样一想，他也就低下头，抓着笤帚，继续扫那块翘了个角的方砖地。

      电视上在讲城寨拆迁的补偿问题，嗡嗡的，陈洛军没有仔细听。要是信一在这儿，他肯定嚷着要换台，“除夕不看晚会有咩意思啦！”但信一不在这儿，陈洛军眨眨眼，扭头看了眼电视，里面的图案没进脑子，却听到了一声轻得不能再轻的叹息：“傻仔，不去过节，一个人呆在这儿做什么。”

      陈洛军猛地抬头。龙卷风站在那里，卸了眼镜，搁在手边的理发桌上，声音有些无奈。见陈洛军怔怔地看着他，他又叹了一声：“地扫得咁干净，怎么不知要收拾自己。后生仔要贪靓呀，来。”

      陈洛军愣在原地。那是活生生的龙卷风。时间倒了带，仿佛又回到了龙卷风第一次给他剃须的那天晚上。他冒冒失失地闯进红色大花笼，说他不要走，说他要跟他。那时龙卷风说了什么来着？

      “来，给你剃须。”

      眼前这个龙卷风同那天的龙卷风重合了，陈洛军下意识往前走了一步，他又突然变成了铁门后面的那个龙卷风，用身体作锁，锁住了门里的王九，也锁住了陈洛军的一生。

      “留住自己的命，走下去。”他说。陈洛军听到了，可他没有在想如何走下去。他只是在想，那些刀落在龙卷风身上，他该多疼啊。

      几息之间，陈洛军走完了他一辈子要走的路，他来到了龙卷风的面前。他不敢用力般捉住龙卷风的手腕，他说：“龍哥……”

      后生仔眼圈红了，龙卷风摸摸他的头，没挣开他的手。于是陈洛军攥得更紧。他胸膛剧烈起伏，眼前都起雾。龙卷风又叹：“傻仔，哭什么？”

      陈洛军鼻子酸涩，嘴唇颤了颤，试探着抬起手臂，抱住了年长者。他像是怕龙卷风会厌弃这个拥抱，并不敢用力，只虚虚地搂着他的腰。过了一会儿，见他默许，终于放心将脑袋埋到了年长者的颈窝，失声痛哭。

      他有好多话想对龙卷风说，但他一句话也说不出。他的嗓子哑得不像话，像废弃的录音带，快要崩断一样。大滴的泪水狼狈地从他脸侧滚下，任何语言都失去了意义。他只是紧紧抱着龙卷风，重复那两个唯二还未变得苍白的字，“龍哥……”

      龙卷风又在拍拍他了。陈洛军意识到。他从前也这么做过，这是他哄他的方式。陈洛军有些傻地抬头看他，脸上的泪被人用指腹轻轻抹去了。他的后背被一只温暖的手托住，像一阵温柔的风。陈洛军喉咙发堵，他说龍哥，你是不是好痛。

      这话说得没头没尾，但龙卷风听懂了。他没有回答，只是轻轻拍着怀里的后生仔，说那不是你的错。

      那不是你的错。四仔也这样说过。盂兰盆节之后，城寨开始重建，他们四个又开始忙忙碌碌，一切都在向前走，除了陈洛军。他变得日益沉默，像个行尸走肉，活着，但没有生活。那时四仔就对他说过这句话，他说洛仔，你要想开点，不要折磨自己，大佬也不想看见你这样。

      陈洛军低下头，沉默半晌，说我没有。

      他确实没有。那种情感太复杂，没有人教他，他不懂得。

      陈洛军没有折磨自己。他只是非常执拗地，留在了那里。

      龙卷风的怀抱很暖和，陈洛军意识到。岭南终日潮湿，龙卷风的衣服却总是干燥又软和。他的脸蹭在龙卷风的衣领上，一枚圆纽扣凉凉地贴着他。陈洛军听到自己说：“大佬，我好想你。”

      龙卷风轻轻笑了。他薅了薅光头仔茸茸的寸头，说我一直都在这里。

      陈洛军仰起头，仔仔细细注视着年迈的大佬，像是要将他的样子一寸一寸都刻进心里。龙卷风的目光好温柔，仿佛陈洛军不是什么流浪的、脏兮兮的小狗，而是他的珍宝一样。陈洛军从未被这样注视过，他的鼻子又酸起来。他轻轻拉住龙卷风的衣袖，朝圣一般，哽咽着祈求。他说：“龍哥，我不想你走。”

      龙卷风又笑。“不走。”他蜷起手指，有些顽皮地刮后生仔颊侧的胡茬，像在逗小狗，“不是说了要给你剃须吗，邋遢的，以后怎么同人拍拖。”

      陈洛军被他说得难得脸烫，他低下头，跟在龙卷风后面，亦步亦趋走到剃须的躺椅边上。可就在坐下之前，他不知从哪里生出了一阵勇气，握住大佬的手臂，将一个吻落在了大佬唇上。

      陈洛军终于吻到了那两片薄薄的唇。也是在这时，他才明白曾经压在心里的那些，他想要告诉龙卷风，却没能告诉龙卷风的那些情感是什么。他笨拙地、生疏地吮吸着那片唇，似乎只要这样，他就能讨回那些他们本应有的，却再不能有的，再多一点点时光。

      他听见龙卷风在叹息。天注定，龙卷风说。陈洛军不懂，但并不要紧，对陈洛军来说，要紧的只有他怀里的这个人，要紧的只有他还在龙卷风身边，要紧的只有，龙卷风，也轻轻吻着他。

      陈洛军的前三十年，漂泊不定，颠沛流离。终于在第三十一年，他从城寨的屋檐跌下，遇见了龙卷风。

      真好啊。陈洛军想。如果这是一场梦，那他永远都不要醒来了。

      窗外的雨仍然在下，雨滴顺着红色大花笼的铁栅栏流进地里。在这场除夕的雨里，在龙卷风的身旁，陈洛军沉沉睡去。就像以往的任何一次剃须，他总能在龙卷风身侧安枕无忧。

      直到第二天清晨，十二少推开飞发铺嘎吱作响的铁门，陈洛军才被门的声响惊醒。他坐起来，身旁没有龙卷风。

      十二手里拎了一笼烧麦，看他睡在飞发铺的躺椅上，奇道：“昨晚叫你同我们守岁你不来，倒睡在这里。中意除夕剃须啊？”

      陈洛军愣了愣，不知道说什么，便没应声。十二自觉说错了话，赶紧岔过话茬，把烧麦往桌上一搁：“快趁热吃吧。信一说今天还有事要做，让我们吃完去找他。”

      陈洛军应了一声，低头快速地吃起来。只是吃时他突然想，他也并不是中意剃须。

      他是中意龙卷风。
