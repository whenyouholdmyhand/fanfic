title: 庭前梅
cp:
  - 主情
updated: 2024-11-02
summary: “年年雪里，常插梅花醉。挼尽梅花无好意，赢得满衣清泪。”
status: finished
chapters:
  - title: 郎骑竹马来
    body: |-
      他们都说无情生病了。

      他们，指神侯府所有的师兄，包括师叔在内，连带着金剑银剑，甚至扫地的仆侍都这么说。他们说无情病得很重，需要静养。可他们不许你见他。

      你不懂为什么不许你见，难不成月牙儿是染上什么时疫了不成？可除了你，谁也没被拦着见他，今日早晨你还亲眼见着追命师兄叹着气从月牙儿房里出来呢。追命师兄活蹦乱跳的，一看就不像有被传染时疫的样子。而且你后来去找他的时候他也没让你躲开，只是对你的问题三缄其口，一问就是不知道，然后打个哈哈闷着头喝酒。

      追命师兄不愧是四大名捕之一，你怎么问也问不出来，还白瞎一坛前几日带回来的桃花雪——说白瞎也不太准确，毕竟本来你也是给追命师兄带的。可没问出来月牙儿究竟出了什么事，你还是不太高兴。

      所以你去找了铁手师兄。但铁手师兄也不回答你，他摸了摸你的头，仍是叹气。可见你一副不问出来就不罢休的模样，犹豫了半天又补了一句，说不让你见大师兄，是大师兄自己的意思。

      你不甘心，然而不甘心也没用。冷血师兄除却最开始回来探望过一次无情之外，从得知大师兄不肯见小师弟这个消息开始就没回过神侯府，不知道跑到哪里查案去了。所以你自然也从他那里得不到什么答案。金剑银剑两个小家伙像防贼一样防着你，把着门口一刻不离。但没关系，你是谁啊？你行走江湖这么些年，还没报过信啊不是溜过门撬过锁吗？大门进不去？没关系，你可以翻窗。

      今晚就翻。

      是夜，你避开金剑银剑的视线，绕到小楼后面去偷偷撬窗。无情的屋子在院子的东南侧，略微靠后，外面接着一条长廊，廊下又开一小窗，一条鹅卵石路蜿蜒铺成，并几株芭蕉栽在路旁，正对着你居室的门。你做贼一般闪身到回廊下，用一根小棍抵住窗棱把它掀开。见没人注意到你，于是一缩脑袋翻了进去。

      但不巧的是，你甫一进去，三枚暗器凌空而来。你急忙闪开，在地上滚了一圈，又一枚银针紧跟落下。你一错身，那银针堪堪擦着你的脸插到了你身后的墙上。

      “月牙儿！”

      暗器停了。取而代之的是无情剧烈的咳嗽：“怎么……怎么是……”

      你这才看清屋内的情形。

      无情伤得的确很重。他躺在床上，只露出一张脸和半个肩膀。可即便如此，那对肩膀上也缠着重重绷带，血迹从绷带下渗出，一片暗红。屋内生着银碳，无情也被蚕丝被严严实实地裹着，身上还盖了一层厚厚的狐裘。然他的脸色依然苍白，眼下一片乌青，两颊凹陷下去，全然不复你与他分别之时的风采。

      他忧心你被暗器所伤，急急忙忙便要下床。可他哪里下得来，一撑起身子便又开始咳嗽。狐裘从他身上滑下来，露出他消瘦的肩膀。你急忙迎上去，捞起狐裘，将人重新裹了起来：“别担心，我没事。那暗器没伤到我。”

      但饶是你再三保证，无情仍细细看了你一遍。他以拳抵唇，将那阵咳意压了回去，才皱着眉责备地看了你一眼：“怎么好好的，不走门，偏要翻窗？”

      他刚刚差点就要伤到你了。若不是他自觉你的脚步声有些熟悉下手犹豫了点，你又熟谙他发暗器的路数，再加上他身上有伤难免准头不如平日，你是决计躲不过去的。你知他后怕，便搂着他安抚地轻拍，又念及他多日对你避而不见，忍不住委屈地蹭了蹭他发顶：“金剑银剑不让我走门，说是你吩咐的。你不见我，难道不许我来见你吗？”

      无情这才想起来他并不想此时见你。他像是突然想到了什么，身体僵了僵，不说话了。你却不急着细问，只扶着他靠在床上，拖来两只抱枕垫在他腰后，掖了掖被子，起身帮他倒了杯热茶。

      “月牙儿，我此行去碧血营研学，足足半月才归。你想不想我？”你把茶塞进他手里，不忘避开他的伤口，重新坐回床上抱住了他。待他喝了几口，总算不再要咳不咳，你又问，“到底为什么不见我？”

      “想你。”他柔声道，却避开了第二个问题，“这两日昏昏沉沉，还未问过你回来多久了，累不累？”

      “不累，”你在他颊上亲了亲，疼惜地蹭了蹭他颧骨结痂的划伤，“就是想你，还想你做的冰糖糕。”他眼含笑意，许诺等伤好再做给你吃，你却不想放过他，又一次追问，“还没说你为什么不见我。”

      无情一向拿你撒娇没法，你一副非要刨根问底的模样，他便只好告诉你。可他不知该怎么说，张了张口，又什么都没说出来。只咬住下唇，不说话了。

      他拿你撒娇没法，你却也拿他这副被迫得说不出话的模样没法。见他咬唇，你到底舍不得，叹了口气，心疼地去摸他的嘴唇：“好了月牙儿，你不愿说，我不问了就是。我只是好想你，你不见我，我有些委屈。”

      无情摇头。他抬起手，摸了摸你的头：“也不是要瞒你，只是此事腌臜，我不想它污了你的耳朵。”

      你抬头看他，有些不解。他轻轻吸了口气，慢慢地解开了身上的寝衣。

      大片的淤青、粗暴情事后留下的印记在你眼前展现出来。你一时呆住，他却已然敛上衣襟，苦笑道：“便是这样。”

      “月、月牙儿……”你怔怔地唤他，仍未回神，却下意识伸手重新拉开了那片衣领，那被施虐的痕迹重新出现在你面前。

      无情的腰身很消瘦，太消瘦了。近日的折磨令他的身体更加虚弱。你心疼地触摸他凸出的肋骨，抚过上面那些触目惊心的淤痕。你将他的衣服系了回去，重新地，紧紧地抱住了他。

      “所以你见几位师兄也不肯见我，”你喃喃道，唇有些抖，“所以你说此事腌臜……你是不是觉得我会嫌弃你？可是月牙儿，我怎么会嫌弃你。我只会好心疼。”

      “其实你不必如此，”无情轻声说。他被你抱在怀里，你听到他平静的声音，“我毕竟不是女子，他们辱我，我却没什么名节可言。”

      “怎么会不必如此？”你大声反驳，双眼含泪，“难道就因为你是男子，你受到的伤害就可以被轻轻揭过？难道就因为你是男子，就……就不配被我心疼了吗？”

      无情没想把你弄哭，他叹了口气，又抬起手蹭了蹭你红得跟兔子似的眼眶：“多大的人了，还哭。”

      你搂着他，不说话。他停顿一下，又道：“我只是不想被当作女子对待。我是男儿，怎可……”

      他没说下去，但你听出了他未尽之言。你脸色倏忽几变，突然意识到了什么。“他们是不是还说你什么了？”你问，语气有些冷，“他们是不是——”

      无情闭上眼，静默着，终于点了点头。

      你猛然站起身：“我去把他们剐了。”

      无情笑了，他一笑，便如冬日的梅花一般，整个人温和起来：“犯人皆已伏法。倒是你，在捕快面前说要剐人。算不算人脏俱在？”

      你被他调侃，心头那股脾气顿时没了。只委屈巴巴看了他一眼，叫道：“月牙儿——”

      无情拉住你的手，捏了捏你的掌心。你重新窝回他身边，小声道：“月牙儿，你不要听那些人说的。”

      无情却又是笑笑：“倒也没什么。”他说，“他们说我是女人，我也不意外，毕竟我下边长得确实和女人一样。可他们说我是女人我就真的是了吗？你不必为此忧心。”

      “但他们说的就是不对。”你反握住他的手，郑重道，“就算你下边和我长得不一样，你也是我见过最优秀的男子。天底下，谁规定男人的身份就取决于那根东西了？那些庸人只会空口白话，他们长了那根东西又如何，还不是作奸犯科。”

      无情望着你笑。“好了，”他说，“瞧你气鼓鼓的。”
      他拉着你的手，指腹在你的手心蹭了两下。你知道，那是你们从小的秘密暗号，代表他懂你的心意，一切不必多言。“我还有点卷宗要批，你想陪我看会儿卷宗，还是睡一会儿？”

      “月牙儿你伤还没好怎么就急着看卷宗？”你搂着他蜷起来，有些不满。但你知道劝不住他，只好像小狗撒娇一样拱了拱他，“那你闭着眼睛休息一会儿，我读给你听。”

      无情自无不允。

      他被你抱在怀里，闭着眼听你读卷宗上的内容。偶尔蹙一蹙眉，或点评两句让你写上去。他乌黑的发铺在你胸前，身体贴着你的，将你怀里填得满满当当。你搂着他纤细的腰身，感受他在你怀中均匀而轻缓地呼吸，觉得哪怕只是这么抱着他便已经足够满足你在这尘世中大多的欲望。不由地，你的注意力从卷宗上飘走，又慢悠悠地黏着到他身上，连带着你下身那物，也开始心猿意马。

      于是你读卷宗的速度逐渐缓慢起来，下体却愈发火热。直到最终，你完全停了下来，而你的那件物什，也直挺挺地抵在了他腰上。

      无情睁开了眼，而你此时也憋得满脸通红：“月、月牙儿……”

      你有些懊恼自己怎么只是抱抱他便能硬，不禁在心里骂自己急色。又念及他此时身上有伤，更不敢同他行欢愉之事。他甫一睁眼，你便如惊弓之鸟一般从他身边跳开，亵裤却被顶得高高的。你忙伸手遮住那出，支支吾吾道：“我，我去冲冲凉水。”

      他本满含情意地望着你，目光如秋月一般柔和。听闻此言，忽然一滞，秋月便成了秋雨，冷清寂寥起来。

      “我之前洗过多次了……”他垂眸道，声音有些低，“要不，我给你用手打出来？”

      “什么用手？”你尚未反应过来，盯着他垂下头时露出的那一小截白皙的脖颈怔怔地问。无情却不再说话，只摇摇头，重新拿起了刚被你丢到一边的卷宗。直到一阵风吹进小楼的窗，窗外细密的雨打在芭蕉叶上，你忽然如梦初醒，“月牙儿你又在胡思乱想什么！”

      你再顾不上捂你那昂扬的话儿，一步并两步挤到他身边，直把你直挺挺的下体蹭在他身上让他瞧。

      “月牙儿你看，”你委屈巴巴道，“它都为你这么硬了，你怎么好编排它嫌你脏！”

      你那物生得本就粗黑，此时憋得狠了，还有些发紫。无情只瞧了一眼脸就红了，他伸手摸了摸你又硬又烫的阳物，指腹蹭了蹭它顶端的蘑菇头。

      “你……！”他红着耳尖低声斥你，“你就不怕这时别人进来看见你耍流氓。”

      “不怕，”你笑着亲了亲他的脸，又亲昵地吻了一下他的嘴唇，“有金剑银剑在门口，谁能进来？再说，我和老婆耍流氓，干他人何事。”

      言罢，你却不肯让他继续摸你那物。而是就势爬上床，干脆利落地把他的亵裤扒了个光：“原本是心疼月牙儿你身体不好，倒惹得你多心了。我倒要看看，你这处哪里脏。”

      无情双腿已废多年，常年不能站立，便生得比旁人更细一些。你此时要分开它们，他也使不上劲，只能任由你捉着双腿将其掰成一个M，露出腿中那个鼓囊囊，水嘟嘟的穴。

      无情的穴早就被你玩了个透。起初白嫩的小屄经过你长年累月的揉搓变得熟烂，像朵嫣红的肉花，都不用碰，只要被看两眼便会出水。此时你甫一掰开，那穴中央便张开了一条细细的缝，露出里面的两瓣小蝴蝶。亮晶晶的水顺着会阴流出来，在床上洇了一团湿痕。他见你直勾勾地盯着那看，又知道自己根本没被碰就已然出水，更是臊得不能自已。可他那双腿子偏偏有和无没甚区别，自然也不能及时合起，遮挡住里面那骚浪的屄。你却不管他如何怕羞，只盯着那肉花，喉结滚了滚，一伸头将其含进了嘴里。

      “唔……”你吮着那口熟妇屄，舌头卷了满口腥臊的水。那口屄被你舔得大开，艳红的穴肉一张一缩，挤了更多的水出来。

      “月牙儿这里明明很干净，”你把他的水吸了个干净，嘴唇湿漉漉地便去捉他的唇，“出的水也甜，一点都不脏。嗯，不信你尝尝。”

      “别……”
      无情被你舔得双股颤栗，下身却没劲可使。他似是想逃，却又逃不开你在他屄上又吻又吸的唇，只能抖着臀喘息，又不自觉抬着腰，像是要把自己的淫屄往你嘴里送。你被他抬屄的动作勾得心头作痒，忍不住想再欺负一下这口骚屄，便抬手一巴掌扇在那屄上，扇得它水光淋漓，抖了两下喷出一大股水。

      “不要……不要……”无情发出一声似哭似泣的呻吟，整个人反弓过去，屄抬得高高的，穴肉抽搐不已。你抬头看他，却见他已是翻着白眼，去了一次。你嘿声一笑，坏心地揪了揪他穴上的小豆，把它拉得细长：“月牙儿怎么就自己到了？”你假作埋怨，“我还硬得好痛，月牙儿要赔我。”

      “赔你……嗯……别揪……啊啊啊啊啊啊……”无情刚高潮不久，就被你揪了阴蒂，顿时又去了一回。那熟烂的肉花吹出一股水，随即又是一股，屄口大开，已是一副被玩熟玩透的模样。

      短短一会儿，他已被你玩去了两次。整个人如刚从水里捞出来一般湿漉漉的，双腿大张，奶头高挺，乳晕红了一片。他翻着白眼抽搐了一会儿才回过神来，意识到自己高潮的丑态，不由瞪了你一眼。你浑不在意，凑过去亲了亲他的眼皮，感受它在你的亲吻下轻颤。

      “月牙儿好漂亮，”你吻他的眼皮，轻轻道，“好喜欢月牙儿。”而后又挪下去咬住他因为情欲高高挺立的乳尖，“月牙儿，我好饿，你喂我吃奶好不好？”

      “嗯……”无情被你咬了乳头，穴里又开始出水，胸却忍不住挺起，把奶头往你嘴里送，“没……没有奶……”他喘息道。你却不管，只一味地又吸又咬，将有些凹陷的乳头整个儿舔出来：“我不信。月牙儿这里这么可爱敏感，怎么会没有奶。一定是月牙儿又诓我，不想给我吃奶。”

      “就知道说歪理……”他被你舔得喘息连连，另一只没被照顾到的奶头也情动地立了起来，轻轻颤着，“你轻点咬……”

      “哪里有说歪理，”你用脸颊蹭了蹭他小巧的乳峰，轻轻在乳晕上嘬了一下，“我最喜欢月牙儿，月牙儿也最喜欢我，喂我吃奶有什么不对。现在月牙儿不肯喂我，我委屈。”

      “……没有不喂你，”无情一向看不得你这幅委屈撒娇的模样，明知道你在胡搅蛮缠，他也舍不得不哄你，“现在没有奶，要是有，就只给你吃。”

      “那要什么时候才有奶？”你用脑袋拱他的手心，他从善如流地抬手摸摸你的头发。听你这么问，他耳尖一红，低声答你：“只有怀孕了，才会有。”

      你戳戳他下面湿漉漉的穴，分开两片软软的阴唇，将手指挤了进去。他垂眸，急促地喘息了一声，又问：“你不会是想……”

      “不是，”你笑着在他嘴上亲了一口，“我才舍不得。”

      他笑了笑，低头时却看见了自己翁张的小屄。无情下意识夹了一下那里，又被自己臊得有些羞耻。

      “你……你进来吧。”他低声道，“已经很湿了，不会痛……”

      “好。”你揉了揉那朵肉花，将它揉开，而后绕到无情身后，环着他的腰将他抱在你怀里，小孩把尿般分开他的腿，挺胯肏了进去。

      火热的物什一插进去便被夹紧，软嫩的穴肉紧紧包裹着它，似是再不肯放它出去。无情喘息着扭腰，无意识地磨蹭体内的肉棒。穴里那阵经久的痒意终于止住，却不够，需要更快更重的肏弄来彻底填饱它。

      “月牙儿好棒啊。”你咬着他的耳垂，一面用力顶弄，一面在他耳边说荤话逗他，“月牙儿里面也好舒服，月牙儿好会夹。月牙儿怎么出了这么多水，是不是很舒服呀？”

      “……胡言乱语。”他轻轻瞪了你一眼，穴却夹得更紧。你知他一向面皮薄，却在床上是喜欢听你这些话的，便伸手摸了摸他湿淋淋的花唇。

      “难道不是？”你亲了亲他，又重重顶弄一下。肉棒狠狠撞上他一贯的敏感点，他两眼上翻，花穴噗得喷出一大股水，“月牙儿这里都湿透了，还说不喜欢。”

      他不说话，只咬着唇克制地喘。你愈发喜欢他这幅身体骚浪却不肯放纵的模样，忍不住想将人欺负得更狠。你伸手捻住他一边乳粒，拉着它往外扯。那可怜的小东西本就充血挺立，被你一扯，更是大了一圈。无情的喘息立刻急促了一倍，他似是想说什么，却说不出来，只得鼓胀着双乳，奶头高翘，屄水吹了一滩。你肏得更重，肉棒狠狠碾过熟烂的穴肉，顶得小屄汁水乱喷。你爱惨了他这敏感得爱出水的身子，一边肏弄，一边在他颈边落下一串吻。

      “月牙儿……你喜不喜欢嘛，你喜不喜欢我嘛……”

      “喜欢你，”他下意识想这样回答，“最喜欢你。”

      可他说不出来。你顶得太过用力，每一下都狠狠撞在他最敏感的那处，以至于他开口的一瞬间便骤然发出一声又尖又长的呻吟。

      “啊啊……别顶……好胀……那里……”

      肉穴顿时绞紧，一大股淫水打在了你那物的蘑菇头上。你被他激得眼睛都红了，直直将人抱起来，一边顶一边走到铜镜前：“月牙儿看看镜子好不好？你看你多漂亮，我多喜欢你。月牙儿……好爱你，好爱你……”

      无情双目本已因情欲吊梢翻白，听见你让他看镜子，便无知无觉地睁眼瞥了一眼。可他目光一落在镜上，便看见镜里的自己像个被肏烂的小婊子一样，吐着舌头，挺着骚屄和奶子，花穴被肏得外翻却还在不自觉地收缩，像舍不得那根肉棒一样苦苦挽留。他理智上不堪自己这幅淫荡的样子，身体却更敏感，一对乳子翘得更高，屄口也开合得更剧烈，小屄抖了几下，便哗得一下潮喷了。

      “噫啊啊啊噫噫噫噫噫——”

      无情挺着腰，淫水全然喷到了镜上。接着他整个身子软了下去，跌在你怀里，屄却还在抽搐，淫水和尿水稀稀拉拉地滴在地上，晕开一片水渍。

      他竟是被你肏尿了。

      你把着他尿了一阵，阳物却还在他穴里顶弄。你破开他喷水的穴，一下下撞着深处那个更窄更紧的宫胞。等他再喷不出也尿不出什么，你顶着他的穴心，龟头卡在宫口里，将子宫射了个满满当当。

      “喜欢你。”你餍足地亲了亲他，又重复了一遍你不知说了多少次的情话。无情有气无力地横了你一眼，斥你下次不准再如此过分，你也笑嘻嘻地应了，抱紧了人前去沐浴。

      至于下次到底会不会过分？将无情放进浴桶里时你心虚地摸了摸鼻子。

      下次的事，还是下次再说吧。
  - title: 绕床弄青梅
    body: |-
      绕床弄青梅

      你曾在无情屋里见过一只平安扣。

      它已经碎掉了，你问过无情它的来历，他没告诉你，只说是旧物。其实你不知道，那是无情买给你们的孩子的。只是它没出生，他也未告诉过你，你自然不知道。

      那是很多年前了，在你还轻松快乐地住在三清山上，对自己的身世一无所知的时候。那只是很普通的一日，普通到你已经不记得那日中午你吃了师兄做的什么糕点，又缠着师姐给你泡了什么花茶。它就像任何一个你少年时轻快明亮的夏日，充满了蓝色的天空，和白色的鸟。

      不过你记得那株芭蕉。

      那是一株长在无情小楼窗外的芭蕉，自他搬进神侯府便栽在那里了。每次你从三清山上跑下来找无情玩都会路过它，奔跑带起的风卷着芭蕉叶在窗棱上刮出沙沙的响，无情只要一听便知道是你来了。

      这日午后，你又一次抱着一篓你在马行街上买到的雪元子，溜到神侯府的后院，打算把它们分享给无情吃。无情身体不好，师叔和神侯府其他几个师兄不太许他常吃这些生冷的吃食。但你知他喜欢这些，就时不时偷偷带一些给他。

      这个点月牙儿应该已经午睡结束了吧，你揣着食盒翻过院墙，抬头看了看天色。你寻旧走到无情窗下，挨着那株芭蕉，支起窗户往里面瞧。里面静悄悄的，没有点灯，看样子无情还未起，自然也没有在读卷宗。你稍稍放下心，打算推门进去找他。毕竟若是他已然开始办公，你就没法进去找他玩了。

      风掀起了门前竹帘的一角，芭蕉沙沙响着。你将手放在门上，正要推开，忽得听见里面传来一声似哭如泣的呻吟：“不要……”

      你的手一顿，以为是无情遭了歹人，立时一闪身推门而入，紧接着却又听见无情喘息道：“你别过来。”

      但你已迈入了房中，门嘎吱在你身后合上，屋子一下子又暗了下来。你眨眨眼，才看清房中并无其他人，只有无情倚在床上，被子被掀开一角，露出一条白净纤细的腿，面颊飞红，正抓着一个靠枕挡在下腹前：“你……都说了你先别进来。我还未起，你去外堂略坐坐，我很快就来。”

      “我还以为你有危险，才……”你傻愣愣地抱着那笼雪元子，小声辩解道。你与无情已经有小半年未见，少年时正逢身体抽条，无情又本就比你略大三岁，此时久别重逢，更显得他如出水芙蓉般，不似你还像个没长成的青瓜蛋子，稚气未脱。

      不过此刻你尚没有功夫顾着自惭形秽，你的全部注意力都被无情露在锦被外的那双腿勾住了。

      无情的腿很白、很修长，腿上无甚毛发。因身体残疾，他并不常将他的腿露在外面，总是穿着一身长长的袍子，用衣摆遮住它。你此前并不是没见过，幼年时你们也曾一起戏过水。可此时再见，却只觉得它漂亮极了，微微鼓起的腿肚圆润饱满，让你忍不住想伸手摸摸它。

      你这样想，也这样做了。你将雪元子搁在桌上，出于一种连你自己也很陌生的情绪，呆呆地走到了无情床边。你坐在床沿，却不知道该做什么，只本能地用手指贴了贴他的腿，感受柔软的皮肤印在你指腹上，留下一点冰凉的触感。然后突然梦如初醒般缩回了手，莫名地脸红起来：“月、月牙儿……”

      你不知道你在做什么，无情却猜到了几分。他长你三岁，本就是初识人事的时候。只是他身体不好，欲望也自然寡淡，并不像其他少年人一般精力旺盛。

      他也有些羞赧，你们虽在一处长大，如此亲近却是从没有过的。更何况，今日他不知是怎么了，下边总有些酥麻，水也流个不停。他本不想去管，奈何整整一个中午这股情欲都没法压下去，只得趁着午间小睡疏解一二。他甚少自渎，手法也生疏，只知道用手轻轻揉一揉腿间的那处幽密的小花，略微缓解一些痒意。

      只是他没想到，他才将手放在那里，你便一阵风似的跑进院来了。那株芭蕉沙沙作响时他便知道是你，可他的指尖还在那朵肉花里，沾了一手的水。他想将手抽出来，却不小心碰到了肉花顶端的小豆，惹得他身子一软，不由地呻吟了一声。而此时再想抽出来已来不及，只得在你推门进来前抓过一个抱枕挡在身前，以防你一进来便正对上他那口淫荡的穴，看见它汩汩地流水，浸湿了身下的床单。

      此时你挨他坐着，像个大火炉热气腾腾地烤在他身边。他那朵肉花愈发敏感，却不好当着你的面揉，只好推了推你，催促你快些去堂屋，好让他快些更衣。

      你却一时没动。你不懂他为何几次三番赶你去堂屋。从前你来找他，无情从来不会赶你走。你们从小一处长大，即便是睡觉，也常凑在一张塌上睡，更没有更衣需要回避这种事。你见他面色潮红，以为他是病了，便伸出手去探他的额头。“月牙儿，”你整个人靠在他怀里，指腹蹭了蹭他的眉眼，“你怎么一直赶我走……是不是又着了风发热不肯告诉我？”

      无情面色更红，他垂下眼，手却本能地抱住了你：“没有着风……你别靠得太近，好热。”

      “我给你带了雪元子。”你在他怀里舒服地拱了拱，脸颊蹭开了他的一点衣领，“才在马行街买的，冰冰凉凉，吃了就不热了。我可是翻墙才偷偷避过师叔带进来的，我拿来给你好不好？”

      其实你那点翻墙的小伎俩哪里瞒得过诸葛师叔和几位师兄。不过是他们知道无情到底也还是少年人，难免有时贪凉喜甜，你又一年半载才从三清山上下来一次，故而睁一只眼闭一只眼罢了。

      只是无情却无暇和你解释这些了。你时常同他亲近，所以不觉得有什么。可他此时幽穴作痒，胸前的两粒乳珠也敏感得挺立。被你一蹭，穴肉霎时绞紧，乳尖翘着将寝衣顶出一个小凸起，呜咽着便直直地去了。

      你没见过他这幅模样，以为他是被你哪里压得痛了，连忙抱着他翻了个身，让他靠在了你身上：“月牙儿！”

      这一翻身，他之前抱在身前的软枕便被移开了，其下两条修长的大腿与其间那口粉嫩嫩、湿漉漉的肉鲍顿时一览无余。那穴儿生得圆嘟嘟的，两片饱满的阴唇鼓着挤在一起，像个馒头。这口淫穴刚刚高潮了一回，蜜液仍在慢慢往出渗，流得整口屄都沾染了晶莹的水光，看起来漂亮得不像话。

      你傻傻地看着那口穴，眼睛都直了。你虽和无情一同长大，却未曾一起沐浴过。无情在你面前总是规规矩矩地穿着衣服，哪怕睡觉都会整端地穿好寝衣。这是你第一回瞧见他的身子，却也能意识到他这里长得和你并不一样。可尽管如此，你也不觉得奇怪，只觉得他好漂亮。你伸出手，轻轻戳了戳那条细缝，温热湿软的小屄立时吃下了你半个指节，穴肉紧紧吮吸讨好着指尖，像是生怕你把它抽出去一般。

      “月牙儿，”你惊奇地蜷起手指，“你这里……”

      无情被你戳弄得连腰都绷紧了。他面颊潮红，伸手捉住你的手腕，似是想将你的手拉开，却又舍不得，便只轻轻搭在上面，细声细气地斥你：“你，你不要再摸了……”

      “可是月牙儿，”你盯着那翁张的漂亮肉屄，小声惊叹，“你这里真的好漂亮。”

      你并不是哄他。那小屄生得又粉又嫩，两个阴唇鼓囊囊的，小山丘似的挤出一条缝。那小缝因情动小小地翁张着，中间全是淫水，又露出一点里面的穴肉，仿佛只要头凑近，便能嗅到肉花热乎乎的腥甜味儿，又骚又嫩，让人忍不住想要嘬一口。

      你拉开无情的两条腿，把它们折在他腰侧，更彻底地露出那口嫩穴。你凑得越发近了，鼻尖抵在蜜裂顶端的蒂珠上，屄肉湿漉漉地冒着水，腥臊的热气轻轻扑在你脸上。你本能地吞咽了一下，舌尖一卷，将满屄的淫水全然吮进了嘴里。

      “不可，啊……！”无情骤然发出一声短促的急喘。他脖颈后仰，眼睛红了一圈，死死咬着唇将呻吟咽了回去。他想夹紧双腿间那口淫穴，可那水屄却不如他愿，汩汩的淫水争先恐后地溢出来，喷在你嘴里，让你吞了个遍。

      无情没法。他拉不开你，又止不住自己下边儿流水，一双腿有和无也没甚分别，甚至不能自己合起腿遮住那口小屄。他又羞恼又难堪，终于忍不住抽噎一声，轻轻推了一下你的脑袋：“那里很脏，不……不可舔那里的。”

      你听他有了哭腔，立刻止住动作，抬头看他，嘴唇湿湿的。他眼睛轻颤，犹豫了一下，又道：“……还有，我不曾骗你，我不是女人。”

      你迷茫地眨了眨眼：“月牙儿你在说什么啊？我没觉得你是女人。”

      他眼圈还是红的。你又看了看那个还在冒水的小穴，心痒了痒，还是忍住了没去继续碰它。你凑近他，轻轻摸了摸他的眼眶：“月牙儿，我是不是弄得你难受了？我、我不是故意的，我只是有点好奇……”

      “倒不是难受。”无情安抚地拍了拍你的手，他已缓过了一点劲，想起刚刚被你舔得汁水四溢，脸色微红，“只是你不要再那样弄，那地方腌臜，而且……这种事是和心悦之人才能做的。”

      你伸出手指，搅了搅那水淋淋的肉花，两瓣小阴唇被你搅得向外翻开，水声咕叽作响：“唔？它很干净呀，我刚刚吃了也并不难吃。而且月牙儿，我就是很喜欢你啊。”

      无情像整个人都要烧起来了似的：“你……心悦不是普通的喜欢，心悦是那种，”他停顿了一下，似乎是想找一个合适的方式跟你解释，“是那种看到他就会想要亲一亲、抱一抱他，想一直和他在一起的喜欢。就像，就像桃溪村里我们见过的那对仙鹤一样。”

      你挪了挪，坐到他身边，双手环住他的腰埋在他胸口蹭了蹭。

      “第一，我喜欢月牙儿，这是做不得伪的。”你歪着脑袋想了想，掰着指头开始数，“第二，我喜欢和月牙儿抱抱，嗯，还喜欢像这样和月牙儿搂在一起睡觉；第三，我也想和月牙儿一直在一起，只要和月牙儿一起呆着，我就很开心了。这算是心悦吗？”

      “不过，”你挠了挠头，又道，“就是亲亲我没有试过，不知道是什么样。月牙儿可以让我亲一下试试吗？”

      无情垂下眼，轻轻地呼吸：“那你亲吧。”

      你捉住无情的手，一点一点吻他的指尖。无情的手修长纤细，骨节分明。你知他于暗器一道行云流水，这双手更是一花一叶皆可做暗器。无情手指轻颤，微闭上眼，你便牵着他的手往他怀里靠，然后慢慢地亲了亲他的眼睛。

      “这样可以吗？”你小声问他。无情点头，你的吻便又落在了他颧骨上。

      “月牙儿好漂亮。”你亲亲他眼下一颗几不可见的小痣，抱着他撒娇，“我一直都好想同月牙儿亲近。可我们小半年才能见到一次，好想月牙儿，特别特别想。”

      无情莞尔。他捏捏你的掌心，轻声应道：“我也很想你。”

      最终你来到他的嘴唇。你伸手摸了摸那两片薄薄的唇，无情亲吻你的指尖。你知道他这是应允你亲吻这处了，于是你收回手，轻柔地、却坚定地将自己的嘴唇印在了他的嘴唇上。

      你并没有亲吻过任何人，所以也不懂怎样接吻。你只是凭着本能，不得章法地在无情的唇上舔来舔去。你用舌尖顶开两片柔软的唇，缓缓地吮吸它们，将它们搞得湿漉漉的。牙齿时不时磕碰到无情，你怕他痛，便又舔舔那里，像只小狗，笨拙又讨好。

      你在无情怀里拱来拱去，他便搂着你，以防你把自己和他一块儿拱到床底下去。你扶着他的肩，跪坐在他两腿之间，按着他的唇亲了好一会儿，直到两片唇瓣都被你吮得发红才从上面离开。无情有些喘息，你偏过头，脸颊蹭了蹭他的脸颊，叫道：“月牙儿。”

      无情摸摸你的头：“做什么？”

      “我知道了月牙儿。”你又亲了亲他的唇，认真答道，“我知道我心悦你了。”

      无情脸有些热，眼圈也是。你摸了摸他的眼尾，又问：“那月牙儿呢？月牙儿心不心悦我？”

      而他只是分开了腿，露出腿心那口湿漉漉的穴，拉着你的手放在了上面，轻声道：“你好奇这处是不是？……你摸摸它吧。”

      你笑起来，亲了亲他，从他怀里蹴溜下去拉起他的两条大腿，将脸埋在了他肉屄前。那穴仍湿着，两片肥厚的阴唇并在一起，却没有并严，仍裂着一条细细的缝。你探头过去，鼻尖贴在蒂珠上嗅了嗅，骚甜的肉逼味扑了你一脸。你伸出舌头，顺着屄缝往上舔，将那小屄舔得汁水四溢，勾了满舌的屄水儿。

      “月牙儿平日午休都是整整齐齐穿着寝衣的，今日怎么没有穿亵裤？”你舔咬着肉唇一侧的小阴唇，有些好奇地问他，“我刚刚进来时见月牙儿一直捂着这里，是因为这里不舒服吗？”

      无情没想到你会突然想起问这个，耳根腾一下红了。他咬咬唇，纠结了半天也不知该怎么向你解释他今日那些孟浪的举动，自暴自弃地催促道：“你，你别问了，不是要吃这里吗，你专心吃呀。”

      你却没懂他的羞耻，仍呜呜地抱着那口屄舔吃。那屄里的水仿佛怎么吃都吃不干一样，你卷走一口，它便冒出来更多。粘稠的屄水糊了你满鼻满脸，你却乐此不疲，咕咚咽下去一口，又将整个脸都埋入那口肉蚌，鼻尖顶着蕊心，混着腥臊的屄味上下磨蹭，又吮又咬。

      “月牙儿这里好甜好香，好想一直吃下去。”你抓着他两瓣圆润的臀肉吃他的逼，含混不清地夸道，“月牙儿，所以你今天其实是这里难受，想要摸摸它，才不穿亵裤，还不让我进房间来的吗？那现在我舔一舔它，月牙儿是不是就不难受了？”

      无情羞得面颊飞红，却避不过你的话茬，只好拍拍你的脑袋，斥你怎么今日这么多话，不许你再说下去。你嗷了一声，想到无情刚刚承认了他心悦你，又傻乎乎地高兴起来。你亲了亲那个被你舔得充血挺立的蒂珠，在它上面嘬了一口：“那以后月牙儿这里难受就来找我好不好？好不好嘛月牙儿？”

      “怎么刚开荤就如此急色……”无情悄悄嘀咕。你还要再问什么是急色，便被无情捉着后颈用嘴巴堵住了嘴。

      无情嘴唇很软，亲起来很舒服。你吮着他的唇齿，舌尖勾着他的舌头，整个人挂在他身上，亲得有些晕乎。不过饶是如此，你仍没有忘记要答应给他揉揉的事。你一手托住他的背垫在他与床架之间，一手探下去拨玩那只花穴，中指顺着花缝挤进去，翻开两只湿漉肥厚的肉唇，浅浅地勾弄起来。

      “月牙儿，我这样揉可以吗？”你分出两指夹住那颗阴蒂，将它拉长了些，手掌贴着滑溜水润的肉屄慢慢刮蹭。那肉屄被你玩了一阵，再不见初时青涩白嫩的模样，反倒像是生育过的妇人的逼，敞着逼口，一股一股往外吐水，熟烂得勾人。

      无情下边儿一阵酥麻，胸口原本只发育了一点的小奶包也鼓了起来，奶尖直挺挺立着，乳晕涨得微红。他下意识挺腰，抬着逼就想往你手上送，好让那根手指插得再深些，可你不得要领，只在屄口来来回回地磨，蹭得他淫水顺着会阴流了一片，穴心却依旧空虚不已，只想要个什么东西好好插上一插才能止痒。

      “你别只在外面揉，”他喘息着开口，声音有些喑哑，“也……也摸摸里边呀。”

      他捉住你的指尖，划过阴蒂和两片小阴唇，慢慢往后摸索寻觅那个软烂的小口。那屄被玩得水润湿滑，他只微微往里一送，你的半个指尖便被吃了进去。你头一次知道还有如此幽深销魂之处，不禁更为好奇地往里探了探，不料手指甫一进去，便被湿热的肉屄绞紧，穴肉热情得像个小吸盘似的吮着你的手指，不多时便有淫汁顺着指节流出来，沾了你一掌的水。

      无情此时屄里痒得像有蛊虫在爬，整个人香汗淋漓，喘息连连，像刚从水里捞出来似的，连眼睛都是湿的。你的手指终于解了一些他穴里的痒意，却仍不够，他咬着唇忍耐片刻，却实在受不住，只好又拉拉你的衣袖，软着声音教你弄他。

      “嗯……你……哈啊……就是这里，再、再快些，重一点插，可以多加几根手指，能……能吃下的……”

      你亲了亲他，依言又插进去两根手指，三指并成一股噗地一下挤入了那口淫洞。无情尖叫着抽噎了一声，却立刻咬住了唇不让自己发出更加令人不堪的声音。你顾不上安慰他，只一心按着他的小腹狠狠抽插，掌心严丝合缝地贴着肉逼狠磨，将整口屄插得湿红软烂，淫水飞溅。黏腻的水声啪啪作响，混杂着你二人的喘息，搅得本就燥热的空气愈发粘稠。

      “月牙儿……月牙儿……”你咬着他的锁骨连声唤他，恨不得把自己和他融到一块儿去。无情被你玩得两眼翻白，乳头高翘，屄里一股一股地喷水。听见你唤他，便勉强想要回神应你，可他除了呻吟什么也说不出来，又生怕他的淫叫被旁人听了去，便只好含着你的肩膀呜呜地哭，一副被玩得受不了的样子。

      他从懂事起便在隐瞒自己不同旁人的下体，此前即便有需求也只是用手揉一揉，哪里被这样亵玩过。可他现在却被你抱在怀里，一边喷水一边掉眼泪，觉得自己仿佛要坏掉了。

      “你……你是不是硬了呀？”他搂着你呜咽，脑子却还在担心旁的事。你不解地抬头看他，他犹豫了一下，才伸出手，摸了摸你早就鼓胀的下体，“我看话本上说，做这种事最后都是要插进来的，你要是想……想……那便进来吧。”

      你被他一摸，才惊觉自己早已硬了，下腹硕大的物什撑得亵裤满满当当，脸腾得一下红了个透：“月牙儿，我不是……我不知道它怎么突然……它，它以前不会这样的……”

      无情讶异：“你没……你从没泄过身……？”

      “从前、从前只会在早上，可……”

      你看看他，又看看自己的下体，觉得自己整个人都要烧起来了。你隐约知道自己触碰到了一种陌生的情绪，却不能冠之以名。你此前只觉得无情好漂亮，你好喜欢他，却并不知原来这种喜欢还会与此等反应勾连，像一团无名之火，一霎之间便能席卷地与天。

      你憋得满面通红，想说什么，却说不出来一字一句，最终嗷得一声抱住了他，像只惊慌的大鸵鸟一样把脑袋埋在了他颈边：“月牙儿，我不知道……我、我是不是得病了？”

      无情笑了起来。他摸摸你的头，伸手抚上你胯间的那个鼓包。他轻轻揉了它两下，然后解开你的亵裤，把它放了出来。

      “这不是得病了，只是正常的起了反应。”他握着你的昂扬蹭了两下，按了按顶上那个憋的紫红的蘑菇头，“我帮你打出来，还是你想……放进来？”

      你有些傻愣愣地盯着他看：“放进来？”

      无情垂下眼，拉着你的手放在了自己的小屄上：“便是放进这里。”

      你盯着那口正在吐水的穴，又看了看自己涨痛的性器，突然反应了过来：“月、月牙儿！”

      可紧接着，你又想起无情那句“这种事只和心悦之人做”，不禁又有些心痒痒。你挪到他身边，大着胆子用肉茎蹭了蹭小屄，小声道：“那月牙儿，放进去这种事，是不是也是和心上人才能做的呀？”

      无情“嗯”了一声，你眼睛瞬间亮了。你抱住他，笨拙地想把自己那物塞进那个湿漉漉的小洞。

      “我、我愿意的……”你期期艾艾道，“月牙儿，我不太会……你可不可以帮帮我呀？”

      他自然不会拒绝你，或者说，他从来都学不会要拒绝你。无情张开腿，小屄乖乖地敞在你面前。那屄已经湿了，他握着你的柱身，将龟头在屄口轻拍两下，在耻毛上沾染了些许淫汁。而后他抬起腰，就着那点淫水的润滑将龟头吃了进去。

      无情屄里又湿又热，肉茎甫一进去便被热情的穴肉绞紧，小吸盘一样吞咬着你的茎身，吸得你鼻子都酸了。你从未感受过如此灭顶的快感，只觉得浑身上下什么都不剩了，唯有埋在无情穴里的那一截血肉是真的。你按着他的大腿，本能地想要不顾一切地插得更深，却被紧致的穴肉缠得头皮发麻，再往里塞不进一点，只能不上不下地卡着，眼泪吧嗒吧嗒地掉，搂着他的脖子抽噎。

      “月牙儿，”你抽抽搭搭地抹眼泪，下边儿却还在较劲，“我好难受…它，它进不去……”

      你难受，无情却也没有好到哪里去。他亦是第一次行此事，也青涩得很。处子穴忽得入了这么个大东西，饶是此前已有淫汁润滑，无情也觉得自己下边儿快被撕裂了去。他出了一身冷汗，屄穴被撑得火辣辣地痛，却不能退，又听见你哭，只好咬着唇努力放松下体，搂着你轻轻哄：“不痛了不痛了……再忍一忍好不好？小屄很快……嗯啊……很快就松了，你摸摸阴蒂，摸摸它……哈啊……摸湿了就松了……”

      你依言去摸。无情的阴蒂并不难找，那颗骚豆豆已被玩得胀大，精精神神地坠在肉户顶端，被两片大阴唇一左一右地挤着。你伸出两指，像夹玉盘里的樱桃一样将它夹起来，手尖打着圈磨蹭，拉长又按扁，玩得它可怜兮兮的。渐渐的，你感到那口卡着自己的穴慢慢放松起来，淫水争先恐后地涌，顺着耻毛，滴滴答答沾了你一手。

      你终于整根插了进去。无情的小屄湿热紧致，软烂不堪，像有一千张小嘴在吸着你，又像是熊熊烈火在烤着你。你每一下顶弄都顶得极深，挤得穴里的淫水咕叽作响。无情的阴户抵着你的囊袋，粘稠的淫水混着汗水打湿了你们胯间的耻毛，让它们湿漉漉地缠在一起。你抱紧了他，让他整个人贴在你胸前，将他一双微鼓的乳子压得扁扁的，呼吸重重地落在他耳边。无情早已喘息不止，你侧过头，凌乱地捕捉他的唇齿，将他的呼吸也掠夺到你口中。然后你托着他的腰，将他整个人扣在了床板上，更用力、更深地肏进了他肉穴深处的那口宫胞。

      “噫啊啊啊啊噫噫噫噫噫噫噫——”

      无情翻着白眼尖叫起来，你却爽得不能自已。肉茎碾着处子穴内的每一处褶皱肏进去，龟头噗得一下顶开了吸嘴儿一样的二道门。你不知道那是什么地方，却觉得那里比外边那截肉屄更湿、更热情。你重重地插着那处，听见无情的呻吟一声高过一声，音调愈叫愈高，屄穴也愈绞愈紧，餍足地捉着他的唇狼崽子似的又亲又咬。

      “月牙儿……月牙儿……”你一遍遍胡乱唤着他的名字，下体噗叉噗叉地往他屄里插，“真的好舒服啊月牙儿，好喜欢你……唔……你喜不喜欢我呀？一定是喜欢的吧……月牙儿，你喜欢我的吧？”

      可无情哪里还能回答你？他双股颤栗，乳头高翘，一对小奶子山包似的垂在身子两边，两眼微微闭着，已然翻得只剩眼白。再看那口淫屄，已不知喷了多少次，大股大股的淫水被肉柱堵在穴里，撑得小腹都鼓了起来。

      他在你肏入子宫的一瞬间便已高潮了，整个人像个被玩坏的破布娃娃，意识小舟似的沉浮在欲海里辨不清方向。他隐约听见你叫他，却不知你说的是什么，只能本能地发出“嗬”“嗬”的喘息给予你回应。可你知他的意思，正如他知你的心。你抱着他，像抱住稀世的珍宝一般——而他确实是。你伏在他身前，轻柔而缓慢地亲吻他的嘴唇，小声但虔诚地向他告白。

      “月牙儿，”你轻声道，“我喜欢你，好喜欢你。我再不可能像喜欢你这样喜欢上任何一个人了。”

      然后你再不忍耐，拥着他，松了精关，将全部的白浊留在了他身体里，悄悄对自己许愿你们再不分离。
  - title: 吾道
    body: |-
      吾道

      ......


      你忽的想起一桩事来。

      十三岁那年，你曾在生辰前给无情写过一封信。你那时与他不能常见，故而总是喜欢给他写许多信，再一趟一趟地送鸽子下山去。于是那一次，你又一次洋洋洒洒写了数十页信纸，最后犹犹豫豫纠纠结结还是在末尾恬不知耻地撒娇说你想要无情送的生辰礼物，还要是他亲手做的那种。

      无情自然不会拒绝。他很快便写信给你，会给你亲手做一个。你收到信后兴奋得一连三天睡不着，逢人便狗叫“月牙儿要送我他亲手做的礼物了！”，扰得三清山上下鸡犬不宁，连鹤见了你都想绕道走。

      只是最后无情却没有来。

      生辰那日，你在山门前生坐了一晚上，还是未能等到无情给你带来那件礼物。其实你已经收到许多礼物了，师姐送你的佩剑，师兄送你的棋盘。可你还是想要无情送的那份。你坐在迎客松下，困得脑袋一点一点，却还是要硬等。一直到天边翻了鱼肚白，才终于撑不住睡着，被赶来寻你的师兄抱了回去。

      那是无情第一次，也是唯一一次对你食言，而你至今不知为何。当年你为了这事同他闹脾气，也不理会他的道歉，半年后才肯再见他。可现下当你又想起这桩往事，忽然间，一个答案跳了出来。你有些颤栗，心怦怦直跳。你抓住无情的胳膊，脱口而出：“那一次，你来了，是不是？”

      无情闭上眼，顿了顿，终是点了头。

      你顿时明白了一些事，一个困扰你多年的巨大的迷题终于揭开了谜底。你再顾不上什么风度什么游刃有余，只不住问：“月牙儿，你来了，对不对？这把剑——你当初扔的那把剑，就是你那年要送给我的，对不对？你不是被事情绊住了，不然你之后也可以送我。为什么？月牙儿，为什么你没把它送给我？”

      为什么？无情被你圈在怀里，几乎说不出话。那是他压在心底多年的秘密，怎可就这样宣之于口。哪怕你们早已互通心意，哪怕他早便知道你爱他，可是，可是……

      他垂下眼，注视着你抓着他手腕的手，声音轻得像风。他说：“你已经有一把剑了。”


      「月牙儿，你看，我有佩剑了！」

      「这是……你生辰时，雪青送的那把？」

      「是呀，月牙儿，我握着这把剑是不是就很像话本里的大侠了？」

      「不错，和你，很是相配。」


      这便是答案了。

      你的眼眶红了。你忽的有些想笑，却又很想哭。你仿佛看见了十六岁的无情拖着残疾的双腿爬上三清山想要送给你他亲手铸的剑，却在出声喊住你前见到十三岁的你兴冲冲地扑进师姐怀里接过了另一把剑。他知他身子残疾，他知他是男子，他怕你不喜欢男子，他怕你已有喜欢的人。所以他没有告诉你他来了，所以他扔掉了他铸的剑。

      可他又将剑捡了回来。卢三爷劝他，弃剑又求剑，乃是执求。无情知道那是执求，可他只是爱一个人，执求又有什么错。

      十几年过去了，即使你们早已相知，可他仍未告诉过你他的惶恐。你抱住他，看着他同样微红的眼眶，心疼地吻他：“月牙儿，若是我十六岁那年没有闯进你的房间，你是不是一辈子都不会告诉我你爱我？”

      无情回应了你的吻。他倾过身，额头抵住了你的额头，却没有直接回答，只说：“我总会陪着你的。”

      他总会陪着你的。

      就像不论你爱不爱他，他都会爱你。

      因为，

      「那是我的道。」
