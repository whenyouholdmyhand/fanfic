title: 奶牛猫偷吃咪咪虾条
cp:
  - 曹陆
updated: 2026-11-01
summary: 陆志廉与肥猫
status: ongoing
chapters:
  - body: |-
      　　有位智者曾经说过：进了赤澳，就一定要带沐浴液。因为如果带肥皂……如果带肥皂，就等着自求多福吧。

      　　陆志廉深以为然。

      　　于是陆sir进赤澳的时候，便是带的沐浴液。不仅沐浴液，勤勤恳恳的陆sir还同时带了洗发水、护发素、洗衣粉，如果不是监狱条件不允许，他恨不得连护肤精华都带埋。

      　　谁曾想还是惨遭了黑手。

      　　这黑手不来源于别人，正来源于一只油光水滑奶牛花色的肥猫。猫的额头上还有一个像斜刘海一样的花色，看上去十分眼熟。

      　　这自然就是元少。

      　　人是白天逮捕的，猫是下一秒变的。当曹元元从那个即将坠毁的飞机上掉下来，扑通一声以极其狼狈的样子一头栽进海里，又被之后紧追而来的陆志廉捞起戴上手铐之后，他又扑通了一次。

      　　陆志廉無言地看着刚套上的手铐瞬间空掉，与之相对的，是船板上一只多出来的虽然湿透但仍气势不减试图用视线把他钻出个洞的肥猫。

      　　……有给猫戴的手铐吗？

      　　

      　　显然，这世上是不存在可以给猫戴的手铐的。同时不存在的，还有在赤澳里关住一只猫的可能性。

      　　经过ICAC、司法部等一班同事和领导的商议，这只名为曹元元的猫的去处被决定了下来。经过讨论，在此次卧底任务中做出最大贡献的ICAC首席调查主任陆志廉再次被推了出来。余Sir的意思呢就是，William你毕竟和它共处了三个月，是最了解它的人。所以为了香港市民的人身安全，这只猫还是交由你来看管比较合适。

      　　当然，作为额外的保护措施，肥猫还是被戴上了电子脚铐。不过由于没有猫腿那么细的电子脚铐，所以这个电子脚铐最终被做成了项圈的形式，套到了猫脖子上。被戴项圈的时候猫极度不配合，总是试图挣脱。一班伙计强行按住猫圆滚滚的身躯，才没被它挣脱出去……或者说完全挣脱出去。

      　　元少不愧是元少。哪怕是作为一只猫，即使有三四个人在按着它，它也依旧能扑出去半个身影，并十分努力地够到了陆志廉，冲着后者的屁股狠狠地咬了下去。

      　　……然后被手忙脚乱的ICAC调查员再次镇压。

      　　至此，一人一猫的生活便成定局。陆志廉就这么拎着一只猫回了公寓。

      　　只不过，生活没有放过他，元少也没有。

      　　傍晚七点的时候，正在厨房煮饭的陆志廉听到客厅传来砰得一声。等他冲进客厅，看到的就是一个瞪着他的，赤身裸体、形容狼狈的曹元元。电子脚铐，哦不，项圈，仍然戴在他脖子上。

      　　陆志廉抓着锅铲站在那里，半晌没说出话。他沉默了一会儿，终于叹气。

      　　“我在煮粥，你要不要来尝一尝？”
  - body: |-
      　　曹元元对着陆志廉的公寓进行了好一番批判。

      　　按他的话来说，陆志廉此人，简直就是乏味无趣的典范。在曹元元还未踏足这间公寓之前，他从未想过ICAC首席调查主任的公寓能够如此寡淡。

      　　灰白色的墙面配上IKEA买来的布艺沙发和玻璃茶几，再加上地板上随意摞着的书堆——陆志廉平时就在这上面办公。在元少这个骄奢淫逸的富二代眼中，这和住在赤澳里到底有什么分别？

      　　也难怪陆志廉自身入局时演得那么习惯。曹元元略带恶意地想。ICAC莫不是故意克扣员工的月粮，以保证这群调查员能在需要卧底的时候迅速由奢入俭。

      　　然而此时曹元元却不得不被困在这个寡淡的公寓里，和同样寡淡的陆志廉两看相厌。他溜达到沙发跟前，嫌恶地瞥一眼沙发的布料，然后坐下，岔开腿，恶意地将自己一丝不挂的下半身对着陆志廉。

      　　“你是不是性冷淡啊，陆sir。”他讥讽道，“公寓装修得这么寡淡，还真是看不出不久前你在男人身下夹紧腿的那副婊子样呢。”

      　　陆志廉不理他，转身走到卧室里去了。曹元元气焰更盛，他三步并作两步跳到卧室里，正准备对陆志廉进行一番更难听、更苛刻的羞辱，却见陆志廉又捧着一叠衣服出来。

      　　“先穿衣服，然后过来吃饭。碗在厨房，你自己舀。”

      　　曹元元的气焰就这么被一叠衣服堵了回去。他低头看了眼手里的衣服，半新不旧，却洗得干净，一丝不苟地叠在一起。曹元元猜想那是陆志廉自己的衣服。他捏着那些衣服，指腹蹭过上面布料的纹理，半晌没说话。最终，他哼笑一声，说陆sir，这么着急让我着衫，你该不会是怕臊吧。

      　　陆志廉没说是，也没说不是。他端着碗坐到沙发上。曹元元自讨了个没趣，只好自己去厨房端碗舀饭。等他端着碗回来，却听到陆志廉说：“屋里有冷气，你不穿衣，感冒了没人照顾你。”

      　　“……”

      　　曹元元不说话了。他端着碗一屁股在陆志廉旁边坐下，瞥了一眼自己脚边堆着的书，抬脚踹了它们一脚。

      　　书堆倒下去。陆志廉叹了口气。他说你要是不愿意在这里住呢，也可以离开。

      　　曹元元嗤了一声：“你不怕我一走了之吗？我的人脉还在，走出这个门，我今晚就能离开香港。”

      　　陆志廉好整以暇地笑。“我劝你不要。”他说，“你脖子上那个电子铐链，会在你有任何异动的时候释放超高电压。我惊你走不出这个门口，就要被电电晕在地上。”

      　　曹元元咬着后槽牙：“那什么叫我可以离开？”

      　　陆志廉仍是那个笑：“睡门厅，不算是异动。”

      　　“……”

      　　

      　　秉承着不要被项圈电晕的原则，晚饭时间相安无事地度过。时间来到九点半。陆志廉睡得早，洗漱得也早。曹元元窝在沙发上，看着陆志廉端着牙缸在洗手台和卧室之间进进出出，突然道：“今晚我睡哪？”

      　　曹元元自觉问这个问题不算找茬，不属于需要睡门厅的范畴。陆志廉的公寓小得像个鸽子笼，只有客厅厨房并一间卧室，卫生间都只有一个。曹元元翘着腿靠在门框上，看着陆志廉从床下拖出一只箱子来，忍不住阴阳怪气：“陆Sir不会想让我睡沙发吧？”

      　　陆志廉看了他一眼，笑了笑。他把箱子里的被褥拿出来，在沙发尾放下。

      　　“今晚呢你就在沙发上凑合一晚。明天我去买折叠床和猫窝。”

      　　曹元元不说话了。他冷着脸往沙发上躺倒，把被子拉到脸。他听到陆志廉轻轻笑了一声，说了句“早点休息”，心想休息个头，陆志廉那个作息到了赤澳外面还跟坐监一样。

      　　客厅的灯很快被熄掉，卧室里传来陆志廉睡下的窸窸窣窣的响动。曹元元闭上眼，却忍不住去想前一天晚上陆志廉睡在他怀里的事。他越想越气，怎么都睡不着，最终一骨碌坐起来，蹬着拖鞋，两三步走到陆志廉床边，一掀被子躺了进去。

      　　陆志廉的身体绷紧了一秒，却又很快放松下来，什么都没说。曹元元面无表情地伸手过去，把陆志廉抓进自己怀里，不轻不重地咬他的肩头。他听见陆志廉轻轻吸了一口气，却仍不作声。于是曹元元咬得更重。直到他听到陆志廉叹了口气，叫他睡觉，曹元元这才满意松口，踏踏实实地搂着他睡了。
