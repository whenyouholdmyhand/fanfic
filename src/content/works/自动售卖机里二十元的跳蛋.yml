title: 自动售卖机里二十元的跳蛋
cp:
  - 花苏
updated: 2026-06-02
summary: 奈布哈尼本以为，读了大学，换一座城市，就不会再下那么多雨，他也就不用再一遍又一遍想达玛拉。可他偏偏来的是西雅图。西雅图一年有八个月雨季，所以他忘不掉达玛拉，又怎么能算他错。
status: ongoing
chapters:
  - title: 连阴雨
    body: |-
      　　“我们分手吧。”

      　　当我说出这句话的时候，我正站在我和达玛拉，或者说，达玛拉自己一个人的家中。但我还是倾向于叫它我们的家，因为我们确确实实曾在这里度过无数个甜蜜又充满激情的夜晚。而另一方面的，我之所以不能称它为“我们”的家，是因为这栋房子的确独属于达玛拉一人，而我，则更像是一个卖艺又卖身的鸭子，在他需要解闷、需要找些不寻常的乐子时才被传召而来。

      　　达玛拉当时正抱着Switch打游戏。他坐在我们一起买的地毯上，靠着我们一起挑的抱枕，怀里还揣了一个上次去游乐场时我给他赢回来的大玩偶，听见这话，头都没抬一下，就只有眉头皱了皱：“分手？那是什么意思？”

      　　我说：“就是……就是以后我不过来跟你一起睡觉了，也不跟你一起出去吃饭了，还有，还有，我可能会跟别人做这些事。”

      　　达玛拉“哦”了一声，视线还是没从屏幕上移开。他不说话，我也就站在原地不敢动。我的手心全是汗——他会说什么？他会不会生气？我甚至有一种荒谬的念头：我若是没说出过那句分手就好了。我若是、我若是可以……但话已经说了出来，就没有再咽回去的道理。所以我能做的，也只有杵在那里等他。

      　　过了一会儿，达玛拉的游戏打完了。他刚刚通了一关，心情甚好。他把手柄随意地丢在一旁，抬头看了我一眼，似乎才有空去想我刚刚说了什么。我不知道他在想什么，但我之前预想过的他的反应全都没有发生。他没有生气，甚至没有太大的反应。他只是皱了皱鼻子，从我的话里挑了一个我想都没想过的问题抛给我：“那做爱也不做了？”

      　　我：“……”

      　　我：“做爱也不做了。”

      　　达玛拉又“哦”了一声。他说那好吧，我要玩游戏了。……你刚说的这个“分手”，包括以后不跟我一起玩游戏吗？

      　　我尴尬地笑了两声，抓着包走了。

      　　直到我走出门，离开这栋我留下不少生活痕迹的房子，离开这片我曾和达玛拉一同打理——主要是我在打理，达玛拉负责乱翻泥巴——的玫瑰园，离开这个我曾悄悄称之为“家”的地方，我都没有听见达玛拉叫我回去。

      　　于是我想，我和达玛拉这次，大概是真的结束了。
      　　
      　　

      　　我与达玛拉的孽缘，开始于我家里不许我买小摊上的酸辣粉。

      　　那是2009年的9月1号，开学日。那时我父母刚因工作调动来到了这座小县城，而我也就被转到了新的学校读小学。我那时只有十岁，正是屁股长钉子坐不住板凳的年纪。我花了整整一天时间，上蹿下跳间和全班的女同学处成了好朋友。她们许诺以后都跟我一同吃午饭、跳皮筋。我很开心，我觉得那是我短短十年人生中最幸运的一天。而更幸运的是，那天放学时突然天降大雨，而我包里恰巧背了伞。

      　　在陆续把需要帮助的女同学们挨个送到她们家长的伞下之后，校门口渐渐空了，只有零星几个卖小吃的推车还留在原地。平时这种地方总是挤满了人，但今天下雨，乌泱泱的学生早如鸟兽状散开，各回各家去了。

      　　只除了一人。

      　　卖酸辣粉的三轮前，我看到一个小孩，黑头发，小只小只的，穿了件霁色白底的校服。他蹲在三轮狭窄的雨棚子下面，半个脊背都是湿的，却不肯走，只盯着老板忙碌的勺子，岿然不动。

      　　我从小的梦想，就是做一个古代那样的骑士，所以我也一直用骑士的标准要求自己。是骑士，就不可以不照顾弱小，尤其是女孩子。我举着伞跑过去，豪情万丈地将伞撑在他头顶。

      　　我想了好多台词：如果他要感谢我，我就要像古代骑士那样说“这是我应该做的”；如果他愿意与我多说几句，那我就可以这样自我介绍：我叫奈布哈尼，请问我可以有幸得知你的名字吗？美丽的小姐。

      　　可他一句话也没有说。他拿到酸辣粉，见我还站在他旁边不走，也不买吃的，以为我是馋他手里那碗粉，就皱皱鼻子：“你也想吃吗？”

      　　这一下可把我准备好的台词全都打乱了。我一时间再顾不得什么骑士风度、什么豪情万丈。其实，我本来也没有很想吃，可那碗热腾腾的、撒着红油和辣椒的酸辣粉闻起来真的太香啦，我却从来还没有吃过。我感到自己的脸热了起来。我咽咽口水，眼睛亮晶晶地盯着那碗粉，又小心翼翼看了一眼那个像小黑猫一样的小孩：“真，真的可以吗？”

      　　他点点头，说当然可以，但你要帮我写作业。

      　　我犹豫了一下，他转身要走，于是酸辣粉战胜了我。我想，助人为乐也是骑士精神。我追上去，拍着胸脯向他保证，说没问题。我还提出，雨越来越大了，他没有打伞，而我家住得近，我们可以去我家写作业。

      　　对此他自无不可。

      　　于是我又问他，我叫奈布哈尼，你叫什么呀？

      　　他说我叫达玛拉。

      　　所以你看，假使我父母管我不那么严，不禁止我在学校外的小吃摊上买吃的，那我就不会没吃过酸辣粉。假使我曾吃过酸辣粉，我也就不会在初遇达玛拉的时候做出此等为五斗粉折腰的丑事。而假使我不曾为五斗粉折腰，我或许就不会认识达玛拉。

      　　因此我也常说，我的一生，就是被一碗酸辣粉毁掉的。
      　　
      　　

      　　我的故乡是一座山城，这与我现在居住的西雅图很是相像。除此之外，秋冬时总是多雨，这也与西雅图一模一样。

      　　达玛拉小时候不爱打伞，更准确来说，他对一切麻烦的东西都不甚喜爱。那时我们的学校在一片矮矮的山地上，每日都需坐巴士往返。巴士不是时时都有的，下了学，总要等上一等。这对不爱打伞的达玛拉来说无疑很是不便。无数次，我们从校门口狂奔而出，他低着脑袋在前面跑，我举着伞在后面追。他的卷曲黑发被雨淋得湿嗒嗒的，黏在他后颈上。但他就好像感受不到一样。他只享受在雨里狂奔的乐趣。

      　　等到了巴士站，达玛拉就会停下来，站在那里等我。不过据我猜测，那只是因为巴士还没有在我赶到之前开来。若是哪天巴士提早来了，我毫不怀疑达玛拉会撇下我自己乘巴士回家。好在，我运气很好，这种情况还从来没有发生。

      　　大雨瓢泼，他不打伞，又跑得汗津津，一停下来，免不了就要打几个大喷嚏。这时候我就要摆出一副故作成熟的样子教训他了（我大他两岁，这也算成熟吧）。我说，你看吧！就说这样会着凉啦。然后从暖水瓶里倒一小盖子水给他喝。他总是撇嘴，但还是接过水喝了，却不想喝完便猛猛甩头，把头发上一连串的水珠全都甩到了我头上。我捂着我精心编好的红发大声惨叫，坚决抗议，他却哈哈大笑，说：“奈布哈尼，你好像个小姑娘！”

      　　不过尽管不愿承认，他说的的确也不错。因为每当公交车哐当哐当驶来，我就会退后两步，站到离马路两步路的地方去，免得泥点溅到我。这样的好处是泥点确实不会把我的衣服弄脏，坏处则是会有其他人赶在我前面上车，导致我时常不得不站着回家。

      　　但达玛拉与我不同。在我退后的时候，他反而会嗖得一下冲上去，像只敏捷的猎豹，霸占一个靠窗的双人座位。见我慢吞吞地上车，他就拍着他旁边的那个空座对我大喊：“奈布哈尼！这边！”于是我就可以坐享其成，赶在其他乘客之前坐到他身边的那个空位去。

      　　而当巴士闷热却暖和的气味包裹住我们，念了一天书的疲倦便会赶上来。即便是达玛拉，在这时候也是会犯困的。广播报了不过两站，达玛拉的脑袋就开始一点一点地往我肩膀上靠。雨珠挂在青绿色的窗户上，整辆车都是灰蒙蒙的。我自己眼皮也打架，便忍不住和他头挨头挨在一起打瞌睡。

      　　但我不忘小声叫他。我说，达玛拉你别睡着啦，一会儿要坐过站了。

      　　可达玛拉却浑不在意。他说过了就过了，大不了到时候再坐回来。

      　　后来有一次我问他，你为什么那么不喜欢打伞。他耸了耸肩，说觉得打伞会让他行动不便。他不喜欢被拖累的感觉，所以不打。再后来，当我的伞被西雅图的山风刮得拦腰折断时，我终于不得不承认，达玛拉的行为，也是有大智慧的。

      　　这样想想，尽管没有那碗酸辣粉，按照达玛拉不爱打伞的习性，我依旧不会不管他。所以达玛拉不爱打伞，不爱被拖累是注定；我遇见他，拖累他也是注定。从这点上来看，一味地将错误归结于一碗酸辣粉，似乎没什么道理。

      　　所以我转将一切归结于那些仿佛下不完的、充斥了我们整个少年时期的连阴雨，并暗自期待，也许换一座城市，就不会再下那么多雨。

      　　而如果不下那么多雨，我也就不用再一遍又一遍想起达玛拉。
  - title: 810寝室
    body: |-
      　　“等等等等打住，所以这和你说的你和达玛拉分手到底有什么关系？你俩那时候加一起有二十岁吗？”

      　　说话的是阿尔图，810寝室的唯一靠谱的人。而他的两个好兄弟兼好室友一个专心致志地在一旁抱着酒瓶当酒蒙子，另一个则趴在吧台上，枕着一只胳膊，对着手机屏幕上的私信哭得稀里哗啦，看上去人已经走了一会儿了。

      　　810寝室的主要问题，来源于阿尔图每天窝在桌前跟对象们煲的6个小时电话粥，奈布哈尼纠结于他和达玛拉的关系而每晚吸溜吸溜度过的网抑云，以及希尔希纳每晚蹦迪到深夜，一回寝室发现灯火通明三人都没睡的鸡飞狗跳日常。其中受灾最严重的当属阿尔图，因为他是他们三个中唯一上早八的人，也是他们三个中唯一要写代码的人。

      　　不知多少个夜晚，希尔希纳揣着他的键盘噼里啪啦地打吃鸡，奈布哈尼拿着一堆瓶瓶罐罐给自己叮叮当当做护肤，而阿尔图……阿尔图只能咬牙切齿地躺在床上，思考自己要是杀了室友多久才会被发现。

      　　好想念句咒语让室友落地成盒眼霜耗光啊。苍天啊，他要睡觉。

      　　但阿尔图的抗议徒劳地湮没在了希尔希纳鬼哭狼嚎的“救救救救救”中，一转头，又看见奈布哈尼被面膜粘着嘴、模糊但龟毛地抱怨：“我也不想敷，可是我最近脸上起了好多小痘痘。”

      　　算了，他阿尔图大人有大量。凑合过吧。

      　　但总之，除去这些事情，810寝室的三人还是关系很铁的。而今天，则是他们一周一度喝酒的日子。只不过这顿酒出了一点小状况。

      　　在夏玛的酒馆，奥斯曼大学边上唯一的清吧里，他们相聚在一起，不为别的，只为了庆祝——或者说悼念——他们的好兄弟，奈布哈尼，那终将逝去的初恋与青春。

      　　说实话，阿尔图并不了解奈布哈尼与达玛拉那些漫长的、没完没了的往事。他认识他们的时候是在大学，而听更早一点认识他们的哲巴尔和法里斯说，这两个人纠缠了少说也有十来年。阿尔图表示叹为观止，尊重，且祝福。但他还是不得不打断奈布哈尼那发散如尿一般展开的回忆叙事，只为了从其中挑出一个他想问很久的问题：“你说你小时候买酸辣粉见到的那个小孩是达玛拉，怎么后来又说那是个女孩？”

      　　此言一出，奈布哈尼哭得更大声了。他刚刚呛进去一口空气，现在正在打嗝。被阿尔图重点完全不对的问题一噎，嗝也就打得更厉害了起来。他眼泪吧嗒吧嗒掉，中间还夹杂着几声“嗝、嗝”，搞得场面一度非常好笑。

      　　“我以为，”奈布哈尼说，“……他是个女孩，嗝，以为了四年，他都没纠正我。呜呜……我从来就不了解他……”

      　　太悲怆了，阿尔图想。奈布哈尼那头精心养护的红发都要被嚎得失去光泽了。他一抬头，正对上勤工俭学当酒保的奈费勒怜悯的眼神。阿尔图顿时一阵恶寒。他决定不朝讨厌的奈费勒那边看，于是移开视线，揉揉自己的耳朵，扭过头继续八卦好兄弟不堪回首的往事。

      　　“喝酒，喝酒。”他给奈布哈尼面前空掉的酒杯再次续满，又一把夺下另一边那个酒蒙子怀里的酒瓶，“希尔希纳你少喝点，就要了这么几瓶子啤酒全下你肚了。……回到刚刚那个问题，你既然这么喜欢达玛拉，为啥还要跟他分手啊？”

      　　希尔希纳嘟囔了句什么，阿尔图没听清。他一门心思全在听奈布哈尼的八卦这边。但奈布哈尼又对着手机屏幕默默流泪去了，没回答他的问题。阿尔图没好意思一直逼问他，只得长叹一声，低头嘬自己的酒杯。又过了一会儿，才听见奈布哈尼的声音闷闷地顺着吧台的木头爬上来：“……因为我不知道我和他是什么关系。”

      　　“什么叫什么关系？”阿尔图大挠其头，“你俩一起吃一起睡时不时做得天昏地暗还拿我们其他人当套使，不就是情侣关系吗？”

      　　“——而且技术上来说你说你分手了，不存在情侣关系就不存在分手，所以阿尔图是对的。”

      　　多完美的逻辑啊，希尔希纳。但奈布哈尼又开始抽噎了，于是阿尔图不得不顶着周围人悲悯的眼神——主要是奈费勒和夏玛的眼神——让他赶紧收声，然后在奈布哈尼又因为哭太猛吸进去更多冷气之前用贝果堵住了他的嘴。

      　　“那你就没问问他什么的？”他循循善诱，“有时候有问题还是要主动提出来，靠猜测是没用的。”

      　　“我也想。”奈布哈尼苦笑。他总算把贝果咽了下去，现在不打嗝了，“可我没有机会。他身边总是有很多人，而我只在他需要我的时候才能到他身边。”

      　　“这我就不同意了。”希尔希纳说，“阿尔图身边也有很多人，他那群对象不也好好的？”

      　　“那怎么能一样！”阿尔图立即抗议，“我是把心碎成一片一片，分给每一个我爱的人。”

      　　此言实在厚颜无耻，奈何在场的三人都没觉得有什么问题。奈布哈尼自嘲地抠他红发上绑的一颗珍珠发串，看得其余几人指甲缝痒痒。

      　　“有时候，”他说，“我觉得我对于达玛拉来说就像一枚他多年前从自动售卖机里买的跳蛋，廉价，也不够刺激。他还会时不时找我，只是因为那是他的习惯。要是没有这个习惯，他可能就把我忘了。”

      　　“所以你就在他把你扔了之前先自己退出了？”阿尔图嘴角抽抽，“那你还挺有体面的。”

      　　奈布哈尼不说话了，他那头张扬的红发也跟着沉默了下来，看起来有点可怜。阿尔图觉得自己说得过分了些，他捅捅希尔希纳，示意他说两句。希尔希纳被肘得“嗷”的一声，但好歹是把脑袋从酒瓶子堆里拔出来了。他清清嗓子，提出一个他能想到的最直接的建议：“那实在不行你打个电话给他呗？”

      　　“对对，打个电话。”阿尔图连忙把手机从兜里掏出来，“你说达玛拉没生气，你给他打个电话，他说不定就不跟你分手了。”

      　　打电话吗……奈布哈尼犹豫不决。但阿尔图却不给他说不的机会。他从通讯录里翻出达玛拉的号码，拨了视讯电话过去。电话响了三声，达玛拉肆意张扬的脸出现在屏幕里：“阿尔图？怎么，你终于把我要的数据模型赶出来了？”

      　　“咳，还没有。”阿尔图讪笑，“陛下，是奈布哈尼有点事。”

      　　“奈布哈尼？他有什么事？”

      　　阿尔图把手机举到奈布哈尼面前，映出奈布哈尼那张眼眶红肿的花脸：“达玛拉……”

      　　他眼圈红得可以，眼泪和鼻涕混在一处，看上去不像二十岁的奈布哈尼，倒像是小时候的他。这让达玛拉觉得新奇，不免多看了他两眼：“你被人揍了？”

      　　“没有……”奈布哈尼摇头。他吸吸鼻子，又问，“达玛拉，你什么时候回家啊？”

      　　“不知道。我在游轮上呢。”

      　　他显然早忘了奈布哈尼说的什么“分手”不“分手”。又或许，那在他看来根本就不重要。鉴于奈布哈尼生命体征看起来还算稳定，旁边还有阿尔图和希尔希纳，一时半会儿应该死不了，他的注意很快便被视频那边的海风、香槟与纤细的手臂转移了去。他丢下一句“阿尔图你赶紧把模型给我赶出来我下周一要用”就挂了电话，留下屏幕这边的三人一时无言。阿尔图试探着叫了声奈布哈尼，奈布哈尼没应，他也就不知道还能再说什么，只好拍了拍好兄弟的肩膀，以此告慰他那应该不会有机会挽回的爱情。

      　　“往好里想，”他为奈布哈尼满上一杯酒，“起码在他眼里所有人都是一根按摩棒，或者跳蛋，或者其它什么的。至少你现在自由了。”

      　　奈布哈尼勉强地配合笑了笑，却没有再说话。希尔希纳见不得气氛如此沉闷，索性举起酒杯，大声叫道：“干杯！”

      　　“干杯！”

      　　于是再没有人去提奈布哈尼是否能够真正自由，也没有人知道他与达玛拉的这段感情是否真的能在此处结束。在这一刻，这些似乎都不再重要。重要的只有酒精，吧台上方昏暗而柔和的暖橘灯光，以及远处朱娜轻柔的歌声与吉他。
  - title: 番外：关于好兄弟失恋叫我去喝酒消费却由我埋单这件事
    body: |-
      　　自从上一次奈布哈尼分手后在夏玛的酒馆哭得天崩地裂之后，阿尔图就给自己立下了三条规矩：

      　　室友失恋后的酒席，不去

      　　室友喝醉后的账单，不买

      　　奈布哈尼若想提起达玛拉，则每五分钟需支付十元，不满五分钟按五分钟计费。

      　　他之所以这么做，原因也有三：

      　　先是希尔希纳，这位酒蒙子在喝到第十六瓶酒的时候，终于不负众望地吐在了地板上，被延迟下班的奈费勒狠狠罚了五十块钱；

      　　再是奈布哈尼，醉得就差没现原形（阿尔图觉得他大概是只狐狸），抱着吧台喊达玛拉怎么拽也不撒手。阿尔图好话歹话都说尽了，也没能让他把手松开。崩溃如阿尔图，最后不得不装作达玛拉的样子，大吼：“我爱你啊！我爱你行了吧！”

      　　结果奈布哈尼没反应，话被希尔希纳接了去：“我也爱你啊兄弟！我也爱你！”

      　　而阿尔图只想让这两个人都滚开，越远越好。

      　　这最后一点就是奈费勒了。

      　　那天最后，天边鱼肚翻白，这位酒保终于忍无可忍选择了下班。他说打烊的时候阿尔图从未如此对他感恩戴德，因为那代表着这场闹剧终于可以宣告结束。但坏消息是，鉴于另外两人都已不省人事，唯一还清醒着的阿尔图成了那个付账单的人。

      　　他付清了希尔希纳的罚款，又喊来的士掏出巨额小费拜托司机把这两个酒鬼运回宿舍楼去，期间却一直遭受着来自奈费勒的一系列奇怪的眼神，气得他脑瓜子嗡嗡响。愤怒的阿尔图决定战斗。他率先出口相讥，口若悬河，口蜜腹剑，妙语连珠，然后没吵过。兵败如山倒之下阿尔图不得不揉着自己生疼的脑袋瓜离开酒馆，发誓以后他再掺和奈布哈尼和达玛拉的破事他就是狗。

      　　不过，话又说回来了，这难道由得了他吗？奈布哈尼是他的好兄弟，他自己还在给达玛拉打工。阿尔图长叹一口气，意识到自己未来十几年大概都和这对狗男男难舍难分了，顿时觉得人生无望，前途一片黑暗。他又累又困，破财还没消灾，却也不想回宿舍再跟那两个不省人事的酒鬼继续较劲，索性翘了早上的课，在“再破财打辆车去华盛顿湖边上散心”还是“省点钱到楼下法拉杰的宿舍补觉”之间纠结了不到半分钟，毅然决然地选择了后者。

      　　什么叫经济基础决定上层建筑啊，阿尔图想。奈布哈尼还钱啊！

      　　然而，由于他的模样实在太过狼狈，挂着两个大黑眼圈不说还一身酒气，把刚刚睡醒、穿着小熊睡衣来开门的法拉杰吓得不轻。绿毛青年连着追问了好几声阿尔图学长你还好吗？但他的阿尔图学长已经沾床就倒，也不知是睡了还是昏了。

      　　于是等到第二天，当奥斯曼大学的学生们打开手机，一如往常地查看学校的花边小报时，就发现上面又多出了几篇洋洋洒洒的，诸如《阿尔图学长含辛茹苦，为人奉献，实乃吾辈表率》的雄文，看得众人啧啧称奇，道阿尔图不愧是奥斯曼大学优秀学生，“苏丹”座下的第一牛马。

      　　不过，这就是后话了。
  - title: 一本日记
    body: |-
      　　我是被阿尔图一路架着回家的。至少据他所说是这样。
      　　
      　　我们碾着西雅图清晨被水雾弄得湿漉漉的油柏路，穿过15号大街往宿舍走。大麻和快餐店炸薯条的气味迎着风飘进鼻孔里，我却没有心情去搭理，只揽着阿尔图的肩膀，一个劲问他：“你说，达玛拉真的从来没有爱过我吗？”
      　　
      　　阿尔图不想和我这个醉汉计较，也可能是他想计较，但被整宿地折磨下来，也再没有力气计较。总之，他也揽着我的肩膀，顺便把我爪子挪开，以免自己被我掐死：“没有，没有，他爱你，他最爱你了。”
      　　
      　　这一切都是阿尔图第二天早上告诉我的。我对这些却并没有印象。我可能真的问了这些问题，也可能我并没有真正问出来，而这一切都是阿尔图为了报复我让他结账的说辞。但无论如何，这的确像我说话的风格，故而我也无法求证。
      　　
      　　阿尔图把我运上的士就自己离开了，我却扒着那个车门把手不肯放。我问他：“你真的爱我吗？”
      　　
      　　阿尔图敷衍地道：“我爱你，我也爱你，行了吧。”
      　　
      　　我这才终于放过他。他扣上车门，我就不省人事了。
      　　
      　　再醒来的时候是在宿舍门口。显然，无论拿多少小费给的士司机，他都是打不开宿舍的门禁的。不过也得亏是阿尔图出手大方，他好歹把我头朝上放在了台阶上，我才不至于被自己的呕吐物呛死。风吹得我的大腿有些凉，我一个激灵坐起来，正赶上一个女生拿着手机打算叫救护车。她尖叫一声，我也尖叫一声。她喊的是“我的老天你没死！”，我喊的是“我的老天你可别叫救护车！”
      　　
      　　我咳了一声，把我那头乱糟糟的红发往后拢了拢。我猜我现在的形象一定不怎么样。我说：“抱歉，女士，让你担心了。不过我没事，只是喝醉了。”
      　　
      　　她狐疑地看了我好几眼，见我神志清醒，说话似乎也像个人，终究是把手机放下了。我歉意地站起来，为她让出走道。她走过去了，又回头看了我一眼：“……你是奈布哈尼？”
      　　
      　　“是。”我尴尬地笑。我倒想说我不是，可我有我的原则，我是不会哄骗女人的。
      　　
      　　她“哦”了一声，又道：“我叫法德耶。我在……‘苏丹’的聚会上见过你。”
      　　
      　　听见那个名字又一次从素不相识的人口中说出，我一时间有些恍惚。但我没有让自己失态太久。我再次向她感激地笑笑，转身走了。
      　　
      　　等到我坐上电梯，按下电梯上的那个数字8时，我才有时间去想。
      　　
      　　我想，我只是和达玛拉分手了。但这一天以来发生的也不全是坏事：起码我醒得很及时，省下了两千刀。
      　　
      　　
      　　
      　　回到寝室我便开始收拾东西。我放在达玛拉那的东西不多，大多只是一些衣服和生活用品。如今这些东西被快递回来，也只不过三个箱子。
      　　
      　　但达玛拉放在我这里的东西很多。尽管他光临我寝室的次数很少，但两年下来，也有数十次。他每次来，都总要带点什么，以便他想用的时候比较顺手，不用再叫doordash或是出去买。但他又总不记得带走，事后也总忘来拿，一来二去，我的寝室便被堆得仿佛“达玛拉的专属仓库”，每次他想要什么了，就打电话给我：“奈布哈尼，你把那个什么什么拿给我，下午就要。”
      　　
      　　这些事想起来没完没了。我和达玛拉认识的时间太长，长得几乎比我不认识他的时间还要再多两倍。所以这笔账，我们是无论如何也算不清的。想清楚这些，我便不再想那些七七八八的事，只把裁纸刀翻了出来，开始开箱子。
      　　
      　　第一个箱子是衣服。没什么好说。上中学的时候达玛拉总说我的衣服像小姑娘一样花哨，但我坚持那只不过是讲究。——追求贴肤度又有什么错呢？我这样据理力争。据理力争的次数多了，他也逐渐受了些我的“熏陶”。如今他的衣服也多用真丝一类，剪裁得可比我的要精细得多。
      　　
      　　第二个箱子是洗护用品。收拾的时候我才发现我不小心把达玛拉的面膜装回来了。他会用这些东西，不意外地，也是受我的影响。但我怀疑他会不会留意到他的洗手台上少了一盒面膜。就像他大概也不会留意到他的房子里少了一个我一样。
      　　
      　　第三个箱子是杂物，也是我最不愿意开的一个箱子。杂物，意味着什么都有。什么都有则意味着接下来我什么都有可能翻到。回忆太多，每一个回忆都附着在一件物品上。就好像一把又一把钥匙，打开一扇又一扇门。

      　　这些门里，就有一扇，名叫一本日记。

      　　达玛拉大约已经不记得这个日记本了，但我还记得。这是我们上小学时我买给他的。

      　　那个时候，高年级的女孩子们都流行写日记。在我们小时候的那个年代，日记本总被做得花里胡哨，再带上一个密码锁，密码只有亲近的好朋友才知道。

      　　可达玛拉却不写。起初我以为是他没有日记本。作为他的最好的朋友、忠心的骑士、知心的奈布哈尼，别人都有的东西我自然也要保证达玛拉会有。于是我偷偷砸开一个存钱罐，用里面存下来的零用钱买了一个日记本给他，他却只是新奇地扫了两眼，然后便兴致缺缺地把它收进抽屉里，再也不用了。

      　　我很好奇，忍不住问他：“你怎么不写？”

      　　达玛拉正忙着埋头看桌兜里的漫画书，没空理我。听见我问他，便皱皱鼻子，说写那个做什么？

      　　于是我掰着指头跟他算。我说：“首先，你可以写你最喜欢谁呀。其次你可以写你最喜欢的那个人喜欢谁呀。其他女生都这么写。”

      　　但达玛拉头也没抬。他又翻过一页漫画书，说我最喜欢下节大课间能去小卖部给我买巴西烤肉的人。

      　　我立即抗议：“可是你上次吃那个都闹肚子了！”

      　　达玛拉说哦。那你去不去？

      　　我说……我说那我要是去了，你是不是就最喜欢我呀？

      　　达玛拉没说话。

      　　可那时我是一个乐观的奈布哈尼。我想，达玛拉这么说了，肯定就是最喜欢我呀。于是下节大课间的时候我十分没有原则地、飞快地奔向了门口的小卖部，速度甚至快过一只枣红色的马。

      　　但劝达玛拉写日记的事也就这样不了了之。

      　　如今这扇门又被我打开。我翻开那些日记，隔着十年，窥向了十年前的奈布哈尼和达玛拉。

      　　可幼年的奈布哈尼又有多少事情值得写呢？他那时过得太幸福，太快乐，每天都有达玛拉在他身边陪我一同上学、一同放学，甚至有时也一同回家。

      　　所以很快，那本日记也就被他忘在脑后，不记得了。

      　　如今这本日记被翻开，上面果不其然只有一些零零碎碎的吃了什么、玩了什么、看了什么小人书，以及很多很多的达玛拉。

      　　日记翻到第一页，上面画了一只简笔画的黑色小猫。那是第一篇日记。

      　　在那篇日记里，幼年的奈布哈尼歪歪扭扭地写：今天给达玛拉买了巴西烤肉，虽然他又吃坏肚子了，但达玛拉说我是他最喜欢的人。

      　　我看着那行“最喜欢的人”，笑了笑，把日记本合上了。

      　　

      　　可是今天我又开始写日记了。

      　　西雅图下了大雨，道路湿漉漉的。我出不去，又想起了那本日记。

      　　于是我想，为什么不写下去呢？活人变得比物快。从小山城到西雅图，行李箱的轮子碾着时间碌碌滚过，泥点溅在小腿上，十年过去，空气中潮湿的气味竟与十年前没什么分别。

      　　有人问我，奈布哈尼，你爱故乡吗？我总说不知。其实何谓之爱，何谓之不爱呢？当一样事物从你出生时就已陪伴着你，在你生命中的每一天出现，你熟稔它，就犹如你熟稔呼吸。你会说你爱呼吸吗？

      　　就像我对达玛拉的感情。我们相识太早，我认识他的时间，比我的年岁小不了多少。到如今，我认识他竟比我不认识他还要长。

      　　我爱他吗？我不知道。但我知道，要我忘记他，就好像要我忘记呼吸。

      　　归根结底，是一件不可能的事。
