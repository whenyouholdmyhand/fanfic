title: 都说要少食点烟啦
cp:
  - 洛风
updated: 2026-11-01
summary: 陈洛军的粉色polo衫穿了个洞，而信一通过这个发现了什么。
status: finished
chapters:
  - body: |-
      陈洛军的粉色polo衫穿了个洞。此事还是信一打牌时发现的。

      陈洛军的衣服本就不多，除去他刚入城寨时穿的那一身，现在这身衣服还是当初信一送给他换洗的。信一知道他一向爱惜自己仅有的这些衣物，连干活时都要注意着不要把油星蹭到衣服上，生怕洗不出。故而这个洞的出现就变得十分不同寻常，十分值得他们另外三个好兄弟八卦，哦不是，关心一番。

      他们七嘴八舌地猜了好半天，摸牌的速度都慢了起来。陈洛军支支吾吾说不清楚，只说是不小心的，下次他攒够钱，再赔给信一一身新衣服。但信一对光头仔赔不赔他衣服并不在意，反正都是送出去的东西，他也没小气到要要回来。他只是好奇：“不小心？怎么个不小心法，平时走路也挂不到这里呀。”

      陈洛军头埋得像鹌鹑，生怕他面前的那一溜差一副牌就杠出来的十八罗汉挡不住他的脸似的：“反正就是……没注意弄的……”

      四仔打了张幺鸡，被十二碰走了。他眯着眼睛看了那个洞一会儿，认出道：“这是火星子烫的吧？”

      什么火星子能烫到这儿？信一更加惊奇，他上上下下对着洛军胸口的那个洞研究了一番，说你送煤气罐的时候罐子漏了？

      陈洛军不说话了。他把头埋得更低，只专专心心摸他的牌。他今天下午已经输了小半个月生活费了，如果这把再点炮，恐怕连这个月要还龙哥的债都还不起。

      说到龙卷风……陈洛军的脸又红了起来。没人比他更清楚他衣服上这个洞是怎么来的了。说到底都怪自己不好，他嘴笨，想劝龙哥少抽点烟也想不出什么好听的话。那天在他第一百零一次像个坏掉的录音带一样重复那句“龙哥你不好食这么多烟啦你已经咳嗽得够厉害了”的时候，耳朵起茧的龙卷风终于一翻身把他压到了身子底下。大佬意外颇具肉感的臀部挤压在他不可名状的部位，成功阻止了陈洛军第一百零二次的复读。他傻愣愣地看着自家大佬叼着还没熄灭的烟来解自己的裤子，嘴边的话顿时化作别的什么东西一股脑涌到腹部以下。小狗热烈执拗的欲望硬邦邦顶着龙卷风的大腿，好半天才听清刚刚龙卷风是抱怨他怎么这么啰嗦。

      “龙哥，我……”陈洛军更结巴了。但龙卷风只是笑了笑，用一个吻把他剩下的傻话全堵了回去。

      龙哥还是第一次这么主动，陈洛军想。虽然他和龙卷风的关系已经悄悄持续了一段时间，但大佬似乎总是沉寂的，包容的，像一潭干涸的井。陈洛军不懂他为何总是露出那种悲伤的神情，但如果可以，他更希望看到龙哥开心一些。就像那天一样。

      想到那天，陈洛军感到自己裤腿的空间又逼仄了起来。被龙哥骑着……自然是好，但那样的姿势不可避免地会带来一些问题，比如龙哥忘记掐灭的烟掉了烟灰到他衬衫上，使陈洛军本不富裕的衣服存量雪上加霜。

      但这些事情自然是不可以给信一他们知道的。陈洛军对着刚摸上来的牌扮鸵鸟。他隐隐约约猜到这个牌不能放，但他此时实在是找不出别的牌可以打了。那厢信一还在追问，陈洛军眼一闭：“四条！”

      就这样，他这个月的另外一半薪水也没有了。

       

      薅了好兄弟狠狠一顿羊毛的信一心情很好地回到了飞发铺。飞发铺已经收工，店里熄了一半灯，只留了几盏白炽灯滋滋地发出响动。龙卷风正在扫地，目光却一直定定地盯着电视里播的猫和老鼠。信一站在自家大佬旁边一起看了一会儿动画片，随口就聊起了下午打牌时发现的新鲜事。

      “光头仔也不知怎么搞的，”他说，“扛煤气罐把衣服烫出了个洞。虽然也不一定是扛煤气罐烫的，我们问他，他也不说。”

      龙卷风瞥了他一眼，没说话。信一奇道：“怎么大佬你也是这个表情？今天下午洛军也是这个表情。难道扛煤气罐这么费衣服？要不我再去给他送几件，我那还有好多不穿的衬衫。”

      龙卷风把他赶到二楼去了，叫他年纪轻轻别这么八卦。有空不如去把账对了，过两天还要去秋哥那里交租。

      信一哦哦两声，摸不着头脑地走了。他总觉得他大佬方才的反应有点怪，却又想不通是为什么。

      难不成大佬想自己给洛军买衣服？信一迷茫地猜测。那他大佬真是个好人哇。不仅平日要照顾城寨大大小小的琐事，连给后生仔买衣服的事都一并操心了。

      只是第二天，当他给四仔说起大佬打算给洛军买衣服的事时，四仔的反应比龙卷风还要奇怪。但当信一再追问，这个本就寡言少语的医生却更加闭紧了嘴巴，什么都不肯再说了。

      信一觉得他们一个二个都怪怪的。

       

      另一件奇事发生在几天后。

      这天信一起了个一大早，正撞到龙卷风在水池边上洗床单。这本不稀奇，可算上这次，这半个月他家大佬已经洗了三次床单了。天气也没热到睡觉会出这么多汗的程度吧……他刚要凑上去，想问问龙卷风需不需要自己去储物间拿个薄一点的被子给他，却眼尖看到那张床单上沾了些不同寻常的痕迹。

      信一不敢再看，一溜烟跑了。他骑着摩托跑到四仔的医馆，神神秘秘道：“我发现一件事。我大佬好像恋爱了。”

      “……”

      四仔不是很想跟他聊这个话题，但信一的嘴却仍在呱唧：“但也不对啊，我都没见过大佬和哪个女仔搭话……难不成是玛丽？”

      四仔把头扭回去赶那几个赖在这里看咸片的“病人”。信一狐疑地抓住他一只袖子：“喂，你不会知道什么吧？”

      四仔只叫他闪开。

      信一自然不可能闪。他正要再问，医馆的门嘎吱开了。陈洛军从屋外进来，仍穿着他那件穿了隆的polo衫。

      “我来拿活络油。”他拘谨地说。信一问他：“你胳膊脱臼的伤又复发啦？”

      陈洛军摇摇头，说不是他，是龙卷风。

      信一更奇怪了。他在一旁听着四仔交代洛军一次洒多少量，用多大力度揉腰，终于忍不住问：“我大佬腰不舒服？”

      洛军的脸诡异地红了一下，拿着油跑了。

      信一看得大挠其头：“他脸红什么呀？”

      四仔转身就走。信一一把把他扯回来：“不对，这里面肯定有事。快说，不然下个月涨你房租。”

      医生只得从牙缝里往外挤话：“你就没发现，洛军最近经常去找你大佬？”

      “发现了啊，他欠我大佬钱嘛。”

      “所以？”

      “所以……所以光头仔打算通过给我大佬拉皮条还债？不会啩，他有这个脑子吗？”

      “……你有这个脑子吗！”四仔把他赶出去了。他说他是外科大夫，医不了傻子。

      此茬话便不了了之。

      回去的路上信一一直在思考洛军到底从哪里给他大佬介绍的对象。他想得出神，连自己已经走到飞发铺门外了都不知道。直到门内发出哐当一声响，像是有人不小心踢倒了什么东西，接着又是几声细碎的、断断续续的喘息。信一不疑有他，只以为龙卷风有什么事，推门进去，却只见到龙卷风坐在沙发上，领子有些凌乱。而洛军则站在一旁，努力让自己呼吸得不要那么大声。

      信一：“……”

      他的脑子突然好使了。四仔便秘的表情出现在他脑海里，连着床单上的痕迹、洛军衣服上那个洞，把一切零零碎碎的线索都串了起来。

      信一张了张嘴，果断把门关上了。

       

      等到四仔又接待了两个病人，再把一个人的手给接上，就听到一阵隆隆的摩托声飞驰而来，接着是信一的大叫：“你怎么不早说我大佬和洛唔唔唔唔唔唔唔——”，惊得他赶紧扔下手里的活，一把把信一后面的话给捂了回去。

      医者仁心，四仔想。扑街黑社会只是反应慢，但他还值得见到明天的太阳。
