title: 镇痛剂
cp:
  - 峯古
updated: 2026-11-01
summary: 古天乐不知道自己看了多久
chapters:
  - body: |-
      　　古天乐不知道自己看了多久。

      　　或许是二十年前的惊鸿一瞥，或许是时间留下的沙痕太深，在他能够意识到之前，他便已然陷于一处他无法走出的沼泽。向前，或是向后，都只会越陷越深。没有正确的选择。

      　　今天是城寨的开镜仪式。日程表翻过一页又一页，有意无意的，终于来到了今天的这页。

      　　他与林峯已有一年未见。工作连着工作，封城连着封城，算起来，上次他见他还是那一次。2019年的7月。他们最后一次“说话”。

      　　当时他们在忙着寻秦记电影的拍摄，林峯同时还在准备巡演。巡演的最后一站在上海，早前媒体已经问了许多次，会不会去阿峯演唱会做嘉宾呀？媒体问，粉丝问，阿峯也在问。

      　　可古天乐没有答。不是他不想答，是他不知道怎么答。

      　　他的阿峯今年四十岁。他认识他时，他才不到二十岁。

      　　二十岁的阿峯稚气未脱，脸蛋晒得像黑煤球，连婴儿肥都未褪去。他刚入演艺圈没多久，总说自己还需要学习，每天就搬着小板凳，像个小尾巴一样坠在古天乐身后，“阿哥”长“阿哥”短地唤他。不拍戏的时候，古天乐去哪，他就跟着去哪。古天乐吃叉烧，他就眼巴巴坐在旁边看。古天乐被他看得浑身不自然，以为他是想吃，便问他要不要一起。可那个婴儿肥的脸蛋却诡异地红起来，遮掩在黑得像碳的肤色下，只一个劲摇头，说他不是想吃。

      　　古天乐不明白他在想什么，又不善言辞，故而不再问，只低头吃自己的。一抬头，婴儿肥却还在看他。

      　　那时他们拍的也是寻秦记，古天乐的最后一部电视剧，阿峯的第二部。

      　　寻秦记拍得辛苦。后半段拍摄的时候古天乐生了一场大病，几乎没了半条命。从那之后古天乐便不再拍电视剧，转拍电影。可二十年过去，兜兜转转，分分合合，阿峯却还是在他身边。

      　　古天乐又想起了他们那场对话之前的上一场对话。

      　　那天他们刚好结束一天的拍摄，阿峯依旧过来寻他。只是同二十年前不同，这次他不是坠在他身后，他是坐在他身旁。

      　　他们保持着一种没有约定，没有许诺，没有距离的关系，不长不短，已有一年。他们挨得太近，早已近过友情的距离；他们又离得太远，远过光可以照到的地方。

      　　古天乐被他搂在怀里，困得连眼睛都快闭上。阿峯的手搭在他太阳穴上，帮他轻轻地揉。房间里时钟的指针一下一下地走，不知走了多久，他突然听见阿峯问：“最后那场演唱会，要不要来？”

      　　古天乐“嗯”了一声，没说去，也没说不去，只掀开一只眼皮，轻哂着开他玩笑：“不让我唱今期流行就行。”

      　　“不唱今期流行，”阿峯说，“唱男朋友。”

      　　这下古天乐另一只眼皮也掀开了。他有些诧异，便支起身子看他：“男朋友？怎么想让我唱这个？”

      　　阿峯似是犹豫了一下，他按摩的手停下来，神情却坚定：“对，唱男朋友。我们合唱。”

      　　古天乐不说话了。他不说话，阿峯也沉默。又过了许久，他听到自己故作轻松的声音：“你知道，我唱歌不行的。”

      　　阿峯半晌没动。他的嘴巴张开，想说什么，没说出来，于是又闭上。古天乐叹了口气，又哄他：“我会给你录vcr的。”

      　　阿峯是怎么回答的来着？古天乐记不清了。再记起的时候已是数月之后，他接到阿峯的电话。电话那边的阿峯比以往的任何一次都沉默。

      　　古天乐听到他说：“我要结婚了。”

      　　这句话来得比他想得快，他却听到自己心里的石头落下去。他听到一个人在问，声音是自己的：“恭喜恭喜，什么时候？”

      　　“九月领证，”阿峯说，“十二月公开。”

      　　古天乐不知道该说什么，于是他说“知道了”。扬声器里的电流滋滋作响，电话却依旧没有挂。又过了一会儿，他又说：“寻秦记要拍完了，你下周别过来了。”

      　　“阿哥你听我说，”阿峯的声音一下急了，“那只是——”

      　　古天乐却不想他说下去，只重复道：“戏拍完了，你下周不用来看剧本了。”

      　　他知道阿峯要说什么。他认识阿峯二十年，了解他甚至比自己更多。他知道阿峯想同他说，那只是一场协议；他知道阿峯想同他说，他爱的人始终是他。

      　　话已明于心，便不必再讲出口。但选择既已做出，便不可再回头。

      　　况且还能说什么呢？他不可能让阿峯与他公开，林峯不可能不结婚。从一开始，他们走的就是一条没有结局的路。

      　　古天乐突然觉得好疲惫。于是他对林峯说，也对自己说：“你没得选，我也一样。”

      　　可阿峯却说：“我可以选。我不在乎。”

      　　古天乐说：“可我在乎。”

      　　那便是他们的最后一场对话。

      　　2019年9月，林峯在香港注册结婚。12月，这件事如期曝光。

      　　9月26日那天，古天乐握着手机，他在编辑一条短讯。对话框那边的人没有备注，上一次讯息停留在两个月前。光标一隐一现，寥寥数字打出又删去。最终他打下“新婚快乐”，又逐字删去。什么也没发。

      　　那天晚上他在博客写，“用平常心去接受已经发生的事，尽可能用宽阔的心，去包容对不起我们的人。”

      　　可熄了手机，又觉得没什么意思。

      　　阿峯何曾对不起他。

      　　林峯结婚的消息曝光后，记者逢他便问，“阿峯结婚了，你有没有话同他说喔？”

      　　古天乐无话可说。但他想起那条没发出去的讯息。于是他说：“那就祝福他咯。”

      　　再接下来便是更多的工作，然后是疫情。林峯被封在内地，他则留在香港。他对自己说，阿峯已经选择了。他对自己说，可以放下了。可放下不代表可以视而不见，电影要拍，工作要做，公司上下几千口人要发人工。郑保瑞来找他，想他投拍城寨。他说可以，但男主角要是林峯。

      　　于是时间推着他走，终于来到了今日，来到了城寨的开镜仪式。

      　　为了演陈洛军，林峯壮了许多，也黑了许多，连头发也剃成短短的寸头。当他走到古天乐面前，古天乐一时之间竟有些恍惚。

      　　他听到林峯喊：“老板。”

      　　声音与二十年前那个黢黑的婴儿肥重合在一起，仿佛他喊的是“阿哥”。

      　　林峯前阵子和妻子上了内地的综艺，此事一班同事或多或少都有听说。他那场综艺是抱着妻子出场的，同事见他过来，便纷纷开他玩笑，调侃他拉风的出场，说峯哥，好劲喔。

      　　林峯笑笑，没有接茬，视线却下意识瞥向了古天乐的方向。古天乐意识到他在看自己，便也跟着笑，说是啊，好劲喔。

      　　话便被这么揭了过去。

      　　所有人都知道古老板是工作狂，想必是没有时间看这种综艺的，跟着调侃，大概只是对自己的头马表示亲昵罢了。

      　　但只有林峯知道，综艺播出的那天，他同妻子坐在电视机前一同看。他看着看着，下意识就划开了手机里一个熟悉的对话框。

      　　对话框的人没有备注，上一条讯息停在2019年。林峯下意识想要发些什么，却见顶上的名字一跳，变成了“正在输入中”。

      　　林峯盯着那串“正在输入中”看了许久，直到最终它消失不见，变回名字，他才重新熄了手机。

      　　讯息仍停在2019年。

      　　回过神，开镜仪式已进行到最后。拍大合照的时候林峯习惯性溜边，却被老板提溜到了中间，就像那年古天乐生日，他也是这么被他揽到自己身旁的。

      　　他们的手臂挨在一起，手背贴着手背，似是要拉谁的手，却没有拉上。

      　　风从中间吹过去，静悄悄地，谁也不知道。
